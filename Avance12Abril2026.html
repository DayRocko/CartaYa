    // =========================================================================
    // WIDGET: MI RESTAURANTE (CONFIGURACION)
    // =========================================================================
    function ViewMiRestaurante() {
      const [loading, setLoading] = React.useState(true);
      const [saving, setSaving] = React.useState(false);
      const [message, setMessage] = React.useState(null);

      const [formData, setFormData] = React.useState({
        nombre: "", nit: "", razon_social: "", direccion: "", ciudad: "", telefono: "", email: "", propietario: "", sitio_web: "", logo_url: "",
        regimen_tributario: "simplificado", responsable_iva: false, impuesto_consumo: true, resolucion_dian: "", prefijo_facturacion: "", rango_desde: "", rango_hasta: "", fecha_vencimiento_resolucion: "",
        zona_horaria: "America/Bogota", hora_apertura: "08:00", hora_cierre: "22:00", hora_corte: "02:00", dias_activos: ["LUN", "MAR", "MIE", "JUE", "VIE", "SAB", "DOM"], capacidad_mesas: 0, capacidad_sillas: 0,
        modalidades: { salon: true, delivery: false, para_llevar: false }, propina_porcentaje: 10,
        medios_pago: { efectivo: true, tarjeta_debito: true, tarjeta_credito: true, nequi: true, daviplata: false, transferencia: false, rappi_pay: false, vale_alimentacion: false, cortesia: false, credito_cuenta: false },
        canales: { salon_comision: 0, delivery_propio_recargo: 0, rappi_comision: 28, domicilios_comision: 22 },
        alertas: { email_alertas: "", umbral_ventas_meta: 85, umbral_prime_cost: 65, alerta_stock: true, resumen_diario_hora: "23:00", reporte_semanal_dia: "LUN" }
      });

      React.useEffect(() => {
        const loadProfile = async () => {
          try {
            setLoading(true);
            const resp = await fetch('/api/restaurante');
            if (!resp) {
              throw new Error('fetch() para restaurante retornó undefined');
            }
            if (!resp.ok) {
              throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            }
            const d = await resp.json();
            if (d && Object.keys(d).length > 0) setFormData(d);
          } catch (err) {
            console.warn('Fallback Perfil:', err.message);
            setFormData(prev => ({ ...prev, ...MOCK_DATA.restaurante }));
          } finally {
            setLoading(false);
          }
        };
        loadProfile();
      }, []);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(p => ({ ...p, [name]: type === 'checkbox' ? checked : value }));
      };

      const handleNested = (c, f, v) => setFormData(p => ({ ...p, [c]: { ...p[c], [f]: v } }));
      const handleArray = (f, i) => setFormData(p => {
        const arr = p[f] || [];
        return { ...p, [f]: arr.includes(i) ? arr.filter(x => x !== i) : [...arr, i] };
      });

      const getProgress = () => {
        const reqFields = ['nombre', 'nit', 'razon_social', 'direccion', 'ciudad', 'telefono', 'email', 'propietario', 'regimen_tributario', 'resolucion_dian', 'prefijo_facturacion', 'rango_desde', 'rango_hasta', 'fecha_vencimiento_resolucion', 'hora_apertura', 'hora_cierre', 'hora_corte'];
        const filled = reqFields.filter(x => formData[x] && String(formData[x]).trim() !== '');
        return Math.round((filled.length / reqFields.length) * 100);
      };

      const getDaysUntilExpiry = () => {
        if (!formData.fecha_vencimiento_resolucion) return 0;
        const diff = new Date(formData.fecha_vencimiento_resolucion).getTime() - Date.now();
        return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
      };

      const isExpiring = () => {

    // VISTAS PLACEHOLDER (Para evitar errores de renderizado)

    function ViewPOS() {

      const posProducts = [

        { id: 2, name: 'Churrasco 300g', price: 42000, cat: 'Parrilla', emoji: '🥩', tag: 'popular' },

        { id: 9, name: 'Jugo natural', price: 8000, cat: 'Bebidas', emoji: '🍊', tag: 'veg' },
        { id: 10, name: 'Cerveza artesanal', price: 12000, cat: 'Bebidas', emoji: '🍺', tag: 'popular' },
        { id: 11, name: 'Agua mineral', price: 4000, cat: 'Bebidas', emoji: '💧', tag: '' },
        { id: 12, name: 'Brownie con helado', price: 16000, cat: 'Postres', emoji: '🍫', tag: 'new' },
        { id: 13, name: 'Cheesecake', price: 14000, cat: 'Postres', emoji: '🍰', tag: 'popular' },
        { id: 14, name: 'Papas fritas', price: 9000, cat: 'Adiciones', emoji: '🍟', tag: '' },
        { id: 15, name: 'Patacones', price: 8000, cat: 'Adiciones', emoji: '🫓', tag: 'veg' },

      const categories = ['Todos', 'Platos fuertes', 'Parrilla', 'Entradas', 'Bebidas', 'Postres', 'Adiciones'];

      const subtotal = orderItems.reduce((acc, item) => acc + item.price * item.qty, 0);

      disc = Math.min(disc, subtotal);
      const iva = (subtotal - disc) * 0.08;
      const total = subtotal - disc + iva;

      const handleAddProduct = (p) => {
        if (p.tag === '86') return;
        const existing = orderItems.find(x => x.id === p.id && !x.mods);
        if (existing) {
          setOrderItems(orderItems.map(x => x.id === p.id && !x.mods ? { ...x, qty: x.qty + 1 } : x));
        } else {
          setOrderItems([...orderItems, { id: p.id, name: p.name, price: p.price, qty: 1, emoji: p.emoji, mods: '' }]);
        }
      };

      const handleChangeQty = (index, delta) => {
        const newItems = [...orderItems];
        newItems[index].qty += delta;
        if (newItems[index].qty <= 0) {
          newItems.splice(index, 1);
        }

      const handeRemoveItem = (index) => {

      const handleClearOrder = () => {

          setOrderItems([]);

      const handleSendKDS = () => {
        if (orderItems.length === 0) {

          return;

        alert('✅ Orden enviada a cocina. El KDS ha recibido el ticket #ORD-2041.');

      const handleOpenModal = (p) => {
        setPendingProduct(p);
        setSelectedMods(['3/4']);
        setShowModal(true);
      };

      const handleToggleMod = (mod) => {
        if (selectedMods.includes(mod)) {
          setSelectedMods(selectedMods.filter(m => m !== mod));
        } else {
          setSelectedMods([...selectedMods, mod]);
        }

      const handleAddFromModal = () => {
        if (!pendingProduct) return;
        const modsStr = selectedMods.join(', ');
        setOrderItems([...orderItems, {
          id: pendingProduct.id,
          name: pendingProduct.name,
          price: pendingProduct.price,
          qty: 1,
          emoji: pendingProduct.emoji,
          mods: modsStr
        }]);
        setShowModal(false);
        setPendingProduct(null);

      const filteredProducts = posProducts.filter(p => {
        const matchCat = currentCat === 'Todos' || p.cat === currentCat;

        return matchCat && matchQ;

      return (

                  <p className="text-xs">Toca un producto para agregar</p>

                      <div className="flex items-center gap-2 bg-gray-50 rounded-lg p-0.5 border border-gray-200">
                        <button onClick={() => handleChangeQty(i, -1)} className="w-6 h-6 flex items-center justify-center text-gray-500 hover:bg-white hover:shadow-sm rounded-md transition-all font-black">−</button>
                        <span className="text-sm font-black text-slate-800 w-4 text-center">{item.qty}</span>
                        <button onClick={() => handleChangeQty(i, 1)} className="w-6 h-6 flex items-center justify-center text-gray-500 hover:bg-white hover:shadow-sm rounded-md transition-all font-black">+</button>
                      </div>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm font-bold text-slate-800 truncate">{item.emoji} {item.name}</p>
                        {item.mods && <p className="text-[10px] text-gray-500 mt-0.5 font-medium leading-tight">{item.mods}</p>}
                      </div>
                      <div className="text-right">
                        <p className="text-sm font-black text-slate-800 mb-0.5">${(item.price * item.qty).toLocaleString('es-CO')}</p>
                        <button onClick={() => handeRemoveItem(i)} className="text-[10px] text-red-500 hover:bg-red-100 font-bold px-2 py-0.5 bg-red-50 rounded-md transition-colors">✕ Quitar</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="p-4 border-t border-gray-200 bg-white shadow-[0_-4px_12px_rgba(0,0,0,0.02)]">
              <div className="flex gap-2 mb-3">
                <input type="number" placeholder="Descuento" value={discountVal} onChange={e => setDiscountVal(e.target.value)} className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all font-medium bg-gray-50 focus:bg-white" />
                <select value={discountType} onChange={e => setDiscountType(e.target.value)} className="border border-gray-200 rounded-xl px-2 py-2 text-sm outline-none focus:border-emerald-500 font-bold bg-gray-50 cursor-pointer">
                  <option value="pct">%</option>
                  <option value="fix">$</option>
                </select>
              </div>
              <textarea rows="1" placeholder="Nota para la orden (opcional)..." value={orderNote} onChange={e => setOrderNote(e.target.value)} className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all resize-none mb-3 font-medium bg-gray-50 focus:bg-white"></textarea>

              <div className="bg-gray-50/80 rounded-xl p-3 border border-gray-100 mb-4">
                <div className="flex justify-between items-center mb-1.5"><span className="text-xs font-bold text-gray-500">Subtotal</span><span className="text-sm font-black text-slate-700">${Math.round(subtotal).toLocaleString('es-CO')}</span></div>

              </div>

              <div className="grid grid-cols-2 gap-2 mb-2">

            </div>
          </div>

          {/* RIGHT: products */}
          <div className="flex-1 flex flex-col bg-[#F8FAFC]">
            <div className="p-4 border-b border-gray-200 bg-white shrink-0 shadow-sm z-10">
              <div className="flex items-center gap-3 border border-gray-200 bg-gray-50 rounded-xl px-4 py-2.5 mb-3 focus-within:bg-white focus-within:border-emerald-400 focus-within:ring-2 focus-within:ring-emerald-100 transition-all">
                <span className="text-gray-400 text-lg leading-none">🔍</span>
                <input type="text" placeholder="Buscar producto, código o categoría..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="flex-1 bg-transparent border-none outline-none text-sm font-medium text-slate-800 placeholder-gray-400" />
              </div>
              <div className="flex gap-2 overflow-x-auto pb-1 items-center" style={{ scrollbarWidth: 'none' }}>
                {categories.map(c => (
                  <button key={c} onClick={() => setCurrentCat(c)} className={`whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition-all border ${currentCat === c ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-gray-200 hover:bg-gray-50'}`}>{c}</button>

              <button className="flex-1 py-2.5 rounded-xl border border-gray-200 text-slate-600 text-xs font-bold hover:bg-gray-50 flex items-center justify-center gap-2 transition-colors" onClick={() => alert('Selecciona el producto a marcar como agotado (86) desde el catálogo.')}><span className="text-lg leading-none shrink-0">🚫</span> 86 Producto</button>

                      {['Término rojo', '3/4', 'Bien cocido'].map(mod => (

                      {['+ Tocineta', '+ Aguacate', '+ Queso extra', '+ Huevo'].map(mod => (
                        <button key={mod} onClick={() => handleToggleMod(mod)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all border ${selectedMods.includes(mod) ? 'bg-emerald-50 border-emerald-500 text-emerald-700 shadow-sm' : 'bg-white border-gray-200 text-slate-600 hover:border-emerald-300'}`}>

                        <button key={mod} onClick={() => handleToggleMod(mod)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all border ${selectedMods.includes(mod) ? 'bg-red-50 border-red-500 text-red-700 shadow-sm' : 'bg-white border-gray-200 text-slate-600 hover:border-red-300'}`}>

                  <div>

                  <div className="flex gap-3 pt-2">
                    <button onClick={() => { setShowModal(false); setPendingProduct(null); }} className="flex-1 py-3.5 bg-white border border-gray-200 text-slate-600 font-bold rounded-xl text-sm hover:bg-gray-50 transition-colors shadow-sm cursor-pointer">Cancelar</button>

                  </div>
                </div>
              </div>

      const handleOpenModal = (cat = null) => {
        setFormError('');
        if (cat) {
          setEditingCategory(cat);
          setFormData({ nombre: cat.nombre, canal: cat.canal, estado: cat.estado, hasHorario: cat.horario !== null, hora_inicio: cat.horario?.inicio || '07:00', hora_fin: cat.horario?.fin || '22:00', dias: cat.horario?.dias || ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'DOMINGO'] });
        } else {
          setEditingCategory(null);
          setFormData({ ...defaultForm });
        }
        setShowModal(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        setFormError('');
        const nombreLimpio = formData.nombre.trim();
        if (!nombreLimpio) return setFormError('El nombre de la categoría es obligatorio.');
        const isDuplicate = activeCategorias.some(c => c.nombre.toLowerCase() === nombreLimpio.toLowerCase() && c.id !== editingCategory?.id);
        if (isDuplicate) return setFormError('Ya existe una categoría con este nombre (Error 409).');
        const nuevaCategoria = {
          id: editingCategory ? editingCategory.id : `uuid-${Date.now()}`,
          nombre: nombreLimpio, canal: formData.canal,
          orden: editingCategory ? editingCategory.orden : (activeCategorias.length > 0 ? Math.max(...activeCategorias.map(c => c.orden)) + 1 : 1),
          estado: formData.estado,
          horario: formData.hasHorario ? { inicio: formData.hora_inicio, fin: formData.hora_fin, dias: formData.dias } : null
        };
        if (editingCategory) {
          setCategorias(categorias.map(c => c.id === editingCategory.id ? nuevaCategoria : c));
        } else {
          setCategorias([...categorias, nuevaCategoria]);
        }
        setShowModal(false);
      };

      const handleToggleEstado = (cat) => {
        const nuevoEstado = cat.estado === 'ACTIVA' ? 'INACTIVA' : 'ACTIVA';
        if (nuevoEstado === 'INACTIVA') {
          const ok = window.confirm(`⚠️ Al desactivar "${cat.nombre}" sus platos dejarán de aparecer en la carta.\n\n¿Continuar?`);
          if (!ok) return;
        }
        setCategorias(categorias.map(c => c.id === cat.id ? { ...c, estado: nuevoEstado } : c));

          setActiveCatNames(prev => prev.includes(cat.nombre) ? prev : [...prev, cat.nombre]);
          setCategoriasExpandidas(prev => prev.includes(cat.nombre) ? prev : [...prev, cat.nombre]);
        } else {
          setActiveCatNames(prev => prev.filter(n => n !== cat.nombre));
        }
        // fetch toggle removido
      };

      const handleDelete = (cat) => {
        const ok = window.confirm(`🗑️ ¿Eliminar la categoría "${cat.nombre}"?\n\nEsta acción es irreversible.`);
        if (!ok) return;
        setCategorias(categorias.filter(c => c.id !== cat.id));
      };

      const handleDragStart = (e, position) => { dragItem.current = position; };
      const handleDragEnter = (e, position) => { dragOverItem.current = position; };
      const handleDragEnd = () => {
        const copy = [...activeCategorias];

        copy.splice(dragItem.current, 1);
        copy.splice(dragOverItem.current, 0, dragged);

    // --- WIDGET: PLATOS E ÍTEMS DEL MENÚ (PASO 2) ---
    function MenuPlatosBlock({ restauranteId, categorias, platos = null, setPlatos = null, activeCatNames = [], focusCatName = null, setFocusCatName = () => { }, platosRef = null, categoriasExpandidas = [], setCategoriasExpandidas = () => { } }) {
      // 1. Estado de UI
      const [viewMode, setViewMode] = React.useState('accordion');
      const [expandedCats, setExpandedCats] = React.useState(['uuid-1', 'uuid-2']);
      const [showFormModal, setShowFormModal] = React.useState(false);
      const [showImportModal, setShowImportModal] = React.useState(false);
      const [editingPlato, setEditingPlato] = React.useState(null);
      const [formError, setFormError] = React.useState('');

      // 2. Formulario
      const defaultForm = { nombre: '', descripcion: '', precio_venta: '', costo_produccion: '', categoria_id: '', canal: 'AMBOS', estado: 'DISPONIBLE', iva_pct: '8' };
      const [formData, setFormData] = React.useState({ ...defaultForm });

      const formatCOP = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(val);

      // --- LÓGICA CRUD & REGLAS DE NEGOCIO ---
      const handleOpenForm = (plato = null) => {
        setFormError('');
        if (plato) {
          setEditingPlato(plato);
          setFormData({ ...plato });
        } else {
          setEditingPlato(null);
          const primeraActiva = categorias.find(c => c.status === 'ACTIVA' || c.estado === 'ACTIVA');
          setFormData({ ...defaultForm, categoria_id: primeraActiva ? primeraActiva.id : '' });
        }
        setShowFormModal(true);
      };

      const handleSavePlato = (e) => {
        e.preventDefault();
        setFormError('');

        const catPadre = categorias.find(c => c.id === formData.categoria_id);
        if (!catPadre) return setFormError('Debes seleccionar una categoría.');
        if (catPadre.estado !== 'ACTIVA') return setFormError('Error 400: La categoría seleccionada está inactiva.');

        const nombreLimpio = formData.nombre.trim();
        if (!nombreLimpio) return setFormError('El nombre del plato es obligatorio.');

        const precio = Number(formData.precio_venta);
        if (!Number.isInteger(precio) || precio <= 0) return setFormError('El precio de venta debe ser un número entero positivo sin centavos.');

        const isDuplicate = platos.some(p => p.categoria_id === formData.categoria_id && p.nombre.toLowerCase() === nombreLimpio.toLowerCase() && p.id !== editingPlato?.id);
        if (isDuplicate) return setFormError(`Error 409: Ya existe un plato llamado "${nombreLimpio}" en esta categoría.`);

        if (catPadre.canal === 'SALON' && formData.canal !== 'SALON') return setFormError('Error: Este plato no puede ser Delivery/Ambos porque su categoría es Solo Salón.');
        if (catPadre.canal === 'DELIVERY' && formData.canal !== 'DELIVERY') return setFormError('Error: Este plato no puede ser Salón/Ambos porque su categoría es Solo Delivery.');

        let margen = null;
        const costo = Number(formData.costo_produccion);
        if (costo >= 0 && precio > 0 && formData.costo_produccion !== '') {
          margen = Number((((precio - costo) / precio) * 100).toFixed(2));
        }

        const nuevoPlato = {
          ...formData,
          id: editingPlato ? editingPlato.id : `plato-${Date.now()}`,
          nombre: nombreLimpio,
          categoria_nombre: catPadre.nombre,
          precio_venta: precio,
          costo_produccion: costo >= 0 && formData.costo_produccion !== '' ? costo : null,
          margen_bruto: margen,
          iva_pct: Number(formData.iva_pct)
        };

        if (editingPlato) {
          setPlatos(platos.map(p => p.id === editingPlato.id ? nuevoPlato : p));
          console.log(`[Evento Backend Simulado] PUT /api/carta/platos/${nuevoPlato.id}`);
        } else {

          activeSetPlatos([...activePlatos, nuevoPlato]);
          console.log(`[Evento] plato.creado: ${nuevoPlato.id}. Operaciones y Delivery sincronizados.`);
        }

        setShowFormModal(false);
      };

      const handleToggleEstado = (plato, nuevoEstado) => {
        setPlatos(platos.map(p => p.id === plato.id ? { ...p, estado: nuevoEstado } : p));
        if (nuevoEstado === 'AGOTADO') console.log(`[Evento WebSocket] plato.agotado: ${plato.id} bloqueado en Operaciones y Delivery.`);
        if (nuevoEstado === 'DISPONIBLE') console.log(`[Evento WebSocket] plato.disponible: ${plato.id} reactivado.`);
      };

      const toggleAccordion = (catId) => {
        if (expandedCats.includes(catId)) setExpandedCats(expandedCats.filter(id => id !== catId));
        else setExpandedCats([...expandedCats, catId]);
      };

      const categoriasConPlatos = categorias.filter(c => activeCatNames.includes(c.nombre));

      // Filtra platos usando categoria_nombre (campo real de la API) con fallback a otros alias
      const platosVisibles = (platos || []).filter(p => {
        if (!activeCatNames || activeCatNames.length === 0) return false;
        const campoCategoria = (p.categoria_nombre || p.categoria || p.category || '').toString().trim().toLowerCase();
        return activeCatNames.some(activa => activa.toString().trim().toLowerCase() === campoCategoria);
      });

      return (
        <div ref={platosRef} className="bg-white rounded-3xl border border-gray-200 p-0 shadow-sm overflow-hidden border-l-4 border-l-emerald-500 flex flex-col">
          <div className="p-6 border-b border-gray-100 bg-white relative z-10">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center">🍽</div>
                <div>
                  <h3 className="text-lg font-black text-slate-800 tracking-tight">2. Platos e Ítems (El Core)</h3>
                  <p className="text-xs text-gray-500">Agrega el producto que venderás. Sincroniza con Operaciones, Delivery e Inventario.</p>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-2 mr-2">
                  <button
                    onClick={() => setViewMode('accordion')}
                    style={{
                      padding: '6px 12px',
                      background: viewMode === 'accordion' ? 'var(--color-background-secondary)' : 'transparent',
                      border: '0.5px solid var(--color-border-tertiary)',
                      borderRadius: '8px',
                      cursor: 'pointer',
                      fontSize: '16px',
                      color: viewMode === 'accordion' ? 'var(--color-text-primary)' : 'var(--color-text-tertiary)',
                      fontWeight: viewMode === 'accordion' ? 'bold' : 'normal',
                      transition: 'all 0.2s'
                    }}
                    title="Vista de Lista"
                  >≡</button>
                  <button
                    onClick={() => setViewMode('table')}
                    style={{
                      padding: '6px 12px',
                      background: viewMode === 'table' ? 'var(--color-background-secondary)' : 'transparent',
                      border: '0.5px solid var(--color-border-tertiary)',
                      borderRadius: '8px',
                      cursor: 'pointer',
                      fontSize: '16px',
                      color: viewMode === 'table' ? 'var(--color-text-primary)' : 'var(--color-text-tertiary)',
                      fontWeight: viewMode === 'table' ? 'bold' : 'normal',
                      transition: 'all 0.2s'
                    }}
                    title="Vista de Tabla"
                  >⊞</button>
                </div>
                <button onClick={() => setShowImportModal(true)} className="btn bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 px-3 text-xs shadow-sm">☁ Importar CSV</button>
                <button onClick={() => handleOpenForm()} className="btn bg-emerald-500 text-white hover:bg-emerald-600 py-2 px-4 text-xs shadow-md shadow-emerald-500/20">+ Agregar Plato</button>
              </div>
            </div>
          </div>

          <div className="bg-gray-50/50 flex-1 relative min-h-[200px]">
            {activeCatNames.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-16 px-6 text-center">
                <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4 text-gray-300">⊞</div>
                <h4 className="text-sm font-bold text-slate-600 mb-2">Activa una categoría arriba para ver sus platos</h4>
                <p className="text-xs text-gray-400 max-w-sm">Usa los toggles en la tabla de Categorías para seleccionar qué grupos quieres revisar. Solo verás los platos de las categorías activas.</p>
              </div>
            ) : (
              <React.Fragment>
                {viewMode === 'accordion' && (
                  <div className="p-6 space-y-4">
                    {categoriasConPlatos.sort((a, b) => a.orden - b.orden).map(cat => {
                      const platosCat = platos.filter(p => {
                        const cp = p.categoria_nombre || p.categoria || p.category || p.categoria_id || '';
                        const cn = cat.nombre || '';
                        return cp.toString().trim().toLowerCase() === cn.toString().trim().toLowerCase();
                      });
                      const isExpanded = (categoriasExpandidas || []).includes(cat.nombre);
                      return (
                        <div key={cat.id} className="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden transition-all">
                          <div
                            className="p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 transition-colors"
                            onClick={() => {
                              setCategoriasExpandidas(prev =>
                                prev.includes(cat.nombre)
                                  ? prev.filter(n => n !== cat.nombre)
                                  : [...prev, cat.nombre]
                              );
                            }}
                          >
                            <div className="flex items-center gap-3">
                              <span className={`w-6 h-6 rounded-full flex items-center justify-center bg-gray-100 text-gray-500 transition-transform ${isExpanded ? 'rotate-180' : ''}`}>
                                ▼
                              </span>
                              <h4 className={`font-bold text-sm ${cat.estado === 'INACTIVA' ? 'text-gray-400 line-through' : 'text-slate-800'}`}>{cat.nombre}</h4>
                              <span className="text-[10px] font-bold bg-gray-100 text-gray-500 px-2 py-0.5 rounded">{platosCat.length} ítems</span>
                            </div>
                            {cat.estado === 'INACTIVA' && <span className="text-[10px] font-black text-red-500 uppercase bg-red-50 px-2 py-1 rounded tracking-widest">Cat. Inactiva</span>}
                          </div>

                          {isExpanded && (

    // --- COMPONENTE MÓDULO 4: RECETAS E INVENTARIO ---
    function MenuRecetasBlock({ platos, recetas, inventario }) {
      const [activeTab, setActiveTab] = React.useState('platos'); // 'platos' o 'inventario'

      const getFactorConversion = (unidadCompra, unidadReceta) => {
        if (unidadCompra === unidadReceta) return 1;
        if (unidadCompra === 'kg' && unidadReceta === 'g') return 0.001;
        if (unidadCompra === 'g' && unidadReceta === 'kg') return 1000;
        if (unidadCompra === 'litro' && (unidadReceta === 'ml' || unidadReceta === 'cc')) return 0.001;
        if (unidadCompra === 'ml' && unidadReceta === 'litro') return 1000;
        return 1;
      };

      const platosConCostos = platos.filter(p => p.estado_inicial !== 'INACTIVO').map(plato => {
        const lineas = recetas.filter(r => r.nombre_plato === plato.nombre);
        let costoCalculado = 0;
        const lineasConCosto = lineas.map(linea => {
          const insumo = inventario.find(i => i.nombre === linea.ingrediente_nombre);
          let subtotal = 0;
          let tienePrecio = false;
          if (insumo && insumo.precio_por_unidad > 0) {
            tienePrecio = true;
            const factor = getFactorConversion(insumo.unidad_compra, linea.unidad_medida);
            subtotal = linea.cantidad * (insumo.precio_por_unidad * factor);
            costoCalculado += subtotal;
          }
          return { ...linea, insumo, subtotal, tienePrecio };
        });

        let margenReal = '100.00%';
        let isNegativo = false;
        let faltaPrecio = lineasConCosto.some(l => !l.tienePrecio);
        if (costoCalculado > 0 && plato.precio_venta > 0) {
          const p = ((plato.precio_venta - costoCalculado) / plato.precio_venta) * 100;
          margenReal = p.toFixed(1) + '%';
          if (p < 0) isNegativo = true;
        } else if (plato.precio_venta === 0) {
          margenReal = '0.0%';
        }

        return {
          ...plato,
          lineas: lineasConCosto,
          costoCalculado,
          margenReal,
          isNegativo,
          faltaPrecio,
          tieneReceta: lineas.length > 0
        };
      });

      return (
        <div className="bg-white rounded-3xl border border-gray-200 p-6 shadow-sm flex flex-col">
          <div className="flex flex-col md:flex-row justify-between mb-5 gap-4">
            <div className="flex items-center gap-3">

              <div>

              <button onClick={() => setActiveTab('platos')} className={`px-4 py-2 text-xs font-bold rounded-lg flex-1 transition-all ${activeTab === 'platos' ? 'bg-white shadow text-slate-900 border border-gray-200/50' : 'text-gray-500 hover:text-slate-800 hover:bg-gray-200/50'}`}>🍲 Recetas (Cálculo Costos)</button>
              <button onClick={() => setActiveTab('inventario')} className={`px-4 py-2 text-xs font-bold rounded-lg flex-1 transition-all ml-1 ${activeTab === 'inventario' ? 'bg-white shadow text-slate-900 border border-gray-200/50' : 'text-gray-500 hover:text-slate-800 hover:bg-gray-200/50'}`}>📦 Insumos (Catálogo Central)</button>
            </div>
          </div>

          {activeTab === 'platos' && (
            <div className="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm">
              <table className="w-full text-left text-sm border-collapse bg-white">
                <thead className="bg-slate-50">
                  <tr className="border-b border-gray-200 uppercase text-[10px] text-slate-500 font-bold tracking-wider">
                    <th className="p-4 rounded-tl-2xl">Plato Base</th>
                    <th className="p-4">Composición Técnica</th>
                    <th className="p-4 text-right">M2: Precio Venta</th>
                    <th className="p-4 text-right">M4: Costo Real</th>
                    <th className="p-4 text-right rounded-tr-2xl">Margen Final</th>
                  </tr>
                </thead>
                <tbody>
                  {platosConCostos.map((p, idx) => (
                    <tr key={idx} className="border-b border-gray-100 hover:bg-purple-50/30 transition-colors group">
                      <td className="p-4 align-top">
                        <div className="font-bold text-slate-800">{p.nombre}</div>
                        {p.isNegativo && <span className="mt-1 inline-block text-[9px] bg-red-100 text-red-700 font-black border border-red-200 px-2.5 py-0.5 rounded-full uppercase tracking-wider">Pérdida Crítica</span>}
                      </td>
                      <td className="p-4">
                        {!p.tieneReceta ? (
                          <span className="text-amber-500 italic text-xs bg-amber-50 px-3 py-1 rounded-lg border border-amber-100">⚠️ Requiere receta en M4</span>
                        ) : (
                          <div className="flex flex-col gap-1.5 bg-gray-50/50 p-3 rounded-xl border border-gray-100 group-hover:border-purple-100 group-hover:bg-white transition-all">
                            {p.lineas.map((l, i) => (
                              <div key={i} className="text-[11px] grid grid-cols-2 gap-4 w-full min-w-[240px]">
                                <span className="text-slate-700 font-medium truncate" title={l.ingrediente_nombre}>• {l.ingrediente_nombre}</span>
                                <span className="text-gray-400 text-right font-mono text-[10px]">
                                  {l.cantidad}{l.unidad_medida}
                                  {l.tienePrecio ? <span className="text-slate-400 font-medium ml-1 bg-gray-100 px-1.5 py-0.5 rounded">(${l.subtotal.toFixed(0)})</span> : <span className="text-red-500 ml-1 bg-red-50 px-1.5 py-0.5 rounded font-bold">Falta $</span>}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </td>
                      <td className="p-4 text-right align-top">
                        <span className="bg-slate-100 text-slate-700 font-mono font-bold px-3 py-1.5 rounded-lg border border-slate-200/60 shadow-sm">${(p.precio_venta || 0).toLocaleString()}</span>
                      </td>
                      <td className="p-4 text-right align-top">
                        {p.tieneReceta ? (
                          <span className={`font-mono font-black ${p.faltaPrecio ? 'text-amber-600 bg-amber-50' : 'text-slate-800 bg-slate-100 px-3'} py-1.5 rounded-lg`}>${p.costoCalculado.toLocaleString()}</span>
                        ) : <span className="text-gray-300">-</span>}
                      </td>
                      <td className="p-4 text-right align-top">
                        {p.tieneReceta ? (
                          <span className={`font-black font-mono tracking-tight px-3 py-1.5 rounded-lg border shadow-sm ${p.isNegativo ? 'text-red-700 bg-red-100 border-red-200' : 'text-emerald-700 bg-emerald-100 border-emerald-200'}`}>{p.margenReal}</span>
                        ) : <span className="text-gray-300">-</span>}
                      </td>
                    </tr>
                  ))}
                  {platosConCostos.length === 0 && (
                    <tr><td colSpan="5" className="p-12 text-center text-slate-400 text-sm">No hay platos activos configurados en M2.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          )}

          {activeTab === 'inventario' && (
            <div className="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm">
              <table className="w-full text-left text-sm border-collapse bg-white">
                <thead className="bg-slate-50">
                  <tr className="border-b border-gray-200 text-[10px] uppercase text-slate-500 font-bold tracking-wider">
                    <th className="p-4 rounded-tl-2xl">Catálogo de Insumos</th>
                    <th className="p-4">U. Medida Maestro</th>
                    <th className="p-4 text-right">Impacto Financiero (Precio Base)</th>
                    <th className="p-4 text-right rounded-tr-2xl">Stock a Hoy</th>
                  </tr>
                </thead>
                <tbody>
                  {inventario.map((i, idx) => (
                    <tr key={idx} className="border-b border-gray-50 hover:bg-purple-50/30 transition-colors group">
                      <td className="p-4">
                        <span className="font-bold text-slate-700 block">{i.nombre}</span>
                        {i.stock_minimo_alerta > 0 && i.stock_actual <= i.stock_minimo_alerta && <span className="text-[10px] text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded border border-amber-200">⚠️ CRÍTICO</span>}
                      </td>
                      <td className="p-4 text-slate-500 uppercase text-[11px] font-black tracking-wider bg-slate-50 w-32 border-x border-gray-50 text-center">{i.unidad_compra}</td>
                      <td className="p-4 text-right">
                        <span className="font-mono bg-white text-purple-700 font-bold px-3 py-1 inline-flex items-center justify-end rounded-lg border border-purple-100 shadow-sm group-hover:border-purple-300">
                          ${(i.precio_por_unidad || 0).toLocaleString()}

                      </td>
                      <td className="p-4 text-right text-slate-600 font-mono font-medium">
                        {i.stock_actual || 0}

                  {inventario.length === 0 && (
                    <tr><td colSpan="4" className="p-12 text-center text-slate-400 text-sm italic">Sin insumos registrados. Sube tu plantilla "Inventario".</td></tr>

    function ViewMenu({
      categorias, setCategorias,
      platos, setPlatos,
      recetas, setRecetas,
      inventario, setInventario,
      gruposMod, setGruposMod,
      opcionesMod, setOpcionesMod,
      vinculosMod, setVinculosMod
    }) {
      const [menuTab, setMenuTab] = React.useState('configuracion');
      const [activeCatNames, setActiveCatNames] = React.useState(['Pastas Artesanales', 'Pizzas al Horno', 'Antipasti', 'Postres Italianos', 'Bebidas y Vinos']);
      const [focusCatName, setFocusCatName] = React.useState(null);
      const [categoriasExpandidas, setCategoriasExpandidas] = React.useState(['Pastas Artesanales', 'Pizzas al Horno', 'Antipasti', 'Postres Italianos', 'Bebidas y Vinos']);
      const [importing, setImporting] = React.useState(false);
      const [importError, setImportError] = React.useState(null);
      const [importResult, setImportResult] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const fileInputRef = React.useRef(null);
      const platosRef = React.useRef(null);
      const [vistaPlatos, setVistaPlatos] = React.useState('tabla');
      const restauranteActivoId = 'default';

      // --- EFECTO DE CALCULO DE COSTOS (Prioridad 3) ---
      React.useEffect(() => {
        // Evitar bucles: Solo ejecutar si hay cambios reales que procesar
        let cambios = false;
        const nuevosPlatos = (platos || []).map(plato => {
          // Filtrar ingredientes de la receta de este plato
          const ingredientes = (recetas || []).filter(r =>
            r.nombre_plato.toLowerCase().trim() === plato.nombre.toLowerCase().trim()
          );

          if (ingredientes.length === 0) return plato;

          // Calcular costo sumando (cantidad * precio_del_inventario)
          const nuevoCosto = ingredientes.reduce((acc, ing) => {
            const itemInv = (inventario || []).find(i => i.nombre.toLowerCase().trim() === ing.ingrediente_nombre.toLowerCase().trim());
            const costoUnitario = itemInv ? (itemInv.precio_por_unidad || 0) : (ing.costo_unitario || 0);
            return acc + (ing.cantidad * costoUnitario);
          }, 0);

          const roundedCosto = Math.round(nuevoCosto);

          if (plato.costo_produccion !== roundedCosto) {
            cambios = true;
            const nuevoMargen = plato.precio_venta > 0
              ? Number((((plato.precio_venta - roundedCosto) / plato.precio_venta) * 100).toFixed(2))
              : 0;
            return { ...plato, costo_produccion: roundedCosto, margen_bruto: nuevoMargen };
          }
          return plato;
        });

        if (cambios) {
          setPlatos(nuevosPlatos);
        }
      }, [recetas, inventario]); // Solo depende de cambios en recetas o inventario

      const handleDescargarPlantilla = () => alert('Descargando plantilla de menú...');
      const handleSubirArchivo = () => fileInputRef.current?.click();

      const handleLimpiarCarta = async () => {
        const confirmado = window.confirm(
          '¿Estás seguro? Esto eliminará todas las categorías, platos, modificadores y recetas. Esta acción no se puede deshacer.'
        );
        if (!confirmado) return;
        setCategorias([]);
        setPlatos([]);
        setRecetas([]);
        setInventario([]);
        setActiveCatNames([]);
        alert('Contenido limpiado correctamente. Ahora puedes subir una nueva plantilla.');
      };


      // FUNCIÓN ROBUSTA DE CARGA DE DATOS DEL MENÚ
      async function loadMenuData() {
        // Sin servidor — retorna null para que fetchMenuData use los datos ya en estado
        return null;
      }

      const fetchMenuData = async () => {
        // Sin servidor — los datos iniciales ya están en el estado de React.
        // Esta función solo existe para el refresco post-importación.
        setLoading(false);
      };

      React.useEffect(() => {
        // No fetch al montar — los datos del estado inicial ya están listos.
        setLoading(false);
      }, []);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImporting(true);
        setImportError(null);
        setImportResult(null);

        const reader = new FileReader();

        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, { type: 'array' });

            console.log('Hojas encontradas:', wb.SheetNames);

            const readSheet = (keyword) => {
              const match = wb.SheetNames.find(n =>
                n.toUpperCase().replace(/[^A-Z0-9]/g, '').includes(
                  keyword.toUpperCase().replace(/[^A-Z0-9]/g, '')
                )
              );
              if (!match) {
                console.warn('Hoja no encontrada para keyword:', keyword);
                return [];
              }
              console.log('Leyendo hoja:', match);
              const rows = XLSX.utils.sheet_to_json(wb.Sheets[match], { defval: '' });
              console.log('Filas leídas en', match, ':', rows.length, rows[0]);
              return rows;
            };

            const catRows = readSheet('CATEGORIAS');
            const cats = catRows
              .filter(r => r['nombre'] && String(r['nombre']).trim() !== '')
              .map((r, i) => ({
                id: 'cat-' + i,
                nombre: String(r['nombre']).trim(),
                canal: String(r['canal'] || 'AMBOS').toUpperCase(),
                orden: Number(r['orden']) || (i + 1),
                estado: String(r['activa'] || 'SI').toUpperCase() === 'NO' ? 'INACTIVA' : 'ACTIVA',
                horario: null
              }));

            const platoRows = readSheet('PLATOS');
            const pls = platoRows
              .filter(r => r['nombre'] && String(r['nombre']).trim() !== '')
              .map((r, i) => {
                const catNombre = String(r['categoria_nombre'] || '').trim();
                const catObj = cats.find(c => c.nombre.toLowerCase() === catNombre.toLowerCase());
                const precio = Number(r['precio_venta']) || 0;
                const costo = r['costo_produccion'] ? Number(r['costo_produccion']) : null;
                return {
                  id: 'plato-' + i,
                  nombre: String(r['nombre']).trim(),
                  descripcion: String(r['descripcion_carta'] || ''),
                  precio_venta: precio,
                  costo_produccion: costo,
                  margen_bruto: precio > 0 && costo ? Number((((precio - costo) / precio) * 100).toFixed(1)) : null,
                  categoria_id: catObj ? catObj.id : (cats[0] ? cats[0].id : ''),
                  categoria_nombre: catNombre,
                  canal: String(r['canal'] || 'AMBOS').toUpperCase(),
                  estado: String(r['estado_inicial'] || 'DISPONIBLE').toUpperCase(),
                  iva_pct: 8,
                  foto_url: null
                };
              });

                id: 'rec-' + i,

                cantidad: Number(r['cantidad']) || 0,
                unidad_medida: String(r['unidad_medida'] || 'und'),
                costo_unitario: Number(r['costo_unitario']) || 0
              }));

              .filter(r => r['nombre'] && String(r['nombre']).trim() !== '')

                id: 'inv-' + i,
                nombre: String(r['nombre'] || r['ingrediente'] || r['insumo'] || '').trim(),

                proveedor: String(r['proveedor'] || '')

            setImportError('Error al leer el Excel: ' + err.message);
          } finally {
            setImporting(false);
            if (e.target) e.target.value = '';
          }

              <p className="text-gray-500 max-w-2xl">Gestiona tu suscripción, métodos de pago y escala tu restaurante con las herramientas que necesitas.</p>
            </div>
            <div className="flex gap-3">
              <button className="btn btn--outline-soft"><span style={{ fontSize: '15px', lineHeight: 1 }}>📥</span> Descargar Facturas</button>
              <button className="btn btn--dark"><span style={{ fontSize: '15px', lineHeight: 1 }}>💳</span> Método de Pago</button>
            </div>
          </div>

          <div className="bg-gradient-to-r from-emerald-900 to-emerald-700 rounded-3xl p-8 text-white shadow-xl mt-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="flex items-center gap-5">
              <div className="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20">
                <span style={{ fontSize: '16px', lineHeight: 1 }}>🛡️</span>
              </div>
              <div>
                <p className="text-emerald-200 text-sm font-bold uppercase tracking-widest mb-1">Tu Plan Actual</p>
                <h2 className="text-3xl font-black">Growth Plan <span className="text-xl font-medium text-emerald-300">/ Mensual</span></h2>
              </div>
            </div>
            <div className="bg-black/20 p-5 rounded-2xl border border-white/10 flex flex-col md:flex-row items-center gap-6">
              <div>
                <p className="text-emerald-200 text-xs mb-1">Próximo Cobro</p>
                <p className="text-xl font-bold">$900 USD <span className="text-sm font-normal text-emerald-100">el 12 Abril, 2026</span></p>
              </div>
              <button className="btn bg-white text-emerald-900 hover:bg-emerald-50 px-6 py-3 rounded-full font-bold shadow-lg">Cambiar Plan</button>
            </div>
          </div>

          <div className="pricing-table-container mt-12">
            <div className="pt-header">
              <div className="pt-header-cell feature-col bg-white">
                <div>
                  <h3 className="text-xl font-black text-slate-900 mb-1">Comparativa Detallada</h3>
                  <p className="text-sm text-gray-500">Funcionalidades en cada nivel.</p>
                </div>
              </div>
              <div className="pt-header-cell bg-white">
                <h4 className="text-lg font-bold text-slate-800 mb-2">Starter</h4>
                <div className="text-3xl font-black text-slate-900 mb-4">$450<span className="text-sm font-medium text-gray-400">/mes</span></div>
                <button className="btn btn--outline-soft w-full text-xs">Bajar a Starter</button>
              </div>
              <div className="pt-header-cell relative bg-emerald-50 border-t-4 border-emerald-500 shadow-inner">
                <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-emerald-500 text-white text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full shadow-md">Plan Actual</div>
                <h4 className="text-lg font-bold text-emerald-900 mb-2">Growth</h4>
                <div className="text-3xl font-black text-emerald-600 mb-4">$900<span className="text-sm font-medium text-emerald-600/60">/mes</span></div>
                <button className="btn bg-emerald-200 text-emerald-800 w-full text-xs font-bold cursor-default">Plan Activo</button>
              </div>
              <div className="pt-header-cell bg-white">
                <h4 className="text-lg font-bold text-slate-800 mb-2">Enterprise</h4>
                <div className="text-3xl font-black text-slate-900 mb-4">$1,800+<span className="text-sm font-medium text-gray-400">/mes</span></div>
                <button className="btn btn--dark w-full text-xs">Contactar Ventas</button>
              </div>
            </div>
            <div className="pt-body bg-white">
              {pricingData.map((section, sIdx) => (
                <React.Fragment key={sIdx}>
                  <div className="pt-category">{section.category}</div>
                  {section.features.map((feature, fIdx) => (
                    <div className="pt-row" key={fIdx}>
                      <div className="pt-cell feature-col">{feature.name}</div>
                      <div className="pt-cell">{feature.tiers[0] ? <span style={{ fontSize: '18px' }}>✅</span> : <span style={{ fontSize: '16px', lineHeight: 1 }}>−</span>}</div>
                      <div className="pt-cell bg-emerald-50/30">{feature.tiers[1] ? <span style={{ fontSize: '18px' }}>✅</span> : <span style={{ fontSize: '16px', lineHeight: 1 }}>−</span>}</div>
                      <div className="pt-cell">{feature.tiers[2] ? <span style={{ fontSize: '18px' }}>✅</span> : <span style={{ fontSize: '16px', lineHeight: 1 }}>−</span>}</div>
                    </div>
                  ))}
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }


    // =========================================================================
    // UTILIDADES COMPARTIDAS
    // =========================================================================

    function NavItemDark({ icon, label, isActive, onClick, highlight }) {
      const activeClass = highlight && isActive ? 'nav-item-dark--active bg-[rgba(255,255,255,0.1)] text-white' : isActive ? 'nav-item-dark--active' : '';
      return (
        <div className={`nav-item-dark ${activeClass}`} onClick={onClick}>
          <div className="flex items-center justify-center w-5">{icon}</div>
          <span>{label}</span>
        </div>
      );
    }

    function StatCard({ label, value, delta, isUp, icon, vsText, isDanger, highlightBadge }) {
      return (
        <div className="stat-card">
          <div>
            <div className="flex justify-between items-start mb-4">
              <div className={`stat-card__icon-wrap ${isDanger ? 'bg-red-50' : ''}`}>{icon}</div>
              {highlightBadge && <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-bold">{highlightBadge}</span>}
            </div>
            <div className="stat-card__label">{label}</div>
            <div className="stat-card__value mt-1">{value}</div>
          </div>
          <div className="flex items-center gap-2 mt-2">
            <div className={`delta-badge ${isDanger ? 'delta-badge--down' : (isUp === false ? 'delta-badge--neutral' : 'delta-badge--up')}`}>{delta}</div>
            <span className="text-[11px] font-medium text-gray-400 truncate">{vsText}</span>
          </div>
        </div>
      );
    }

    function IntegrationCard({ title, desc, icon, badgeText, badgeType, items, isSmall }) {
      const getBadgeClass = (type) => type === 'orange' ? 'bg-orange-100 text-orange-700 border border-orange-200' : type === 'blue' ? 'bg-blue-100 text-blue-700 border border-blue-200' : 'bg-gray-100 text-gray-600 border border-gray-200';
      const getIconClass = (type) => type === 'orange' ? 'bg-orange-50 text-orange-600 border-orange-100' : type === 'blue' ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-slate-50 text-slate-600 border-slate-100';

      return (
        <div className={`bg-white rounded-2xl border border-gray-200 shadow-sm p-6 flex flex-col ${!isSmall && 'hover:shadow-md transition-shadow duration-200'}`}>
          <div className="flex justify-between items-start mb-4">
            <div className={`w-12 h-12 rounded-xl flex items-center justify-center border ${getIconClass(badgeType)} shadow-sm`}>{icon}</div>
            <span className={`text-[10px] font-bold uppercase tracking-widest px-2 py-1 rounded-md ${getBadgeClass(badgeType)}`}>{badgeText}</span>
          </div>
          <h3 className={`${isSmall ? 'text-lg' : 'text-xl'} font-bold text-slate-900 mb-1`}>{title}</h3>
          <p className="text-sm text-gray-500 mb-5 flex-1">{desc}</p>
          <div className="flex flex-wrap gap-2 pt-4 border-t border-gray-100">
            {items.map((item, idx) => (
              item.highlight ? <div key={idx} className="app-tag bg-blue-50 border-blue-100 text-blue-800"><span style={{ fontSize: '16px', lineHeight: 1 }}>🔗</span> {item.name}</div>
                : <div key={idx} className="app-tag"><span style={{ fontSize: '16px', lineHeight: 1 }}>🔗</span> {item.name}</div>
            ))}
          </div>
          {!isSmall && <button className="w-full mt-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold rounded-xl transition-colors">Configurar Módulo</button>}
        </div>
      );
    }

    function getTabTitle(tab) {
      const titles = {
        dashboard: 'Hola, Daniel 👋',
        ventas: 'Ventas Diarias',
        finanzas: 'Finanzas & Cumplimiento',
        operaciones: 'Operaciones de Salón',
        inventario: 'Kardex & Proveedores',
        delivery: 'Hub de Domicilios',
        reservas: 'Reservas & VIP',
        marketing: 'Campañas & Marketing',
        fidelizacion: 'Club de Fidelización',
        eventos: 'Eventos & Catering',
        rrhh: 'Talento y RRHH',
        data: 'Data & Insights',
        restaurante: 'Perfil del Restaurante',
        menu: 'Carta & Menú (Laboratorio)',
        conectores: 'Directorio de Aplicaciones',
        billing: 'Configuración de Plan',
        brain: 'Brain IA (El Cerebro)'
      };
      return titles[tab] || 'Módulo Operativo';
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

</html>
