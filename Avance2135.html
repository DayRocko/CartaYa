                }

// --- COMPONENTE MÓDULO 4: RECETAS E INVENTARIO ---
function MenuRecetasBlock({ activeTab, platos, recetas, inventario }) {
  const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

  // ─── STATE ───────────────────────────────────────────────────────────────────
  // Panel open state: stores plato.id | null
  const [expandedPlato, setExpandedPlato] = React.useState(null);
  // Each plato has its own lineas state, keyed by plato.id -> []
  const [platosLineas, setPlatosLineas] = React.useState({});
  const [buscarInsumo, setBuscarInsumo] = React.useState('');

  const UNIDADES = ['g', 'kg', 'ml', 'l', 'und', 'cc'];

  // ─── HELPERS  ─────────────────────────────────────────────────────────────────
  const fmt = (val) => {
    if (val === null || val === undefined || isNaN(Number(val))) return null;
    return '$' + Math.round(Number(val)).toLocaleString('es-CO');
  };

  const factorLabel = (f) => {
    const n = Number(f);
    if (n >= 1.0) return 'Sin merma';
    if (n >= 0.8) return 'Limpieza/tallo';
    if (n >= 0.6) return 'Pelado/Puntas';
    return 'Alta merma';
  };

  // Convert cantidad to base unit (kg or l) based on unidad_receta
  const toBase = (cantidad, unidad) => {
    const n = Number(cantidad) || 0;
    if (unidad === 'g')   return n / 1000;
    if (unidad === 'ml')  return n / 1000;
    if (unidad === 'cc')  return n / 1000;
    return n; // kg, l, und -> directo
  };

  const calcFila = (linea) => {
    const cu = Number(linea.costo_unitario) || 0;
    const cant = toBase(linea.cantidad, linea.unidad_receta);
    const factor = Math.max(0.01, Number(linea.factor) || 1);
    if (!cu) return { operacion: '–', costo: null };
    const costo = (cu * cant) / factor;
    const cantBase = cant.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    const operacion = `(${cu.toLocaleString('es-CO')} Á” ${cantBase}) / ${factor}`;
    return { operacion, costo: Math.round(costo) };
  };

  const calcMargen = (precio, costo) => {
    if (!precio || costo === null || costo === undefined) return null;
    return Math.round(((precio - costo) / precio) * 100);
  };

  const margenStyle = (pct) => {
    if (pct === null) return { color: '#D1D5DB' };
    if (pct >= 60) return { color: '#16A34A', bg: '#F0FDF4', border: '#BBF7D0' };
    if (pct >= 40) return { color: '#2563EB', bg: '#EFF6FF', border: '#BFDBFE' };
    return { color: '#DC2626', bg: '#FEF2F2', border: '#FECACA' };
  };

  // ─── ESCANDALLO OPEN/CLOSE ────────────────────────────────────────────────────
  const toggleEscandallo = (plato) => {
    if (expandedPlato === plato.id) { setExpandedPlato(null); return; }
    // Load lines if not already loaded for this plato
    setPlatosLineas(prev => {
      if (prev[plato.id]) return prev; // already loaded
      // Primero intenta cargar desde recetas importadas del Excel
      const pNorm = norm(plato.nombre);
      const recetasDelPlato = (recetas || []).filter(r =>
        r.nombre_plato && norm(r.nombre_plato) === pNorm
      );
      
      let lineasIniciales = [];
      if (recetasDelPlato.length > 0) {
        lineasIniciales = recetasDelPlato.map((r, idx) => ({
          id: idx + 1,
          ingrediente: r.ingrediente_nombre || '',
          costo_unitario: r.costo_unitario || 0,
          unidad_compra: r.unidad_compra || 'kg',
          cantidad: r.cantidad || 0,
          unidad_receta: r.unidad_medida || 'g',
          factor: 1.0,
          subtotal_costo: r.subtotal_costo !== null ? r.subtotal_costo : null,
          margen_bruto_pct: r.margen_ingrediente_pct !== null ? r.margen_ingrediente_pct : null,
          pvp_sugerido: r.pvp_sugerido_ing !== null ? r.pvp_sugerido_ing : null,
          margen_bruto_pesos: r.margen_bruto_pesos_ing !== null ? r.margen_bruto_pesos_ing : null
        }));
      } else {
        // Fallback a datos mock hardcodeados
        lineasIniciales = null
          ? null.map(l => ({ ...l }))
          : [];
      }
      return { ...prev, [plato.id]: lineasIniciales };
    });
    setBuscarInsumo('');
    setExpandedPlato(plato.id);
  };

  const getLineas = (platoId) => platosLineas[platoId] || [];

  const addIngrediente = (platoId) => {
    const nombre = buscarInsumo.trim();
    if (!nombre) return;
    const nuevaLinea = { id: Date.now(), ingrediente: nombre, costo_unitario: 0, unidad_compra: 'kg', cantidad: 100, unidad_receta: 'g', factor: 1.0 };
    setPlatosLineas(prev => ({ ...prev, [platoId]: [...(prev[platoId] || []), nuevaLinea] }));
    setBuscarInsumo('');
  };

  const removeIngrediente = (platoId, lineaId) => {
    setPlatosLineas(prev => ({ ...prev, [platoId]: (prev[platoId] || []).filter(l => l.id !== lineaId) }));
  };

  const updateLinea = (platoId, lineaId, field, value) => {
    setPlatosLineas(prev => ({
      ...prev,
      [platoId]: (prev[platoId] || []).map(l => l.id === lineaId ? { ...l, [field]: value } : l)
    }));
  };

  // ─── FORMATO DE MONEDA Y PORCENTAJE ─────────────────────────────────────────────────────────────
  const formatCOP = (val) => {
    const n = parseFloat(val);
    if (isNaN(n) || val === null || val === undefined) return '–';
    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(n);
  };

  const formatPct = (val) => {
    const n = parseFloat(val);
    if (isNaN(n) || val === null || val === undefined) return '–';
    // El valor del Excel ya viene como decimal (0.78 = 78%)
    return (n * 100).toFixed(1) + '%';
  };

  // ─── ENRICH PLATOS ─────────────────────────────────────────────────────────────
  // Lee directamente los campos enriquecidos que vienen del parser de 5_RECETAS
  const platosEnriquecidos = (platos || []).map(plato => {
    const pNorm = norm(plato.nombre);
    const tieneReceta = plato.tiene_receta || (recetas || []).some(r => r.nombre_plato && norm(r.nombre_plato) === pNorm);

    return {
      ...plato,
      tieneReceta,
      costoMP: (plato.costo_materia_prima !== null && plato.costo_materia_prima !== undefined) ? plato.costo_materia_prima : null,
      margenPctProm: (plato.margen_bruto_pct_promedio !== null && plato.margen_bruto_pct_promedio !== undefined) ? plato.margen_bruto_pct_promedio : null,
      pvpSugerido: (plato.precio_venta_sugerido !== null && plato.precio_venta_sugerido !== undefined) ? plato.precio_venta_sugerido : null,
      margenBrutoPesos: (plato.margen_bruto_pesos !== null && plato.margen_bruto_pesos !== undefined) ? plato.margen_bruto_pesos : null,
      alertaState: tieneReceta ? 'sync' : 'no_registrado',
      fugaMsg: tieneReceta ? '' : 'Sin receta en 5_RECETAS'
    };
  });;

  // ─── ESCANDALLO PANEL ─────────────────────────────────────────────────────────
  const EscandalloPanel = ({ plato }) => {
    const lineas = getLineas(plato.id);
    const costoTotal = lineas.reduce((acc, l) => {
      const { costo } = calcFila(l);
      return acc + (costo || 0);
    }, 0);
    const margenPct = calcMargen(plato.precio_venta, costoTotal > 0 ? costoTotal : null);
    const ms = margenStyle(margenPct);

    return (
      <tr>
        <td colSpan={8} style={{padding:'4px 8px 8px 8px', background:'#F8FAFC'}}>
          <div style={{background:'white', border:'1px solid #E2E8F0', borderRadius:16, boxShadow:'0 4px 16px rgba(0,0,0,0.06)', padding:'20px', margin:'0 4px'}}>

            {/* HEADER */}
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
              <div style={{display:'flex', alignItems:'center', gap:10}}>
                <span style={{fontSize:17}}>✍️</span>
                <span style={{fontWeight:700, color:'#1E293B', fontSize:14}}>Escandallo – {plato.nombre}</span>
                <span style={{fontSize:'9px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', background:'#F3F4F6', color:'#6B7280', borderRadius:5, padding:'2px 8px'}}>COMPOSICIÓN TÁ°CNICA</span>
              </div>
              <button
                onClick={() => setExpandedPlato(null)}
                style={{background:'#F8FAFC', border:'1px solid #E2E8F0', borderRadius:8, padding:'4px 12px', fontSize:12, fontWeight:700, color:'#64748B', cursor:'pointer'}}
              >✔¢ Cerrar</button>
            </div>

            {/* SEARCH ROW */}
            <div style={{display:'flex', gap:8, marginBottom:14}}>
              <div style={{flex:1, position:'relative'}}>
                <span style={{position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', fontSize:14, color:'#9CA3AF'}}>🐟</span>
                <input
                  type="text"
                  placeholder="Buscar insumo... (ej: Harina, Queso)"
                  value={buscarInsumo}
                  onChange={e => setBuscarInsumo(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addIngrediente(plato.id); } }}
                  style={{width:'100%', border:'1px solid #E5E7EB', borderRadius:12, padding:'8px 12px 8px 36px', fontSize:13, background:'#F9FAFB', outline:'none', boxSizing:'border-box'}}
                />
              </div>
              <button
                onClick={() => addIngrediente(plato.id)}
                style={{background:'#4F46E5', color:'white', fontWeight:700, fontSize:13, padding:'8px 18px', borderRadius:12, border:'none', cursor:'pointer', whiteSpace:'nowrap'}}
              >+ Agregar Ingrediente</button>
            </div>

            {/* TABLA FICHA TÁ°CNICA */}
            <div style={{overflowX:'auto', borderRadius:12, border:'1px solid #E5E7EB'}}>
              <table style={{width:'100%', borderCollapse:'collapse', fontSize:13, minWidth:820}}>
                <thead>
                  <tr style={{background:'#F8FAFC', borderBottom:'1px solid #E5E7EB'}}>
                    <th style={{padding:'10px 12px', textAlign:'left', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Ingrediente</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Cantidad (Porción)</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Unidad Medida</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Subtotal Costo Materia Prima</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Margen Bruto %</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Precio de Venta Sugerido (Sin IVA)</th>
                    <th style={{padding:'10px 12px', textAlign:'right', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Margen Bruto Pesos</th>
                    <th style={{padding:'10px 8px', width:32}}></th>
                  </tr>
                </thead>
                <tbody>
                  {lineas.length === 0 ? (
                    <tr>
                      <td colSpan={8} style={{textAlign:'center', padding:'24px', color:'#9CA3AF', fontSize:13, fontStyle:'italic'}}>
                        No hay ingredientes. Usa el buscador para agregar insumos.
                      </td>
                    </tr>
                  ) : (
                    lineas.map((linea, li) => {
                      const isOdd = li % 2 === 1;
                      const subtotal = Number(linea.subtotal_costo) || 0;
                      const pvp = Number(linea.pvp_sugerido) || 0;
                      const mbPesos = Number(linea.margen_bruto_pesos) || 0;
                      const mbPct = Number(linea.margen_bruto_pct) || 0;
                      const msIng = margenStyle(mbPct);
                      return (
                        <tr key={linea.id} style={{borderBottom:'1px solid #F1F5F9', background: isOdd ? '#FAFBFC' : 'white'}}>
                          {/* COL 1 – INGREDIENTE */}
                          <td style={{padding:'10px 12px'}}>
                            <span style={{fontWeight:700, color:'#1E293B', fontSize:13}}>{linea.ingrediente}</span>
                          </td>
                          {/* COL 2 – CANTIDAD (PORCIÓN) */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            <div style={{display:'inline-flex', alignItems:'center', gap:4}}>
                              <input
                                type="number"
                                min="0"
                                step="any"
                                value={linea.cantidad}
                                onChange={e => updateLinea(plato.id, linea.id, 'cantidad', e.target.value)}
                                style={{width:80, textAlign:'center', fontSize:13, border:'1px solid #E2E8F0', borderRadius:8, padding:'4px 6px', background:'white', outline:'none'}}
                              />
                            </div>
                          </td>
                          {/* COL 3 – UNIDAD MEDIDA */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            <select
                              value={linea.unidad_receta || 'g'}
                              onChange={e => updateLinea(plato.id, linea.id, 'unidad_receta', e.target.value)}
                              style={{border:'1px solid #E2E8F0', borderRadius:8, fontSize:12, padding:'4px 6px', background:'white', outline:'none', cursor:'pointer'}}
                            >
                              {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                            </select>
                          </td>
                          {/* COL 4 – SUBTOTAL COSTO MP */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            {subtotal > 0
                              ? <span style={{fontWeight:700, color:'#334155', fontSize:13}}>${subtotal.toLocaleString('es-CO')}</span>
                              : <span style={{color:'#D1D5DB'}}>–</span>
                            }
                          </td>
                          {/* COL 5 – MARGEN BRUTO % */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            {mbPct > 0
                              ? <span style={{fontWeight:900, fontSize:12, color: msIng.color, background: msIng.bg, border:`1px solid ${msIng.border}`, borderRadius:6, padding:'2px 8px'}}>{mbPct.toFixed(1) || mbPct}%</span>
                              : <span style={{color:'#D1D5DB'}}>–</span>
                            }
                          </td>
                          {/* COL 6 – PRECIO DE VENTA SUGERIDO */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            {pvp > 0
                              ? <span style={{fontWeight:700, color:'#1E293B', fontSize:13}}>${pvp.toLocaleString('es-CO')}</span>
                              : <span style={{color:'#D1D5DB'}}>–</span>
                            }
                          </td>
                          {/* COL 7 – MARGEN BRUTO PESOS */}
                          <td style={{padding:'10px 12px', textAlign:'right'}}>
                            {mbPesos > 0
                              ? <span style={{fontWeight:900, color:'#047857', fontSize:13}}>${mbPesos.toLocaleString('es-CO')}</span>
                              : <span style={{color:'#D1D5DB'}}>–</span>
                            }
                          </td>
                          {/* DELETE BTN */}
                          <td style={{padding:'10px 8px', textAlign:'center'}}>
                            <button
                              onClick={() => removeIngrediente(plato.id, linea.id)}
                              style={{width:24, height:24, borderRadius:6, border:'none', background:'transparent', color:'#CBD5E1', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, transition:'all 0.15s'}}
                              onMouseEnter={e => { e.currentTarget.style.background = '#FEF2F2'; e.currentTarget.style.color = '#DC2626'; }}
                              onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = '#CBD5E1'; }}
                              title="Eliminar ingrediente"
                            >✔¢</button>
                          </td>
                        </tr>
                      );
                    })
                  )}

                  {/* RESUMEN – COSTO TOTAL */}
                  {lineas.length > 0 && (
                    <>
                      <tr style={{background:'#F8FAFC', borderTop:'2px solid #E2E8F0'}}>
                        <td colSpan={6} style={{padding:'10px 12px', textAlign:'right'}}>
                          <span style={{fontWeight:900, color:'#334155', fontSize:13, textTransform:'uppercase', letterSpacing:'0.04em'}}>Costo Total de Producción</span>
                        </td>
                        <td style={{padding:'10px 12px', textAlign:'right'}}>
                          <span style={{fontWeight:900, color:'#0F172A', fontSize:15}}>
                            ${costoTotal.toLocaleString('es-CO')}
                          </span>
                        </td>
                        <td></td>
                      </tr>
                      <tr style={{background:'#F8FAFC', borderTop:'1px solid #F1F5F9'}}>
                        <td colSpan={6} style={{padding:'6px 12px', textAlign:'right'}}>
                          <span style={{fontWeight:700, color:'#64748B', fontSize:12}}>Margen Bruto Proyectado</span>
                        </td>
                        <td style={{padding:'6px 12px', textAlign:'right'}}>
                          {margenPct !== null ? (
                            <span style={{fontWeight:900, fontSize:14, color: ms.color, background: ms.bg, border:`1px solid ${ms.border}`, borderRadius:8, padding:'2px 10px'}}>
                              {margenPct}%
                            </span>
                          ) : <span style={{color:'#D1D5DB'}}>–</span>}
                        </td>
                        <td></td>
                      </tr>
                    </>
                  )}
                </tbody>
              </table>
            </div>

            {/* FOOTER BUTTONS */}
            <div style={{display:'flex', justifyContent:'flex-end', gap:8, marginTop:14, paddingTop:12, borderTop:'1px solid #F1F5F9'}}>
              <button
                onClick={() => setExpandedPlato(null)}
                style={{background:'white', border:'1px solid #E2E8F0', color:'#475569', fontWeight:700, fontSize:13, padding:'8px 20px', borderRadius:12, cursor:'pointer'}}
              >Cancelar</button>
              <button
                onClick={() => {
                  console.log('[Receta guardada]', plato.nombre, getLineas(plato.id));
                  setExpandedPlato(null);
                }}
                style={{background:'#059669', color:'white', fontWeight:700, fontSize:13, padding:'8px 20px', borderRadius:12, border:'none', cursor:'pointer', boxShadow:'0 2px 8px rgba(5,150,105,0.25)'}}
              >✔œ Guardar Receta</button>
            </div>
          </div>
        </td>
      </tr>
    );
  };

  // ─── RENDER ───────────────────────────────────────────────────────────────────
  return (
    <div className="bg-white rounded-3xl border border-gray-200 shadow-sm flex flex-col overflow-hidden" style={{borderLeft:'4px solid #7C3AED'}}>
      {activeTab === 'platos' && (
        <div className="overflow-x-auto">
          <table className="w-full text-left text-sm border-collapse bg-white" style={{minWidth:900}}>
            <thead>
              <tr className="bg-slate-50 border-b border-gray-200">
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest">Nombre del Plato</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest">Costo Materia Prima</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Margen Bruto % Promedio</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right">Precio de Venta Sugerido (Sin IVA)</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right">Margen Bruto Pesos</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Alerta Detección Fugas</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              {platosEnriquecidos.map((plato, idx) => {
                const isExpanded = expandedPlato === plato.id;
                const rowBg = idx % 2 === 0 ? 'white' : 'rgba(248,250,252,0.5)';
                const ms = margenStyle(plato.margenPctProm !== null ? plato.margenPctProm * 100 : null);
                return (
                  <React.Fragment key={plato.id || idx}>
                    <tr
                      className="border-b border-gray-100 hover:bg-purple-50/20 transition-colors"
                      style={{background: isExpanded ? '#F5F3FF' : rowBg, minHeight:64}}
                    >
                      {/* NOMBRE */}
                      <td className="px-4 py-3">
                        <span className="font-bold text-slate-800 text-sm">{plato.nombre}</span>
                      </td>
                      {/* COSTO MATERIA PRIMA */}
                      <td className="px-4 py-3">
                        {plato.costoMP !== null
                          ? <span className="font-bold text-slate-700 text-sm">{formatCOP(plato.costoMP)}</span>
                          : <span style={{color:'#D1D5DB',fontWeight:700}}>–</span>
                        }
                      </td>
                      {/* MARGEN % PROMEDIO */}
                      <td className="px-4 py-3 text-center">
                        {plato.margenPctProm !== null
                          ? <span className="font-black text-sm px-3 py-1 rounded-lg" style={{background: ms.bg, color: ms.color, border:`1px solid ${ms.border}`}}>{formatPct(plato.margenPctProm)}</span>
                          : <span style={{color:'#D1D5DB',fontWeight:700}}>–</span>
                        }
                      </td>
                      {/* PRECIO VENTA SUGERIDO */}
                      <td className="px-4 py-3 text-right">
                        {plato.pvpSugerido !== null
                          ? <span className="font-black text-slate-900 text-sm">{formatCOP(plato.pvpSugerido)}</span>
                          : <span style={{color:'#D1D5DB',fontWeight:700}}>–</span>
                        }
                      </td>
                      {/* MARGEN PESOS */}
                      <td className="px-4 py-3 text-right">
                        {plato.margenBrutoPesos !== null
                          ? <span className="font-bold text-slate-700 text-sm">{formatCOP(plato.margenBrutoPesos)}</span>
                          : <span style={{color:'#D1D5DB',fontWeight:700}}>–</span>
                        }
                      </td>
                      {/* ALERTA FUGAS */}
                      <td className="px-4 py-3 text-center">
                        {plato.alertaState === 'sync' && (
                          <span className="inline-flex items-center gap-1 text-xs font-bold rounded-lg px-2 py-1 border" style={{background:'#F0FDF4',color:'#15803D',borderColor:'#BBF7D0'}}>✔œ Sincronizado</span>
                        )}
                        {plato.alertaState === 'fuga' && (
                          <span className="inline-flex items-center gap-1 text-xs font-bold rounded-lg px-2 py-1 border" style={{background:'#FFFBEB',color:'#92400E',borderColor:'#FCD34D'}}>⚠ {plato.fugaMsg}</span>
                        )}
                        {plato.alertaState === 'no_registrado' && (
                          <span className="inline-flex items-center gap-1 text-xs font-bold rounded-lg px-2 py-1 border" style={{background:'#FEF2F2',color:'#DC2626',borderColor:'#FECACA'}}>⊢” {plato.fugaMsg || 'Consumo no registrado'}</span>
                        )}
                      </td>
                      {/* ACCIONES */}
                      <td className="px-4 py-3">
                        <div className="flex items-center justify-center gap-1">
                          <button title="Ver detalle" onClick={() => toggleEscandallo(plato)} className="w-8 h-8 rounded-lg flex items-center justify-center text-sm transition-colors" style={{background:'#F8FAFC',color:'#475569',border:'1px solid #E2E8F0'}}>🐟</button>
                          <span style={{color:'#D1D5DB'}}>–</span>
                        </div>
                      </td>
                    </tr>

                    {/* INLINE ESCANDALLO PANEL */}
                    {isExpanded && <EscandalloPanel plato={plato} />}
                  </React.Fragment>
                );
              })}
              {platosEnriquecidos.length === 0 && (
                <tr><td colSpan={8} className="p-12 text-center text-slate-400 text-sm">No hay platos configurados en M2.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}

      {/* ── TAB INSUMOS ─────────────────────────────────────────────────────────── */}
      {activeTab === 'inventario' && (
        <div className="overflow-x-auto rounded-b-3xl">
          <table className="w-full text-left text-sm border-collapse bg-white">
            <thead className="bg-slate-50">
              <tr className="border-b border-gray-200 text-[10px] uppercase text-slate-500 font-bold tracking-wider">
                <th className="p-4">Catálogo de Insumos</th>
                <th className="p-4">U. Medida Maestro</th>
                <th className="p-4 text-right">Impacto Financiero (Precio Base)</th>
                <th className="p-4 text-right">Stock a Hoy</th>
              </tr>
            </thead>
            <tbody>
              {(inventario || []).map((i, idx) => (
                <tr key={idx} className="border-b border-gray-50 hover:bg-purple-50/30 transition-colors group">
                  <td className="p-4">
                    <span className="font-bold text-slate-700 block">{i.nombre}</span>
                    {i.stock_minimo_alerta > 0 && i.stock_actual <= i.stock_minimo_alerta && (
                      <span className="text-[10px] text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded border border-amber-200">⚠️ CRáTICO</span>
                    )}
                  </td>
                  <td className="p-4 text-slate-500 uppercase text-[11px] font-black tracking-wider bg-slate-50 w-32 border-x border-gray-50 text-center">{i.unidad_compra}</td>
                  <td className="p-4 text-right">
                    <span className="font-mono bg-white text-purple-700 font-bold px-3 py-1 inline-flex items-center justify-end rounded-lg border border-purple-100 shadow-sm group-hover:border-purple-300">
                      ${(i.precio_por_unidad || 0).toLocaleString()}
                    </span>
                  </td>
                  <td className="p-4 text-right text-slate-600 font-mono font-medium">{i.stock_actual || 0}</td>
                </tr>
              ))}
              {(!inventario || inventario.length === 0) && (
                <tr><td colSpan={4} className="p-12 text-center text-slate-400 text-sm italic">Sin insumos registrados. Sube tu plantilla "Inventario".</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}


function ViewMenu({ 
  categorias, setCategorias, 
  platos, setPlatos, 
  recetas, setRecetas, 
  inventario, setInventario,
  gruposMod, setGruposMod,
  opcionesMod, setOpcionesMod,
  vinculosMod, setVinculosMod
}) {
  const [menuTab, setMenuTab] = React.useState('configuracion');
  const [showToast, setShowToast] = React.useState(false);
  const [activeCatNames, setActiveCatNames] = React.useState(['Pastas Artesanales', 'Pizzas al Horno', 'Antipasti', 'Postres Italianos', 'Bebidas y Vinos']);
  const [focusCatName, setFocusCatName] = React.useState(null);
  const [categoriasExpandidas, setCategoriasExpandidas] = React.useState(['Pastas Artesanales', 'Pizzas al Horno', 'Antipasti', 'Postres Italianos', 'Bebidas y Vinos']);
  const [importing, setImporting] = React.useState(false);
  const [importError, setImportError] = React.useState(null);
  const [importResult, setImportResult] = React.useState(null);
  const [fechaCarga, setFechaCarga] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const fileInputRef = React.useRef(null);
  const platosRef = React.useRef(null);
  const [vistaPlatos, setVistaPlatos] = React.useState('accordion'); // 'accordion' o 'table'
  
  // Estados elevados para control de submódulos
  const [showModalCat, setShowModalCat] = React.useState(false);
  const [showModalPlato, setShowModalPlato] = React.useState(false);
  const [showModalImportPlato, setShowModalImportPlato] = React.useState(false);
  const [viewModeMod, setViewModeMod] = React.useState('biblioteca'); // 'biblioteca' | 'por_plato'
  const [activeTabRecetas, setActiveTabRecetas] = React.useState('platos');
  const [showGroupModalMod, setShowGroupModalMod] = React.useState(false); // 'platos' | 'inventario'
  const [activeSubmodule, setActiveSubmodule] = React.useState(null); // null | 'simulador'
  
  const restauranteActivoId = 'default';


  const autoSaveTimeoutRef = React.useRef(null);
  const isFirstRender = React.useRef(true);

  React.useEffect(() => {
    try {
      const stored = localStorage.getItem('cartaya_menu_data');
      if (stored) {
        const data = JSON.parse(stored);
        if (data.categorias) setCategorias(data.categorias);
        if (data.platos) setPlatos(data.platos);
        if (data.recetas) setRecetas(data.recetas);
        if (data.inventario) setInventario(data.inventario);
        if (data.activeCatNames) setActiveCatNames(data.activeCatNames);
        if (data.categoriasExpandidas) setCategoriasExpandidas(data.categoriasExpandidas);
      }
    } catch (e) { console.error(e); }
  }, []);

  const guardarEnLocalStorage = () => {
    localStorage.setItem('cartaya_menu_data', JSON.stringify({
      categorias, platos, recetas, inventario, activeCatNames, categoriasExpandidas,
      gruposMod, opcionesMod, vinculosMod
    }));
  };

  React.useEffect(() => {
    if (isFirstRender.current) {
      isFirstRender.current = false;
      return;
    }
    if (autoSaveTimeoutRef.current) clearTimeout(autoSaveTimeoutRef.current);
    autoSaveTimeoutRef.current = setTimeout(() => {
      guardarEnLocalStorage();
      setShowToast(true);
    }, 1500);
    return () => clearTimeout(autoSaveTimeoutRef.current);
  }, [categorias, platos, recetas, inventario, gruposMod, opcionesMod, vinculosMod]);

  React.useEffect(() => {
    if (showToast) {
      const timer = setTimeout(() => setShowToast(false), 3000);
      return () => clearTimeout(timer);
    }
  }, [showToast]);

  const [seccionesAbiertas, setSeccionesAbiertas] = React.useState({
    categorias: true,
    platos: true,
    modificadores: true,
    recetas: true
  });

  const toggleSeccion = (key) => {
    setSeccionesAbiertas(prev => ({ ...prev, [key]: !prev[key] }));
  };

  // --- EFECTO DE CALCULO DE COSTOS (con guards contra undefined) ---
  React.useEffect(() => {
    try {
      if (!platos || platos.length === 0) return;
      let cambios = false;
      const safeRecetas = recetas || [];
      const safeInventario = inventario || [];
      const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

      const nuevosPlatos = platos.map(plato => {
        if (!plato || !plato.nombre) return plato;
        const pNorm = norm(plato.nombre);
        
        // Buscar todas las líneas de receta para este plato
        const ingredientes = safeRecetas.filter(r =>
          r && r.nombre_plato && norm(r.nombre_plato) === pNorm
        );
        
        if (ingredientes.length === 0) return plato;

        const nuevoCosto = ingredientes.reduce((acc, ing) => {
          const ingNorm = norm(ing.ingrediente_nombre);
          const itemInv = safeInventario.find(i =>
            i && i.nombre && norm(i.nombre) === ingNorm
          );
          
          // Prioridad: 1. Precio en inventario, 2. Costo unitario en la receta
          const costoUnitario = itemInv ? (itemInv.precio_por_unidad || 0) : (ing.costo_unitario || 0);
          return acc + ((ing.cantidad || 0) * costoUnitario);
        }, 0);

        const roundedCosto = Math.round(nuevoCosto);
        if (Math.abs((plato.costo_produccion || 0) - roundedCosto) > 1) { // Pequeña tolerancia para evitar loops
          cambios = true;
          const nuevoMargen = plato.precio_venta > 0
            ? Number((((plato.precio_venta - roundedCosto) / plato.precio_venta) * 100).toFixed(2)) : 0;
          return { ...plato, costo_produccion: roundedCosto, margen_bruto: nuevoMargen };
        }
        return plato;
      });

      if (cambios) {
        setPlatos(nuevosPlatos);
      }
    } catch(err) { console.warn('Error en cálculo de costos:', err); }
  }, [recetas, inventario]); // Solo depende de cambios en recetas o inventario

  const handleDescargarPlantilla = () => alert('Descargando plantilla de menú...');
  const handleSubirArchivo = () => fileInputRef.current?.click();

  const handleLimpiarCarta = async () => {
    const confirmado = window.confirm(
      '¿Estás seguro? Esto eliminará todas las categorías, platos, modificadores, recetas e inventario cargados. Esta acción no se puede deshacer.'
    );
    if (!confirmado) return;
    setCategorias([]);
    setPlatos([]);
    setRecetas([]);
    setInventario([]);
    setGruposMod([]);
    setOpcionesMod([]);
    setVinculosMod([]);
    setActiveCatNames([]);
    setCategoriasExpandidas([]);
    localStorage.removeItem('cartaya_menu_data');
    alert('Contenido eliminado. Ahora puedes subir una nueva plantilla.');
  };

  const handleGuardarCambios = () => {
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      guardarEnLocalStorage();
      setShowToast(true);
    }, 800);
  };

  const handleDescargarDB = () => {

    if (formato.toUpperCase().trim() === 'EXCEL' && window.XLSX) {

      const expCats = (categorias || []).map(c => ({

      }));
      const wsCats = window.XLSX.utils.json_to_sheet(expCats);
      window.XLSX.utils.book_append_sheet(wb, wsCats, "Categorias");

        Precio_Venta: p.precio_venta || 0,

      }));
      const wsPlatos = window.XLSX.utils.json_to_sheet(expPlatos);
      window.XLSX.utils.book_append_sheet(wb, wsPlatos, "Platos");

      const wsRecetas = window.XLSX.utils.json_to_sheet(recetas || [{msg: "Recetas no configuradas"}]);
      window.XLSX.utils.book_append_sheet(wb, wsRecetas, "Recetas");

      const wsInv = window.XLSX.utils.json_to_sheet(inventario || [{msg: "Inventario vacío"}]);

      window.XLSX.writeFile(wb, "BaseDeDatos_Menu.xlsx");
    } else {
      window.alert("Exportación básica a CSV en desarrollo. Por favor use EXCEL.");
    }
  };

  
  // FUNCIÓN ROBUSTA DE CARGA DE DATOS DEL MENÚ
  async function loadMenuData() {
    // Sin servidor – retorna null para que fetchMenuData use los datos ya en estado
    return null;
  }

  const fetchMenuData = async () => {
    // Sin servidor – los datos iniciales ya están en el estado de React.
    // Esta función solo existe para el refresco post-importación.
    setLoading(false);
  };

  React.useEffect(() => {
    try {
      const stored = localStorage.getItem('cartaya_menu_data');
      if (stored) {
        const data = JSON.parse(stored);
        if (data.categorias) setCategorias(data.categorias);
        if (data.platos) setPlatos(data.platos);
        if (data.gruposMod && typeof setGruposMod === 'function') setGruposMod(data.gruposMod);
        if (data.opcionesMod && typeof setOpcionesMod === 'function') setOpcionesMod(data.opcionesMod);
        if (data.vinculosMod && typeof setVinculosMod === 'function') setVinculosMod(data.vinculosMod);
        if (data.recetas) setRecetas(data.recetas);
        if (data.inventario) setInventario(data.inventario);
      }
    } catch (e) { console.error('Error loading from localStorage:', e); }
  }, []);

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    setImportError(null);
    setImportResult(null);

    const reader = new FileReader();

    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = window.XLSX.read(data, { type: 'array' });

        // --- UTILIDADES DE NORMALIZACIÓN Y MAPEO ---
        const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
        
        const MAPPING = {
          cat: {
            nombre: ['nombre', 'categoria', 'seccion', 'grupo', 'category', 'name', 'nombrecategoria'],
            orden: ['orden', 'prioridad', 'posicion', 'prioridadpos', 'index'],
            estado: ['estado', 'activo', 'activa', 'status', 'visibility'],
            canal: ['canal', 'servicio', 'tipo', 'channel'],
            destino: ['destino', 'impresion', 'printer', 'cocina', 'barra'],
            impuesto: ['impuesto', 'iva', 'tax', 'impoconsumo']
          },
          plato: {
            nombre: ['nombre', 'plato', 'producto', 'item', 'descripcion', 'name', 'nombreplato'],
            precio: ['precio', 'valor', 'venta', 'pvp', 'price', 'precioventa', 'valorventa'],
            costo: ['costo', 'produccion', 'compra', 'cost', 'costoproduccion'],
            categoria: ['categoria', 'seccion', 'cat', 'category', 'categorianombre'],
            descripcion: ['descripcion', 'detalle', 'info', 'description', 'comentario'],
            estado: ['estado', 'disponibilidad', 'status', 'activo'],
            canal: ['canal', 'servicio', 'tipo', 'channel']
          },
          receta: {
            plato: ['plato', 'nombreplato', 'recetade', 'dish', 'productonombre'],
            ingrediente: ['ingrediente', 'insumo', 'materia', 'nombreingrediente', 'item', 'ingredient', 'producto'],
            cantidad: ['cantidad', 'porcion', 'peso', 'qty', 'amount', 'cantidadporcion'],
            unidad: ['unidad', 'medida', 'um', 'uom', 'unit', 'unidadmedida'],
            costo_unit: ['costo', 'valorunitario', 'costounitario', 'preciocompra', 'unitcost', 'valorunit'],
            proveedor: ['proveedor', 'comercio', 'vendedor', 'supplier'],
            stock_min: ['minimo', 'alerta', 'stockminimo', 'min'],
            stock_actual: ['stock', 'actual', 'cantidadcompra', 'existencia', 'stockactual'],
            subtotal: ['subtotal', 'totalcosto', 'costolinea'],
            margen_pct: ['margen', 'rentabilidad', 'porcentajemargen', 'margin', 'margenbruto%'],
            pvp_sug: ['pvpsugerido', 'preciosugerido', 'sugerencia', 'pvpsugeridoplato', 'pvpsugerido(siniva)'],
            costo_plato: ['costoplato', 'costomateriaprima', 'costototalplato', 'costomateriaprimaplato'],
            margen_pesos: ['margenpesos', 'margenbruto', 'ganancia', 'margenbrutopesosplato']
          },
          mod_grupo: {
            nombre: ['nombre', 'grupo', 'modificador', 'grupomodificador', 'nombregrupo'],
            tipo: ['tipo', 'seleccion', 'tiposeleccion'],
            obligatorio: ['obligatorio', 'requerido'],
            min: ['min', 'minimo', 'minopciones'],
            max: ['max', 'maximo', 'maxopciones'],
            estado: ['estado', 'activo', 'status'],
            aplica: ['aplica', 'platos', 'vinculo', 'aplicaplato', 'aplica_a_platos'],
            orden: ['orden', 'posicion', 'orden_en_plato']
          },
          mod_opcion: {
            nombre: ['nombre', 'opcion', 'item', 'nombreopcion'],
            grupo: ['grupo', 'nombregrupo', 'grupomodificador'],
            precio: ['precio', 'adicional', 'valor', 'recargo', 'precio_adicional']
          }
        };

        const findSheet = (keywords) => {
          const normKeys = keywords.map(norm);
          const match = wb.SheetNames.find(name => {
            const n = norm(name);
            return normKeys.some(k => n.includes(k));
          });
          return match ? wb.Sheets[match] : null;
        };

        const readSheetRobust = (sheet, type) => {
          if (!sheet) return [];
          const raw = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          if (raw.length === 0) return [];

          // Encontrar fila de encabezados
          let headerIdx = -1;
          const typeMap = MAPPING[type];
          const allSynonyms = Object.values(typeMap).flat();

          for (let i = 0; i < Math.min(raw.length, 15); i++) {
            const row = raw[i];
            const matches = row.filter(cell => {
              const n = norm(cell);
              return allSynonyms.some(s => n === s || n.includes(s));
            });
            if (matches.length >= 2) { headerIdx = i; break; }
          }

          if (headerIdx === -1) headerIdx = 0; // Fallback a la primera fila

          const headers = raw[headerIdx].map(h => norm(h));
          const dataRows = raw.slice(headerIdx + 1).filter(r => r.some(c => c !== ''));

          return dataRows.map(row => {
            const result = { _raw: row };
            Object.entries(typeMap).forEach(([field, synonyms]) => {
              const colIdx = headers.findIndex(h => synonyms.includes(h) || synonyms.some(s => h.includes(s)));
              if (colIdx !== -1) result[field] = row[colIdx];
            });
            return result;
          });
        };

        const parseNum = (v) => {
          if (v === null || v === undefined || v === '') return 0;
          if (typeof v === 'number') return v;
          return parseFloat(String(v).replace(/[^0-9.-]/g, '')) || 0;
        };

        const parseBool = (v) => {
          const s = String(v || '').toUpperCase();
          return s === 'SI' || s === 'TRUE' || s === 'ACTIVO' || s === '1' || s === 'ACTIVA';
        };

        // 1. IMPORTAR CATEGORáAS
        const sCat = findSheet(['CATEGORIAS', 'CATEGORIA', 'CAT', '1_']);
        const rowsCat = readSheetRobust(sCat, 'cat');
        const cats = rowsCat.filter(r => r.nombre).map((r, i) => ({
          id: `cat-${Date.now()}-${i}`,
          nombre: String(r.nombre).trim(),
          canal: String(r.canal || 'AMBOS').toUpperCase().includes('SALON') ? 'SALON' : (String(r.canal).toUpperCase().includes('DELIVERY') ? 'DELIVERY' : 'AMBOS'),
          estado: parseBool(r.estado) ? 'ACTIVA' : 'INACTIVA',
          color: r.color || '#7C3AED',
          prioridad_pos: parseInt(r.orden) || (i + 1),
          destino_impresion: r.destino || 'Cocina Principal',
          impuesto: r.impuesto || '8% Impoconsumo',
          horario: null
        }));

        // 2. IMPORTAR PLATOS
        const sPlato = findSheet(['PLATOS', 'PLATO', 'ITEMS', 'MENU', '2_']);
        const rowsPlato = readSheetRobust(sPlato, 'plato');
        const pls = rowsPlato.filter(r => r.nombre).map((r, i) => {
          const catName = String(r.categoria || '').trim();
          const catObj = cats.find(c => norm(c.nombre) === norm(catName));
          return {
            id: `plato-${Date.now()}-${i}`,
            nombre: String(r.nombre).trim(),
            precio_venta: parseNum(r.precio),
            costo_produccion: parseNum(r.costo),
            descripcion: r.descripcion || '',
            categoria_id: catObj ? catObj.id : (cats[0]?.id || 'cat-gen'),
            categoria_nombre: catName || (cats[0]?.nombre || 'General'),
            estado: String(r.estado || 'DISPONIBLE').toUpperCase().includes('AGOTADO') ? 'AGOTADO' : 'DISPONIBLE',
            canal: String(r.canal || 'AMBOS').toUpperCase().includes('SALON') ? 'SALON' : (String(r.canal).toUpperCase().includes('DELIVERY') ? 'DELIVERY' : 'AMBOS'),
            prioridad_pos: i + 1
          };
        });

        // 3. IMPORTAR RECETAS E INVENTARIO (CORAZÓN DEL SUBMÓDULO)
        // Buscar la hoja de recetas con normalización flexible
        const normalizeSheet = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        const recSheetName = wb.SheetNames.find(n =>
          normalizeSheet(n).includes('RECETA') || normalizeSheet(n).includes('5RECETA')
        );
        const sRec = recSheetName ? wb.Sheets[recSheetName] : findSheet(['RECETAS', 'RECETA', 'INGREDIENTES', '5_']);

        // Extraer ingredientes y análisis financiero de 5_RECETAS
        const platoData = {};
        const recs = [];

        if (sRec) {
          const raw5 = window.XLSX.utils.sheet_to_json(sRec, { header: 1, defval: '' });
          const dataRows5 = raw5.length >= 4 ? raw5.slice(3) : [];
          let currentPlato = '';

          dataRows5.forEach((row, i) => {
            const colA = String(row[0] || '').trim();
            if (colA) currentPlato = colA;

            const colQ = row[16], colR = row[17], colS = row[18], colT = row[19];
            const tieneValorQ = colQ !== '' && colQ !== null && colQ !== undefined && !isNaN(parseFloat(colQ));

            if (tieneValorQ && currentPlato && !platoData[currentPlato]) {
              platoData[currentPlato] = {
                costoMateriaPrima:      parseFloat(colQ) || 0,
                margenBrutoPctPromedio: parseFloat(colR) || 0,
                precioVentaSugerido:    parseFloat(colS) || 0,
                margenBrutoPesos:       parseFloat(colT) || 0,
              };
            }

            const ingrediente = String(row[1] || '').trim();
            if (ingrediente && currentPlato) {
              recs.push({
                id: `rec-${Date.now()}-${i}`,
                nombre_plato:         currentPlato,
                ingrediente_nombre:   ingrediente,
                cantidad:             parseNum(row[10]),  // Col K: Cantidad (Porción)
                unidad_medida:        row[11] || 'g',     // Col L: Unidad de Medida
                subtotal_costo:       parseNum(row[12]),  // Col M: Subtotal Costo MP
                margen_ingrediente_pct: parseNum(row[13]) * (String(row[13]).includes('%') ? 1 : 100), // Col N
                pvp_sugerido_ing:     parseNum(row[14]),  // Col O: Precio Venta Sugerido
                margen_bruto_pesos_ing: parseNum(row[15]),// Col P: Margen Bruto Pesos
                costo_por_plato:      tieneValorQ ? parseFloat(colQ) : 0,
                margen_plato_pct:     tieneValorQ ? parseFloat(colR) * 100 : 0,
                pvp_sugerido_plato:   tieneValorQ ? parseFloat(colS) : 0,
                margen_plato_pesos:   tieneValorQ ? parseFloat(colT) : 0,
                proveedor:            row[2] || '',       // Col C
                stock_minimo:         parseNum(row[3]),   // Col D
                unidad_compra:        row[4] || 'kg',     // Col E
                costo_unitario:       parseNum(row[9]),   // Col J
                stock_actual:         parseNum(row[5]) || 0,  // Col F
              });
            }
          });
        }

        // Enriquecer platos con análisis financiero de 5_RECETAS
        const platosEnriquecidos = pls.map((plato) => {
          const receta = platoData[plato.nombre] || null;
          return {
            ...plato,
            costo_materia_prima:       receta ? receta.costoMateriaPrima       : null,
            margen_bruto_pct_promedio: receta ? receta.margenBrutoPctPromedio   : null,
            precio_venta_sugerido:     receta ? receta.precioVentaSugerido      : null,
            margen_bruto_pesos:        receta ? receta.margenBrutoPesos         : null,
            tiene_receta:              receta !== null,
          };
        });

        // 4. IMPORTAR MODIFICADORES
        const sMod = findSheet(['MODIFICADORES', 'GRUPOS', '3_']);
        const rowsMod = readSheetRobust(sMod, 'mod_grupo');
        const grupos = rowsMod.filter(r => r.nombre).map((r, i) => ({
          id: `gmod-${Date.now()}-${i}`,
          nombre: String(r.nombre).trim(),
          tipo_seleccion: String(r.tipo || 'UNICA').toUpperCase(),
          obligatorio: parseBool(r.obligatorio),
          min_selecciones: parseInt(r.min) || 1,
          max_selecciones: parseInt(r.max) || 1,
          estado: parseBool(r.estado) ? 'ACTIVO' : 'INACTIVO',
          _aplica_a_platos: String(r.aplica || '').trim(),
          _orden: parseInt(r.orden) || (i + 1)
        }));

        const sOp = findSheet(['OPCIONES', '4_']);
        const rowsOp = readSheetRobust(sOp, 'mod_opcion');
        const opciones = rowsOp.filter(r => r.nombre).map((r, i) => {
          const gObj = grupos.find(g => norm(g.nombre) === norm(r.grupo));
          return {
            id: `opmod-${Date.now()}-${i}`,
            grupo_id: gObj ? gObj.id : '',
            nombre: String(r.nombre).trim(),
            precio_adicional: parseNum(r.precio),
            estado: 'DISPONIBLE',
            orden: i + 1
          };
        });

        // Generar vínculos de modificadores
        const vinculos = [];
        grupos.forEach(g => {
          if (!g._aplica_a_platos) return;
          if (norm(g._aplica_a_platos) === 'todos') {
            pls.forEach(p => vinculos.push({ plato_id: p.id, grupo_id: g.id, orden_en_plato: g._orden }));
          } else {
            g._aplica_a_platos.split(',').forEach(n => {
              const p = pls.find(pl => norm(pl.nombre) === norm(n.trim()));
              if (p) vinculos.push({ plato_id: p.id, grupo_id: g.id, orden_en_plato: g._orden });
            });
          }
        });

        // Generar inventario único
        const invMap = {};
        recs.forEach(r => {
          if (!r.ingrediente_nombre) return;
          const k = norm(r.ingrediente_nombre);
          if (!invMap[k]) {
            invMap[k] = {
              id: `inv-${k}`,
              nombre: r.ingrediente_nombre,
              proveedor: r.proveedor,
              unidad_compra: r.unidad_medida,
              precio_por_unidad: r.costo_unitario,
              stock_actual: r.stock_actual,
              stock_minimo_alerta: r.stock_minimo
            };
          }
        });

        // --- ACTUALIZAR ESTADO ---
        if (cats.length > 0) setCategorias(cats);
        if (platosEnriquecidos.length > 0) setPlatos(platosEnriquecidos);
        if (recs.length > 0) setRecetas(recs);
        if (grupos.length > 0) setGruposMod(grupos);
        if (opciones.length > 0) setOpcionesMod(opciones);
        if (vinculos.length > 0) setVinculosMod(vinculos);
        
        const newInv = Object.values(invMap);
        if (newInv.length > 0) setInventario(newInv);

        console.log('[Import Summary]', { cats: cats.length, platos: pls.length, recetas: recs.length, grupos: grupos.length, opciones: opciones.length, vinculos: vinculos.length });

        setImportResult({
          categorias: cats.length,
          platos: pls.length,
          recetas: recs.length,
          insumos: newInv.length,
          modificadores: grupos.length
        });
        
        setFechaCarga(new Date().toLocaleString());
        setImporting(false);
        const platosConReceta = platosEnriquecidos.filter(p => p.tiene_receta).length;
        const platosSinReceta = platosEnriquecidos.filter(p => !p.tiene_receta).length;
        alert(`✔¦ Importación exitosa:
  🐟 ${cats.length} categorías
  🍽 ${platosEnriquecidos.length} platos
  🐟 ${Object.keys(platoData).length} platos con receta y análisis de margen
  ⚠️ ${platosSinReceta} platos sin receta registrada en 5_RECETAS`);

      } catch (err) {
        console.error('Error Crítico Importación:', err);
        setImportError('Error al procesar el archivo. Asegúrate de que el formato sea correcto.');
        setImporting(false);
        alert('❓ Error al importar: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  if (activeSubmodule === 'simulador') {
    return <SimuladorRentabilidad onClose={() => setActiveSubmodule(null)} platos={platos} inventario={inventario} recetas={recetas} />;

  if (activeSubmodule === 'costos_proveedor') {
    return <ActualizacionCostosProveedor onClose={() => setActiveSubmodule(null)} platos={platos} inventario={inventario} recetas={recetas} />;
  }

  return (
    <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500 max-w-[1200px] mx-auto pb-10">
      
      {/* Input de archivo oculto */}
      <input

      {/* TABS HEADER COMPARTIDO */}
      <div className="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-2 border-b border-gray-200 pb-6">
        <div className="flex-1 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div className="page-heading mb-1">Carta & Menú: <span>{menuTab === 'configuracion' ? 'El Origen de los Datos' : 'El Laboratorio Inteligente'}</span></div>

              {menuTab === 'configuracion' 
                ? 'Punto de partida del sistema. Ningún módulo puede operar sin que existan platos y categorías configurados aquí.' 
                : 'Sube tu menú actual y deja que la IA convierta cada plato en un activo financiero. Descubre qué te hace ganar dinero y qué te retrasa.'}
            </p>
          </div>

        </div>
        <div className="flex gap-2 bg-gray-100 p-1.5 rounded-xl shrink-0">
            <button 
              onClick={() => setMenuTab('configuracion')}
              className={`px-4 py-2 text-xs md:text-sm font-bold rounded-lg transition-all duration-300 flex items-center gap-2 ${menuTab === 'configuracion' ? 'bg-white text-slate-900 shadow-sm' : 'text-gray-500 hover:text-slate-700'}`}
            >
              🐟 1. Configuración Base
            </button>
            <button 
              onClick={() => setMenuTab('laboratorio')}
              className={`px-4 py-2 text-xs md:text-sm font-bold rounded-lg transition-all duration-300 flex items-center gap-2 ${menuTab === 'laboratorio' ? 'bg-white text-slate-900 shadow-sm' : 'text-gray-500 hover:text-slate-700'}`}
            >
              ✨ 2. Optimización IA
            </button>
        </div>
      </div>
      {menuTab === 'configuracion' && (
        <div className="space-y-6 animate-in fade-in slide-in-from-left-4 duration-300">
           
           <style dangerouslySetInnerHTML={{ __html: `
              :root {
                --color-background-primary: var(--surface);
                --color-border-tertiary: var(--gray-200);
                --color-text-secondary: var(--gray-500);
                --color-text-tertiary: var(--gray-300);
                --border-radius-lg: var(--r-lg);
              }
           `}} />

           {/* Importación Masiva – debajo del banner */}
           <div style={{background:'#0F1117', borderRadius:'var(--border-radius-lg)', padding:'1.5rem', position:'relative', overflow:'hidden'}}>
             <div className="absolute -right-10 -bottom-10 text-slate-800 opacity-20">☁</div>
             <div style={{display:'flex', alignItems:'center', justifyBetween:'space-between', position:'relative', zIndex:10}}>
               <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
                 <span style={{fontSize:'20px', color:'white'}}>⬆</span>
                 <div>
                   <h3 style={{fontWeight:500, fontSize:'16px', margin:0, color:'white'}}>Importación Masiva (CSV / Excel)</h3>
                   <p style={{fontSize:'12px', color:'#9CA3AF', margin:0}}>¿Tienes cientos de platos? Sube tu base de datos con un clic siguiendo la estructura requerida.</p>
                 </div>
               </div>
               <div style={{display:'flex', flexWrap:'wrap', gap:'8px'}}>
                 <button onClick={handleDescargarPlantilla} style={{padding:'8px 16px', fontSize:'13px', border:'0.5px solid #374151', borderRadius:'6px', background:'transparent', color:'white', cursor:'pointer'}}>1. Descargar Base de Datos</button>
                 <button
                   onClick={() => {
                     if (!window.confirm('\u00bfEst\u00e1s seguro? Se borrar\u00e1 toda la carta, platos, recetas e inventario cargados. Esta acci\u00f3n no se puede deshacer.')) return;
                     setCategorias([]);
                     setPlatos([]);
                     setRecetas([]);
                     setInventario([]);
                     setFechaCarga(null);
                     setImportResult(null);

    margenObjetivo: selectedPlato?.margen_bruto || 30,

  const [activeTab, setActiveTab] = React.useState('individual'); // 'individual' | 'global' | 'comparador'

  // Motor de Recálculo en tiempo real
  const handleUpdate = (field, value) => {
    const val = parseFloat(value) || 0;
    setSimulation(prev => {
      const next = { ...prev, [field]: val };
      if (field === 'costoInsumo' || field === 'precioVenta') {
        next.margenObjetivo = next.precioVenta > 0 ? ((next.precioVenta - next.costoInsumo) / next.precioVenta * 100) : 0;
      } else if (field === 'margenObjetivo') {
        next.precioVenta = next.costoInsumo / (1 - (val / 100));
      }
      return next;
    });
  };

  const currentMargin = simulation.precioVenta > 0 ? ((simulation.precioVenta - simulation.costoInsumo) / simulation.precioVenta * 100) : 0;

  return (
    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 max-w-[1200px] mx-auto pb-10">
      <div className="flex items-center justify-between mb-8">
        <div>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-800 flex items-center gap-2 text-sm font-bold mb-2 transition-colors">
            ← Volver a Carta & Menú
          </button>
          <h2 className="text-3xl font-black text-slate-900 tracking-tight">Gestión de Costos por Proveedor</h2>
          <p className="text-slate-500 text-sm">Monitoreo dinámico de variaciones en insumos y su impacto en la carta.</p>
        </div>
        <div className="flex gap-3">
          <div className="bg-emerald-50 border border-emerald-100 px-4 py-2 rounded-2xl flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span className="text-[10px] font-black text-emerald-700 uppercase tracking-widest">Sincronización Activa</span>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
        {/* PANEL IZQUIERDO: CAMBIO DE PRECIO */}
        <div className="lg:col-span-4 space-y-6">
          <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
            <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">1. Seleccionar Insumo</h4>
            <select 
              className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 focus:outline-none"
              onChange={(e) => {
                const ins = inventario.find(i => i.nombre === e.target.value);
                setSelectedInsumo(ins);
                setNewPrice(ins.costo_unitario);
              }}
            >
              {inventario.map(i => <option key={i.id} value={i.nombre}>{i.nombre}</option>)}
            </select>
          </div>

          <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
            <div className="flex justify-between items-center mb-6">
              <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest">2. Actualizar Precio</h4>
              <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${priceVariation > 0 ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'}`}>
                {priceVariation > 0 ? '+' : ''}{priceVariation.toFixed(1)}%
              </span>
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-[10px] font-black text-slate-400 uppercase mb-2 block">Costo Actual (Base)</label>
                <div className="text-xl font-black text-slate-400 line-through">${selectedInsumo.costo_unitario?.toLocaleString()}</div>
              </div>
              <div>
                <label className="text-[10px] font-black text-indigo-600 uppercase mb-2 block">Nuevo Costo Proveedor</label>
                <input 
                  type="number"
                  value={newPrice}
                  onChange={(e) => setNewPrice(parseFloat(e.target.value) || 0)}
                  className="w-full bg-slate-50 border-2 border-indigo-100 rounded-2xl px-4 py-4 text-2xl font-black text-slate-900 focus:border-indigo-500 focus:outline-none transition-all"
                />
              </div>
            </div>
            
            <button className="w-full mt-6 bg-slate-900 text-white py-4 rounded-2xl font-black text-sm shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
              🐟 Aplicar a toda la Carta
            </button>
          </div>

          <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
            <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">3. Historial de Variaciones</h4>
            <div className="space-y-4">
              {history.map((h, idx) => (
                <div key={idx} className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
                  <div>
                    <p className="text-xs font-bold text-slate-800">${h.precio.toLocaleString()}</p>
                    <p className="text-[10px] text-slate-400">{h.proveedor}</p>
                  </div>
                  <p className="text-[10px] font-bold text-slate-500">{h.fecha}</p>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* PANEL DERECHO: IMPACTO Y SUGERENCIAS */}
        <div className="lg:col-span-8 space-y-6">
          <div className="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
            <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
               <div>
                  <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest">Impacto en Platos e IA</h4>
                  <p className="text-[10px] text-slate-500 font-bold mt-1">Recálculo dinámico basado en recetas vinculadas</p>
               </div>
               <div className="flex gap-4">
                  <div className="text-right">
                    <p className="text-[10px] font-black text-red-500 uppercase">Alertas</p>
                    <p className="text-lg font-black text-slate-900">{affectedDishes.length}</p>
                  </div>
               </div>
            </div>
            
            <div className="overflow-x-auto">
              <table className="w-full text-left">
                <thead>
                  <tr className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                    <th className="px-6 py-4">Plato Afectado</th>
                    <th className="px-6 py-4">Margen Actual</th>
                    <th className="px-6 py-4">Margen Proyectado</th>
                    <th className="px-6 py-4">PVP Sugerido (Mantener %)</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {affectedDishes.length > 0 ? affectedDishes.map(p => {
                    const currentMargen = p.margen_bruto || 30;
                    const projectedMargen = currentMargen - (priceVariation * 0.2); // Simulación
                    const suggestedPVP = (p.costo_produccion * (1 + (priceVariation/100))) / (1 - (currentMargen/100));
                    
                    return (
                      <tr key={p.id} className="hover:bg-slate-50/50 transition-colors">
                        <td className="px-6 py-4">
                          <p className="text-sm font-bold text-slate-800">{p.nombre}</p>
                          <p className="text-[10px] text-slate-400">{p.categoria_nombre}</p>
                        </td>
                        <td className="px-6 py-4 text-sm font-bold text-slate-500">{currentMargen.toFixed(1)}%</td>
                        <td className="px-6 py-4">
                          <div className="flex items-center gap-2">
                             <span className={`text-sm font-black ${projectedMargen < 25 ? 'text-red-500' : 'text-amber-500'}`}>{projectedMargen.toFixed(1)}%</span>
                             {projectedMargen < 25 && <span className="animate-pulse text-xs">⚠️</span>}
                          </div>
                        </td>
                        <td className="px-6 py-4">
                           <div className="flex items-center gap-3">
                              <span className="text-sm font-black text-emerald-600">${Math.round(suggestedPVP).toLocaleString()}</span>
                              <button className="text-[10px] font-black bg-emerald-50 text-emerald-700 px-2 py-1 rounded-md border border-emerald-100 hover:bg-emerald-100 transition-all">Actualizar PVP</button>
                           </div>
                        </td>
                      </tr>
                    );
                  }) : (
                    <tr>
                      <td colSpan="4" className="px-6 py-12 text-center">
                        <p className="text-sm text-slate-400 italic">Selecciona un insumo para ver los platos afectados.</p>
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
              <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-6">Comparación entre Proveedores</h4>
              <div className="space-y-4">
                <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-100 relative">
                   <div className="absolute right-4 top-4 text-emerald-500">🐟 </div>
                   <p className="text-[10px] font-black text-emerald-600 uppercase mb-1">Mejor Opción Actual</p>
                   <p className="text-sm font-bold text-slate-900">Distribuidora AVES</p>
                   <p className="text-lg font-black text-emerald-700">${selectedInsumo.costo_unitario?.toLocaleString()}</p>
                </div>
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                   <p className="text-[10px] font-black text-slate-400 uppercase mb-1">Alternativa Registrada</p>
                   <p className="text-sm font-bold text-slate-900">Carnes S.A.</p>
                   <p className="text-lg font-black text-slate-600">${(selectedInsumo.costo_unitario * 1.08).toLocaleString()}</p>
                </div>
              </div>
            </div>

            <div className="bg-indigo-900 rounded-3xl p-8 text-white relative overflow-hidden flex flex-col justify-center">
               <div className="absolute -right-4 -bottom-4 text-8xl opacity-10">🐟</div>
               <h4 className="text-[10px] font-black text-indigo-300 uppercase tracking-widest mb-2">Resumen de Impacto</h4>
               <p className="text-2xl font-black mb-4">Margen Promedio: <span className="text-red-400">-{ (priceVariation * 0.15).toFixed(1) }%</span></p>
               <p className="text-xs text-indigo-200 leading-relaxed">
                 Si aplicas este cambio, tu Food Cost promedio subirá un {(priceVariation * 0.08).toFixed(1)}%. Se recomienda revisar los precios de venta de los platos en rojo.
               </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProductCard({ p, qty, hasNote, handleAddItem, handleUpdateQty, setActiveNotePlatoId }) {
  return (
    <div
      onClick={(e) => {
        if (e.target.closest('button')) return;
        qty === 0 ? handleAddItem(p) : handleUpdateQty(p.id, 1);
      }}
      className={`
        relative group cursor-pointer transition-all duration-500 ease-out
        bg-white rounded-[32px] p-4 border border-slate-100/50 shadow-[0_8px_30px_rgb(0,0,0,0.04)]
        hover:shadow-[0_20px_40px_rgba(0,0,0,0.08)] hover:-translate-y-1.5
        ${qty > 0 ? 'ring-2 ring-emerald-500/20 border-emerald-500/30' : ''}
      `}
    >
      {/* SELECTION GLOW */}
      {qty > 0 && (
        <div className="absolute inset-0 rounded-[32px] bg-emerald-500/[0.03] animate-pulse" />
      )}

      {/* QUANTITY BADGE - PREMIUM */}
      {qty > 0 && (
        <div className="absolute -top-2 -right-2 z-20 flex items-center justify-center">
          <div className="absolute inset-0 bg-emerald-500 blur-md opacity-40 animate-pulse" />
          <div className="relative h-8 w-8 bg-emerald-500 text-white rounded-full flex items-center justify-center text-[11px] font-black shadow-lg border-2 border-white">
            {qty}
          </div>
        </div>
      )}

      {/* IMAGE CONTAINER */}
      <div className="relative w-full aspect-square rounded-[24px] overflow-hidden bg-slate-50 mb-4 shadow-inner">
        {p.img ? (
          <img
            src={p.img}
            alt={p.name}
            className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
            onError={(e) => { e.target.style.display='none'; e.target.parentNode.querySelector('.fallback').style.display='flex'; }}
          />
        ) : (
          <div className="w-full h-full flex items-center justify-center text-4xl bg-slate-50">🍽</div>
        )}
        <div className="fallback hidden w-full h-full items-center justify-center text-4xl bg-slate-50">🍽</div>
        
        {/* OVERLAY ON HOVER */}
        <div className="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-300" />
        
        {/* STATUS BADGE IF POPULAR */}
        {p.tag === 'popular' && (
          <div className="absolute top-3 left-3 px-2 py-1 bg-amber-400 text-white text-[8px] font-black uppercase tracking-widest rounded-lg shadow-sm">
            ✨ Popular
          </div>
        )}
      </div>

      {/* INFO */}
      <div className="flex flex-col gap-1 mb-4">
        <div className="flex items-start justify-between gap-2">
          <h3 className="text-[14px] font-bold text-slate-900 leading-snug group-hover:text-blue-600 transition-colors truncate">
            {p.name}
          </h3>
          <button
            onClick={(e) => {
              e.stopPropagation();
              setActiveNotePlatoId(p.id);
            }}
            className={`flex-shrink-0 p-1.5 rounded-xl transition-all ${
              hasNote 
                ? 'bg-amber-100 text-amber-600 shadow-sm' 
                : 'bg-slate-50 text-slate-400 hover:bg-blue-50 hover:text-blue-600'
            }`}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
        </div>
        <p className="text-[10px] text-slate-400 line-clamp-2 leading-relaxed">
          {p.desc || 'Preparación artesanal con ingredientes frescos seleccionados.'}
        </p>
      </div>

      {/* FOOTER: PRICE & ACTIONS */}
      <div className="flex items-center justify-between mt-auto pt-2">
        <div className="flex flex-col">
          <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Precio</span>
          <span className="text-[16px] font-black text-slate-900 tracking-tight">
            ${p.price.toLocaleString('es-CO')}
          </span>
        </div>

        <div className="flex items-center bg-slate-50 rounded-2xl p-1 gap-1 border border-slate-100">
          {qty > 0 && (
            <button
              onClick={(e) => { e.stopPropagation(); handleUpdateQty(p.id, -1); }}
              className="w-7 h-7 flex items-center justify-center rounded-xl bg-white text-slate-600 shadow-sm hover:text-rose-500 transition-all active:scale-90"
            >
              <span className="text-lg font-bold">−</span>
            </button>
          )}
          
          {qty > 0 && (
            <span className="w-6 text-center text-[12px] font-black text-slate-700">{qty}</span>
          )}

          <button
            onClick={(e) => { e.stopPropagation(); qty === 0 ? handleAddItem(p) : handleUpdateQty(p.id, 1); }}
            className={`
              w-7 h-7 flex items-center justify-center rounded-xl transition-all active:scale-90 shadow-sm
              ${qty > 0 ? 'bg-emerald-500 text-white' : 'bg-slate-900 text-white hover:bg-blue-600'}
            `}
          >
            <span className="text-lg font-bold">+</span>
          </button>
        </div>
      </div>
    </div>
  );
}


    </script>
</body>
</html>
