// =========================================================================
// WIDGET: MI RESTAURANTE (CONFIGURACION)
// =========================================================================
function ViewMiRestaurante() {
  const [loading, setLoading] = React.useState(true);
  const [saving, setSaving] = React.useState(false);
  const [message, setMessage] = React.useState(null);
  
  const [formData, setFormData] = React.useState({
    nombre: "", nit: "", razon_social: "", direccion: "", ciudad: "", telefono: "", email: "", propietario: "", sitio_web: "", logo_url: "",
    regimen_tributario: "simplificado", responsable_iva: false, impuesto_consumo: true, resolucion_dian: "", prefijo_facturacion: "", rango_desde: "", rango_hasta: "", fecha_vencimiento_resolucion: "",
    zona_horaria: "America/Bogota", hora_apertura: "08:00", hora_cierre: "22:00", hora_corte: "02:00", dias_activos: ["LUN","MAR","MIE","JUE","VIE","SAB","DOM"], capacidad_mesas: 0, capacidad_sillas: 0,
    modalidades: { salon: true, delivery: false, para_llevar: false }, propina_porcentaje: 10,
    medios_pago: { efectivo: true, tarjeta_debito: true, tarjeta_credito: true, nequi: true, daviplata: false, transferencia: false, rappi_pay: false, vale_alimentacion: false, cortesia: false, credito_cuenta: false },
    canales: { salon_comision: 0, delivery_propio_recargo: 0, rappi_comision: 28, domicilios_comision: 22 },
    alertas: { email_alertas: "", umbral_ventas_meta: 85, umbral_prime_cost: 65, alerta_stock: true, resumen_diario_hora: "23:00", reporte_semanal_dia: "LUN" }
  });

  React.useEffect(() => {
    const loadProfile = async () => {
      try {
        setLoading(true);
        let d = null;
        try {
          if (window.location.protocol === 'file:') throw new Error('OFFLINE');
          const resp = await fetch('/api/restaurante');
          if (resp && resp.ok) d = await resp.json();
        } catch (_) { /* offline */ }
        if (d && Object.keys(d).length > 0) setFormData(d);
        else if (typeof MOCK_DATA !== 'undefined' && MOCK_DATA.restaurante) {
          setFormData(prev => ({ ...prev, ...MOCK_DATA.restaurante }));
        }
      } catch (err) {
        if (err.message && err.message.includes('fetch')) return;
        if (typeof MOCK_DATA !== 'undefined' && MOCK_DATA.restaurante) {
          setFormData(prev => ({ ...prev, ...MOCK_DATA.restaurante }));
        }
        setFormData(prev => ({ ...prev, ...MOCK_DATA.restaurante }));
      } finally {
        setLoading(false);
      }
    };
    loadProfile();
  }, []);

  const handleChange = (e) => {
    const { name, value, type, checked } = e.target;
    setFormData(p => ({ ...p, [name]: type === 'checkbox' ? checked : value }));
  };

  const handleNested = (c, f, v) => setFormData(p => ({ ...p, [c]: { ...p[c], [f]: v } }));
  const handleArray = (f, i) => setFormData(p => {
    const arr = p[f] || [];
    return { ...p, [f]: arr.includes(i) ? arr.filter(x => x !== i) : [...arr, i] };
  });

  const getProgress = () => {
    const reqFields = ['nombre','nit','razon_social','direccion','ciudad','telefono','email','propietario','regimen_tributario','resolucion_dian','prefijo_facturacion','rango_desde','rango_hasta','fecha_vencimiento_resolucion','hora_apertura','hora_cierre','hora_corte'];
    const filled = reqFields.filter(x => formData[x] && String(formData[x]).trim() !== '');
    return Math.round((filled.length / reqFields.length) * 100);
  };

  const getDaysUntilExpiry = () => {
    if(!formData.fecha_vencimiento_resolucion) return 0;
    const diff = new Date(formData.fecha_vencimiento_resolucion).getTime() - Date.now();
    return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  };

  const isExpiring = () => {
    const days = getDaysUntilExpiry();
    return days > 0 && days < 30;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setMessage(null);
    if(!formData.nit) return setMessage({ type: 'error', text: 'El NIT es obligatorio.' });
    if(formData.hora_corte === formData.hora_apertura) return setMessage({ type: 'error', text: 'La hora de corte no puede ser igual a la de apertura.' });
    if((formData.dias_activos || []).length === 0) return setMessage({ type: 'error', text: 'Debe estar activo al menos un día.' });
    if(!Object.values(formData.medios_pago || {}).some(Boolean)) return setMessage({ type: 'error', text: 'Debe activar al menos un medio de pago.' });
    
    const emailRegex = /^[^s@]+@[^s@]+.[^s@]+$/;
    if(formData.alertas.email_alertas && !emailRegex.test(formData.alertas.email_alertas)) {
      return setMessage({ type: 'error', text: 'El correo de alertas no es válido.' });
    }

    setSaving(true);
    try {
      const res = {ok: true}; // fetch removido
      if(res.ok) {
        setMessage({ type: 'success', text: 'Configuración guardada correctamente.' });
        setTimeout(() => setMessage(null), 3000);
      } else throw new Error('Error al guardar');
    } catch(err) {
      setMessage({ type: 'error', text: 'Error de red al guardar.' });
    }
    setSaving(false);
  };

  if(loading) return <div className="p-10 text-center">🐟 Cargando...</div>;

  return (
    <div className="max-w-[1000px] mx-auto pb-20 animate-in fade-in">
      <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6 flex justify-between items-center sticky top-4 z-50">
        <div>
          <h2 className="text-2xl font-black text-slate-800">Mi Restaurante</h2>
          <p className="text-sm text-gray-500">Mi Restaurante está {getProgress()}% configurado.</p>
        </div>
        <div className="flex gap-4 items-center">
          <div className="w-32 bg-gray-100 h-2 rounded-full overflow-hidden">
             <div className={`h-full transition-all ${getProgress() > 80 ? 'bg-green-500' : getProgress() < 40 ? 'bg-red-500' : 'bg-orange-500'}`} style={{width: `${getProgress()}%`}}></div>
          </div>
          <button onClick={handleSubmit} disabled={saving} className="btn bg-slate-900 text-white hover:bg-slate-800 px-4 py-3 rounded-lg flex items-center gap-2 font-bold text-sm shadow-md">
            {saving ? '🐟' : '🐟'} Guardar Cambios
          </button>
        </div>
      </div>

      {message && (
        <div className={`p-4 mb-6 rounded-xl font-bold flex items-center gap-2 ${message.type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
          {message.type === 'error' ? '⚠️' : '✅'} {message.text}
        </div>
      )}

      <div className="space-y-6">
        <div className="bg-white border rounded-2xl p-6">
          <h3 className="font-black flex items-center gap-2 mb-4">🐟 1. Datos del negocio</h3>
          <div className="grid grid-cols-2 gap-4">
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Nombre Comercial</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="nombre" value={formData.nombre} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">NIT</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="nit" value={formData.nit} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Razón Social</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="razon_social" value={formData.razon_social} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Logo URL</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="logo_url" value={formData.logo_url} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Dirección</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="direccion" value={formData.direccion} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Ciudad</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="ciudad" value={formData.ciudad} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Teléfono</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="telefono" value={formData.telefono} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Correo Electrónico</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="email" value={formData.email} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Nombre Propietario</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="propietario" value={formData.propietario} onChange={handleChange}/></div>
          </div>
        </div>

        <div className="bg-white border rounded-2xl p-6">
          <h3 className="font-black flex items-center gap-2 mb-4">🐟 2. Configuración fiscal DIAN</h3>
          {isExpiring() && <div className="bg-orange-50 text-orange-800 p-3 rounded-lg border border-orange-200 mb-4 text-xs font-bold flex gap-2">⚠️ La resolución vence en menos de 30 días</div>}
          <div className="grid grid-cols-3 gap-6 mb-4">
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Régimen Tributario</label><select name="regimen_tributario" value={formData.regimen_tributario} onChange={handleChange} className="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option value="simplificado">Simplificado</option><option value="comun">Común</option></select></div>
             <label className="flex items-center gap-2 font-bold text-sm bg-gray-50 p-2 rounded-lg border w-full"><input type="checkbox" className="w-4 h-4 accent-orange-500" name="responsable_iva" checked={formData.responsable_iva} onChange={handleChange}/> Responsable de IVA</label>
             <label className="flex items-center gap-2 font-bold text-sm bg-gray-50 p-2 rounded-lg border w-full"><input type="checkbox" className="w-4 h-4 accent-orange-500" name="impuesto_consumo" checked={formData.impuesto_consumo} onChange={handleChange}/> Impuesto al Consumo (8%)</label>
          </div>
          <div className="grid grid-cols-5 gap-4">
             <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 mb-1">Resolución DIAN</label><input className="w-full border p-2 rounded-lg bg-gray-50 text-sm" name="resolucion_dian" value={formData.resolucion_dian} onChange={handleChange}/></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Prefijo</label><input className="w-full border p-2 rounded-lg bg-gray-50 text-sm" name="prefijo_facturacion" value={formData.prefijo_facturacion} onChange={handleChange}/></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Desde</label><input className="w-full border p-2 rounded-lg bg-gray-50 text-sm" type="number" name="rango_desde" value={formData.rango_desde} onChange={handleChange}/></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Hasta</label><input className="w-full border p-2 rounded-lg bg-gray-50 text-sm" type="number" name="rango_hasta" value={formData.rango_hasta} onChange={handleChange}/></div>
             <div className="col-span-2">
                <label className="block text-xs font-bold text-gray-500 mb-1">Vencimiento Resolución</label>
                <input className="w-full border p-2 rounded-lg bg-gray-50 text-sm" type="date" name="fecha_vencimiento_resolucion" value={formData.fecha_vencimiento_resolucion} onChange={handleChange}/>
                {isExpiring() && (
                  <p className="text-[10px] text-orange-600 font-bold mt-1 animate-pulse">
                    ⚠️ La resolución DIAN vence en {getDaysUntilExpiry()} días. Renuévala antes de quedarte sin folios.
                  </p>
                )}
             </div>
          </div>
        </div>

        <div className="bg-white border rounded-2xl p-6">
          <h3 className="font-black flex items-center gap-2 mb-4">🐟 3. Configuración de operación</h3>
          <div className="grid grid-cols-4 gap-4 mb-6">
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Zona horaria</label><select className="w-full border p-2 rounded-lg bg-gray-50 text-sm"><option value="America/Bogota">America/Bogota</option></select></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Hora inicio</label><input type="time" name="hora_apertura" value={formData.hora_apertura} onChange={handleChange} className="w-full border p-2 rounded-lg bg-gray-50 text-sm"/></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Hora cierre</label><input type="time" name="hora_cierre" value={formData.hora_cierre} onChange={handleChange} className="w-full border p-2 rounded-lg bg-gray-50 text-sm"/></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Hora corte 🕒</label><input type="time" name="hora_corte" value={formData.hora_corte} onChange={handleChange} className="w-full border p-2 rounded-lg bg-gray-50 text-sm"/></div>
          </div>
          <div className="mb-6">
             <label className="block text-xs font-bold text-gray-500 mb-2">Días Activos</label>
             <div className="flex gap-2 text-sm font-bold">
               {['LUN','MAR','MIE','JUE','VIE','SAB','DOM'].map(dia => (
                 <button key={dia} onClick={(e)=> {e.preventDefault(); handleArray('dias_activos',dia);}} className={`px-3 py-2 rounded-lg border transition-colors ${(formData.dias_activos || []).includes(dia) ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-400 border-gray-200'}`}>{dia}</button>
               ))}
             </div>
          </div>
          <div className="grid grid-cols-3 gap-6 pt-6 border-t border-gray-100">
             <div>
                <label className="block text-xs font-bold text-gray-500 mb-2">Modalidades Activas</label>
                {[{i:'salon',l:'Salón'},{i:'delivery',l:'Delivery'},{i:'para_llevar',l:'Para Llevar'}].map(mod => (
                   <label key={mod.i} className="flex gap-2 items-center mb-2 font-bold text-sm hover:bg-gray-50 p-2 rounded"><input type="checkbox" className="w-4 h-4 accent-indigo-600" checked={(formData.modalidades || {})[mod.i]} onChange={e=>handleNested('modalidades',mod.i,e.target.checked)}/> {mod.l}</label>
                ))}
             </div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Capacidad Mesas</label><input type="number" name="capacidad_mesas" value={formData.capacidad_mesas} onChange={handleChange} className="w-full border p-2 rounded-lg bg-gray-50 text-lg font-black"/></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Capacidad Sillas</label><input type="number" name="capacidad_sillas" value={formData.capacidad_sillas} onChange={handleChange} className="w-full border p-2 rounded-lg bg-gray-50 text-lg font-black"/></div>
             <div><label className="block text-xs font-bold text-gray-500 mb-1">Propina sugerida (%)</label><input type="number" name="propina_porcentaje" value={formData.propina_porcentaje} onChange={handleChange} className="w-full border p-2 rounded-lg bg-indigo-50 text-lg font-black text-indigo-600"/></div>
          </div>
        </div>

        <div className="bg-white border rounded-2xl p-6">
          <h3 className="font-black flex items-center gap-2 mb-4">🐟 4. Medios de pago</h3>
          <div className="grid grid-cols-5 gap-4">
             {[{i:'efectivo',l:'Efectivo'},{i:'tarjeta_debito',l:'TJ Débito'},{i:'tarjeta_credito',l:'TJ Crédito'},{i:'nequi',l:'Nequi'},{i:'daviplata',l:'Daviplata'},{i:'transferencia',l:'Transfer'},{i:'rappi_pay',l:'Rappi Pay'},{i:'vale_alimentacion',l:'Vale'},{i:'cortesia',l:'Cortesía'},{i:'credito_cuenta',l:'Crédito'}].map(p => (
                <div key={p.i} onClick={()=>handleNested('medios_pago',p.i,!(formData.medios_pago || {})[p.i])} className={`p-4 border rounded-xl flex flex-col items-center justify-center cursor-pointer transition-colors ${(formData.medios_pago || {})[p.i] ? 'bg-green-50/50 border-green-500 text-green-700 font-bold' : 'bg-gray-50 border-gray-200 text-gray-400'}`}>
                  <div className={`w-6 h-6 rounded-full flex items-center justify-center mb-2 ${(formData.medios_pago || {})[p.i]?'bg-green-100':'bg-gray-200'}`}>{ (formData.medios_pago || {})[p.i] ? '✅' : ''}</div>
                  <span className="text-[10px] font-black uppercase text-center block leading-none">{p.l}</span>
                </div>
             ))}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-6">
          <div className="bg-white border rounded-2xl p-6">
            <h3 className="font-black flex items-center gap-2 mb-4">🐟 5. Canales de venta</h3>
            <div className="space-y-4">
               {[{i:'salon_comision',l:'Salón'},{i:'delivery_propio_recargo',l:'Delivery Propio'},{i:'rappi_comision',l:'Rappi'},{i:'domicilios_comision',l:'Domicilios.com'}].map(c=>(
                  <div key={c.i} className="flex items-center justify-between border-b pb-2">
                     <span className="text-sm font-bold text-gray-700">{c.l}</span>
                     <div className="flex gap-2 font-black items-center"><input type="number" value={(formData.canales || {})[c.i]} onChange={e=>handleNested('canales',c.i,Number(e.target.value))} className="w-16 border p-1 text-center rounded"/> %</div>

    const tryFetch = async (url, fallback) => {
      if (window.location.protocol === 'file:') return fallback;
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } catch (_) {
        return fallback;
      }
    };
    const [resPlatos, resCats, resRecetas, resInv] = await Promise.all([
      tryFetch('/api/platos',     MOCK_DATA.platos     || []),
      tryFetch('/api/categorias', MOCK_DATA.categorias || []),
      tryFetch('/api/recetas',    []),
      tryFetch('/api/inventario', {})
    ]);
    setPlatos(resPlatos     || MOCK_DATA.platos     || []);
    setCategorias(resCats   || MOCK_DATA.categorias || []);
    setRecetas(Array.isArray(resRecetas) ? resRecetas : []);
    setInventario(resInv    || {});

  // FLUJO 1: Carta & Menú → Inventario (al guardar receta)
  const handleGuardarReceta = async (platoId, nuevosIngredientes) => {
    // Update local state immediately; sync to API when backend is available
    setRecetas(prev => {
      const next = Array.isArray(prev) ? [...prev] : [];
      const idx = next.findIndex(r => r.platoId === platoId);
      if (idx >= 0) next[idx] = { platoId, ingredientes: nuevosIngredientes };
      else next.push({ platoId, ingredientes: nuevosIngredientes });
      return next;
    });
    try {
      if (window.location.protocol === 'file:') return;
      await fetch('/api/recetas/' + platoId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nuevosIngredientes)
      });
    } catch (_) { /* offline — local state already updated */ }
  };

  const handleTogglePlato = async (platoId, activo) => {
    setPlatos(prev => prev.map(p => p.id === platoId ? { ...p, estado: activo ? 'activo' : 'inactivo' } : p));
    try {
      if (window.location.protocol === 'file:') return;
      await fetch('/api/platos/' + platoId, {

                                  const isSel = currentSel.includes(opt);

                                     <button

                                        onClick={() => {
                                           const isMulti = gId === 'sin';
                                           let newSels = isSel

                                     >

                      className="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 text-xs min-h-[80px] focus:bg-white focus:border-blue-400 outline-none transition-all resize-none"
                    />
                </div>
             </div>

             <div className="mt-8">
                <button 
                  onClick={() => {
                    // Sincronizar con el carrito
                    const plato = posProducts.find(p => p.id === activeNotePlatoId);
                    const note = itemNotes[activeNotePlatoId];
                    
                    setOrderItems(prev => {
                      const existing = prev.find(i => i.id === activeNotePlatoId);
                      if (existing) {
                        return prev.map(i => i.id === activeNotePlatoId ? { ...i, nota: note } : i);
                      } else {
                        return [...prev, { ...plato, qty: 1, nota: note }];
                      }
                    });

                    setActiveNotePlatoId(null);
                  }}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-black text-sm shadow-xl shadow-blue-200 transition-all active:scale-95"

                        {r.vel === 'fast' ? 'Rápido' : 'Lento'}
                     </span>
                  </div>
               ))}
            </div>
         </div>

      </div>

    </div>

}

  const mapDias = (dias) => {
    if (!dias || dias.length === 0) return '';
    if (dias.length === 7) return 'Todos';
    const ordenados = dias.map(d => DIAS_SEMANA.findIndex(x => x.id === d)).sort((a,b) => a-b);
    if (ordenados.length === 6 && ordenados[0] === 0 && ordenados[5] === 5) return 'Lun-Sáb';
    if (ordenados.length === 3 && ordenados[0] === 4 && ordenados[2] === 6 && ordenados[1] === 5) return 'Vie-Dom';
    return dias.map(d => d.charAt(0) + d.slice(1).toLowerCase()).join(','); 
  };

  const formatHorario = (horario) => {
    if (!horario) return "24/7";
    if (horario.tipo === 'temporada') return `${formatearFecha(horario.fecha_desde)} - ${formatearFecha(horario.fecha_hasta)}`;
    if (horario.tipo === '24/7') return `Todos ${horario.inicio}-${horario.fin}h`;
    return `${mapDias(horario.dias)} ${horario.inicio}-${horario.fin}h`.replace(':00h','h').replace(':00-','-');
  };

  const handleOpenModal = (cat = null) => {
    setFormError('');
    if (cat) {
      setEditingCategory(cat);
      setFormData({
         nombre: cat.nombre, canal: cat.canal, estado: cat.estado, color: cat.color || '#7C3AED', icono: cat.icono || '🐟',
         destino_impresion: cat.destino_impresion || 'Cocina Principal', impuesto: cat.impuesto || '8% Impoconsumo',
         prioridad_pos: cat.prioridad_pos || 1, hasHorario: cat.horario !== null,
         tipo_horario: cat.horario?.tipo || 'semanal', hora_inicio: cat.horario?.inicio || '12:00', hora_fin: cat.horario?.fin || '23:00',
         dias: cat.horario?.dias || ['LUN','MAR','MIE','JUE','VIE','SAB','DOM'], fecha_desde: cat.horario?.fecha_desde || '', fecha_hasta: cat.horario?.fecha_hasta || ''
      });
    } else {
      setEditingCategory(null);
      setFormData({ ...defaultForm, prioridad_pos: categorias.length > 0 ? Math.max(...categorias.map(c => c.prioridad_pos || 0)) + 1 : 1 });
    }
    setShowModal(true);
  };

  const handleSave = (e) => {
    e.preventDefault();
    setFormError('');
    const nombreLimpio = formData.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre de la categoría es obligatorio.');
    const isDuplicate = categorias.some(c => c.nombre.toLowerCase() === nombreLimpio.toLowerCase() && c.id !== editingCategory?.id);
    if (isDuplicate) return setFormError('Ya existe una categoría con este nombre (Error 409).');
    
    let hor = null;
    if (formData.hasHorario) {
      hor = { tipo: formData.tipo_horario, inicio: formData.hora_inicio, fin: formData.hora_fin, dias: formData.dias, fecha_desde: formData.fecha_desde, fecha_hasta: formData.fecha_hasta };
    }

    const nuevaCategoria = {
      id: editingCategory ? editingCategory.id : `uuid-${Date.now()}`,
      nombre: nombreLimpio, canal: formData.canal,
      estado: formData.estado, color: formData.color, icono: formData.icono,
      destino_impresion: formData.destino_impresion, impuesto: formData.impuesto,
      prioridad_pos: formData.prioridad_pos, horario: hor, platos_count: editingCategory?.platos_count || 0
    };
    
    let updated;
    if (editingCategory) { updated = categorias.map(c => c.id === editingCategory.id ? nuevaCategoria : c); }
    else { updated = [...categorias, nuevaCategoria]; }
    
    updated.sort((a,b) => a.prioridad_pos - b.prioridad_pos);
    setCategorias(updated);
    setShowModal(false);
  };

  const handleUpdatePriority = (catId, val) => {
    const updated = categorias.map(c => c.id === catId ? { ...c, prioridad_pos: val } : c);
    updated.sort((a,b) => a.prioridad_pos - b.prioridad_pos);
    setCategorias(updated);
  };

  const handleToggleEstado = (cat) => {
    const nuevoEstado = cat.estado === 'ACTIVA' ? 'INACTIVA' : 'ACTIVA';
    if (nuevoEstado === 'INACTIVA') {
      const ok = window.confirm(`⚠️ Al desactivar "${cat.nombre}" sus platos dejarán de aparecer en la carta.

¿Continuar?`);
      if (!ok) return;
    }
    setCategorias(categorias.map(c => c.id === cat.id ? { ...c, estado: nuevoEstado } : c));
    if (nuevoEstado === 'ACTIVA') {
      setActiveCatNames(prev => prev.includes(cat.nombre) ? prev : [...prev, cat.nombre]);
      setCategoriasExpandidas(prev => prev.includes(cat.nombre) ? prev : [...prev, cat.nombre]);
    } else {
      setActiveCatNames(prev => prev.filter(n => n !== cat.nombre));
    }
  };

  const handleDelete = (cat) => {
    const ok = window.confirm(`🐟 ¿Eliminar la categoría "${cat.nombre}"?

Esta acción es irreversible.`);
    if (!ok) return;
    setCategorias(categorias.filter(c => c.id !== cat.id));
  };

  const handleDragStart = (e, position) => { dragItem.current = position; };
  const handleDragEnter = (e, position) => { dragOverItem.current = position; };
  const handleDragEnd = () => {
    const copy = [...categorias];
    const dragged = copy[dragItem.current];
    copy.splice(dragItem.current, 1);
    copy.splice(dragOverItem.current, 0, dragged);
    // Reordenar prioridades según el arrastre
    const rescored = copy.map((c, i) => ({ ...c, prioridad_pos: i + 1 }));
    setCategorias(rescored);
    dragItem.current = null; dragOverItem.current = null;
  };

  const toggleScheduleRow = (catId, currentHorario) => {
    if (expandedSchedule === catId) { setExpandedSchedule(null); return; }
    const hr = currentHorario || { tipo: 'semanal', inicio: '12:00', fin: '23:00', dias: ['LUN','MAR','MIE','JUE','VIE','SAB','DOM'], fecha_desde: '', fecha_hasta: '' };
    setInlineHorario(prev => ({ ...prev, [catId]: { ...hr } }));
    setExpandedSchedule(catId);
  };

  const handleToggleScheduleActive = (cat) => {
    if (cat.horario) {
      setCategorias(categorias.map(c => c.id === cat.id ? { ...c, horario: null } : c));
      setExpandedSchedule(null);
    } else {
      setInlineHorario(prev => ({ ...prev, [cat.id]: { tipo:'semanal', inicio: '12:00', fin: '23:00', dias: ['LUN','MAR','MIE','JUE','VIE','SAB','DOM'], fecha_desde: '', fecha_hasta: '' } }));
      setExpandedSchedule(cat.id);
    }
  };

  const handleInlineDayToggle = (catId, day) => {
    setInlineHorario(prev => {
      const dias = prev[catId]?.dias || [];
      return { ...prev, [catId]: { ...prev[catId], dias: dias.includes(day) ? dias.filter(d => d !== day) : [...dias, day] } };
    });
  };

  const handleSaveInlineSchedule = (cat) => {
    const h = inlineHorario[cat.id];
    if (!h || (h.tipo !== '24/7' && h.dias.length === 0)) return;
    setCategorias(categorias.map(c => c.id === cat.id ? { ...c, horario: { ...h } } : c));
    setExpandedSchedule(null);
  };

  const canalBadge = (canal) => {
    if (canal === 'SALON') return <span className="text-[9px] font-black px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 uppercase tracking-wide">Salón</span>;
    if (canal === 'DELIVERY') return <span className="text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 uppercase tracking-wide">Delivery</span>;
    return <span className="text-[9px] font-black px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 uppercase tracking-wide">Ambos</span>;
  };

  return (
    <div className="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden mb-8">
      <div className="overflow-x-auto">
        <table className="w-full text-left border-collapse">
          <thead>
            <tr className="bg-gray-50 border-b border-gray-200">
              <th className="px-3 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center w-28" style={{display:'none'}}></th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Nombre / Platos</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Destino Impresión</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Impuesto</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Canal</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center" style={{display:'none'}}></th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Visibilidad</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Horario Detallado</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            {categorias && categorias.map((cat, index) => {
              const countPlatos = (platos || []).filter(p => p.categoria_nombre === cat.nombre || p.categoria_id === cat.id).length || cat.platos_count || 0;
              return (
              <React.Fragment key={cat.id}>
                <tr
                  draggable onDragStart={(e) => handleDragStart(e, index)} onDragEnter={(e) => handleDragEnter(e, index)}
                  onDragEnd={handleDragEnd} onDragOver={(e) => e.preventDefault()}
                  className={`border-b border-gray-100 transition-colors h-[72px] hover:bg-slate-50 ${index % 2 === 1 ? 'bg-gray-50/40' : 'bg-white'} ${cat.estado === 'INACTIVA' ? 'opacity-55' : ''}`}
                >
                  <td className="px-3 py-3 w-28" style={{display:'none'}}>
                    <div className="flex items-center gap-2">
                       <span className="text-gray-300 hover:text-indigo-400 cursor-grab text-lg tracking-[-2px] -ml-1">⠿</span>
                       <span className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor: cat.color}}></span>
                       <span className="w-8 h-8 flex items-center justify-center rounded-xl text-lg shadow-sm font-black" style={{backgroundColor: `${cat.color}20`}}>{cat.icono}</span>
                    </div>
                  </td>
                  <td className="px-4 py-3">
                    <span className={`text-sm block font-bold truncate max-w-[140px] ${cat.estado === 'INACTIVA' ? 'text-gray-400 line-through' : 'text-slate-800'}`}>{cat.nombre}</span>
                    <span className="block text-[10px] text-gray-400 font-medium mt-0.5">{countPlatos} platos</span>
                  </td>
                  <td className="px-4 py-3 text-center">
                    <div className="flex flex-col items-center gap-1">
                      <span className="opacity-70" style={{fontSize:'14px', lineHeight:1}}>🐟</span>
                      <span className="text-[9px] font-bold text-gray-500 uppercase tracking-tight">{cat.destino_impresion || 'Cocina Principal'}</span>
                    </div>
                  </td>
                  <td className="px-4 py-3 text-center">
                    <span className={`text-xs font-black px-2 py-0.5 rounded uppercase tracking-wider ${cat.impuesto?.includes('19') ? 'text-red-500 bg-red-50' : cat.impuesto?.includes('Exento') ? 'text-emerald-600 bg-emerald-50' : 'text-gray-500 bg-gray-100'}`}>{cat.impuesto || '8% Impoconsumo'}</span>
                  </td>
                  <td className="px-4 py-3 text-center">{canalBadge(cat.canal)}</td>
                  <td className="px-4 py-3 text-center" style={{display:'none'}}>
                    <input 
                      type="number" min="1" 
                      value={cat.prioridad_pos} 
                      onChange={(e) => handleUpdatePriority(cat.id, parseInt(e.target.value) || 0)} 
                      className="w-12 h-8 text-center text-xs font-black border border-gray-200 rounded-lg bg-gray-50 outline-none focus:border-indigo-500 focus:bg-white transition-all shadow-inner mx-auto"
                    />
                  </td>
                  <td className="px-4 py-3 text-center">
                    <div className="flex flex-col items-center gap-1 mt-1">
                      <div onClick={() => handleToggleEstado(cat)} className={`relative w-8 h-4 flex items-center rounded-full px-0.5 cursor-pointer transition-colors ${cat.estado === 'ACTIVA' ? 'bg-slate-800' : 'bg-gray-300'}`}>
                        <div className="w-3 h-3 bg-white rounded-full shadow-md transition-transform" style={{ transform: cat.estado === 'ACTIVA' ? 'translateX(16px)' : 'translateX(0)' }}></div>
                      </div>
                      <span className={`text-[9px] font-bold ${cat.estado === 'ACTIVA' ? (cat.horario && cat.horario.tipo === 'temporada' ? 'text-slate-600' : 'text-emerald-500') : 'text-red-500'}`}>
                        {cat.estado === 'ACTIVA' ? (cat.horario && cat.horario.tipo === 'temporada' ? formatHorario(cat.horario).split(' - ')[0] : 'Activo') : 'Inactivo'}
                      </span>
                    </div>
                  </td>
                  <td className="px-4 py-3 text-center">
                    <div className="flex flex-col items-center gap-1 group">
                      <div onClick={() => handleToggleScheduleActive(cat)} className={`relative w-8 h-4 flex items-center rounded-full px-0.5 cursor-pointer transition-colors ${cat.horario ? 'bg-indigo-500' : 'bg-gray-300'}`}>
                        <div className="w-3 h-3 bg-white rounded-full shadow-md transition-transform" style={{ transform: cat.horario ? 'translateX(16px)' : 'translateX(0)' }}></div>
                      </div>
                      <div className="flex items-center gap-1 cursor-pointer" onClick={() => toggleScheduleRow(cat.id, cat.horario)}>
                         {cat.horario && <span style={{fontSize:'12px', lineHeight:1}}>⏰</span>}
                         <span className={`text-[9px] font-bold hover:underline decoration-dashed ${cat.horario ? 'text-indigo-600' : 'text-gray-400'}`}>{formatHorario(cat.horario)}</span>
                      </div>
                    </div>
                  </td>
                  <td className="px-4 py-3">
                    <div className="flex items-center justify-center gap-1.5">
                      <button onClick={() => { if(cat.estado!=='ACTIVA')handleToggleEstado(cat); setFocusCatName(cat.nombre); setTimeout(()=>platosRef?.current?.scrollIntoView({behavior:'smooth'}),150);}} 
                              className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-100 flex items-center justify-center transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                      </button>
                      <button onClick={() => handleOpenModal(cat)} className="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 flex items-center justify-center transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      </button>
                      <button onClick={() => handleDelete(cat)} className="w-8 h-8 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
                {expandedSchedule === cat.id && (
                  <tr className="bg-indigo-50/50 border-b border-indigo-100 shadow-inner">
                    <td colSpan={9} className="px-6 py-4">
                      <div className="flex flex-wrap items-end gap-5">
                        <div>
                           <label className="text-[10px] font-black text-indigo-800 uppercase tracking-widest block mb-1">Tipo</label>
                           <select value={inlineHorario[cat.id]?.tipo || 'semanal'} onChange={e => setInlineHorario(p => ({ ...p, [cat.id]: { ...p[cat.id], tipo: e.target.value } }))} className="border border-indigo-200 rounded-lg p-1.5 text-xs font-bold outline-none bg-white text-slate-800 focus:border-indigo-500">
                             <option value="semanal">Semanal</option>
                             <option value="temporada">Temporada Especial</option>
                             <option value="24/7">Siempre 24/7</option>
                           </select>
                        </div>
                        {inlineHorario[cat.id]?.tipo !== '24/7' && (
                           <>
                              <div><label className="text-[10px] font-black text-indigo-800 uppercase tracking-widest block mb-1">Inicio</label><input type="time" value={inlineHorario[cat.id]?.inicio || '07:00'} onChange={e => setInlineHorario(p => ({ ...p, [cat.id]: { ...p[cat.id], inicio: e.target.value } }))} className="border border-indigo-200 rounded-lg p-1 text-xs font-bold font-mono outline-none"/></div>
                              <div><label className="text-[10px] font-black text-indigo-800 uppercase tracking-widest block mb-1">Fin</label><input type="time" value={inlineHorario[cat.id]?.fin || '22:00'} onChange={e => setInlineHorario(p => ({ ...p, [cat.id]: { ...p[cat.id], fin: e.target.value } }))} className="border border-indigo-200 rounded-lg p-1 text-xs font-bold font-mono outline-none"/></div>
                           </>
                        )}
                        {inlineHorario[cat.id]?.tipo === 'temporada' && (
                           <>
                              <div><label className="text-[10px] font-black text-indigo-800 uppercase tracking-widest block mb-1">Desde</label><input type="date" value={inlineHorario[cat.id]?.fecha_desde || ''} onChange={e => setInlineHorario(p => ({ ...p, [cat.id]: { ...p[cat.id], fecha_desde: e.target.value } }))} className="border border-indigo-200 bg-white rounded-lg p-1 text-xs font-bold outline-none"/></div>
                              <div><label className="text-[10px] font-black text-indigo-800 uppercase tracking-widest block mb-1">Hasta</label><input type="date" value={inlineHorario[cat.id]?.fecha_hasta || ''} onChange={e => setInlineHorario(p => ({ ...p, [cat.id]: { ...p[cat.id], fecha_hasta: e.target.value } }))} className="border border-indigo-200 bg-white rounded-lg p-1 text-xs font-bold outline-none"/></div>
                           </>
                        )}
                        {(inlineHorario[cat.id]?.tipo === 'semanal' || inlineHorario[cat.id]?.tipo === 'temporada') && (
                           <div>
                             <label className="text-[10px] font-black text-indigo-800 uppercase tracking-widest block mb-1">Días Habilitados</label>
                             <div className="flex gap-1.5">
                                {DIAS_SEMANA.map(dia => {
                                   const isSelected = (inlineHorario[cat.id]?.dias || []).includes(dia.id);
                                   return (
                                     <button type="button" key={dia.id} onClick={() => handleInlineDayToggle(cat.id, dia.id)} className={`w-8 h-8 rounded-lg text-xs font-black transition-all shadow-sm ${isSelected ? 'bg-indigo-600 text-white shadow-indigo-200' : 'bg-white text-gray-400 border border-indigo-200 hover:border-indigo-400'}`}>
                                       {dia.lbl}
                                     </button>
                                   )
                                })}
                             </div>
                           </div>
                        )}
                        <button onClick={() => handleSaveInlineSchedule(cat)} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-md shadow-indigo-200 ml-auto transition-transform active:scale-95">Guardar Horario</button>
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            )})}
          </tbody>
        </table>
      </div>

      {showModal && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
          <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-in slide-in-from-bottom-8 max-h-[90vh] flex flex-col">
            <div className="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
              <h3 className="font-black text-slate-800 text-lg flex items-center gap-2">{editingCategory ? '✍ Editar Categoría' : '✨ Nueva Categoría'}</h3>
              <button type="button" onClick={() => setShowModal(false)} className="text-gray-400 hover:text-slate-800 bg-white p-1.5 rounded-xl border border-gray-200 transition-colors shadow-sm">✔¢</button>
            </div>
            
            <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
              {formError && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs font-bold mb-5 flex items-center gap-2"><span>⚠️</span> {formError}</div>}
              
              <div className="space-y-6">
                <div>
                  <label className="text-xs font-bold text-slate-700 mb-2 block uppercase tracking-widest">Icono y Etiqueta Visual</label>
                  <div className="p-4 rounded-xl border border-gray-200 bg-gray-50 flex flex-col gap-4">
                    <div className="flex flex-wrap gap-2.5">
                      {COLORES.map(color => (
                        <button key={color} type="button" onClick={() => setFormData({...formData, color})} className={`w-8 h-8 rounded-full shadow-sm transition-all ${formData.color === color ? 'ring-2 ring-offset-2 ring-slate-800 scale-110' : 'hover:scale-110'}`} style={{backgroundColor: color}}></button>
                      ))}
                    </div>
                    <div className="grid grid-cols-6 gap-2">
                      {ICONOS.map(icon => (
                        <button key={icon} type="button" onClick={() => setFormData({...formData, icono: icon})} className={`w-full aspect-square rounded-xl text-xl flex items-center justify-center transition-all ${formData.icono === icon ? 'bg-slate-800 text-white shadow-md scale-105' : 'bg-white border border-gray-200 text-gray-500 hover:border-gray-400'}`}>{icon}</button>
                      ))}
                    </div>
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold text-slate-700 mb-1.5 block">Nombre de la Categoría <span className="text-red-500">*</span></label>
                  <input type="text" value={formData.nombre} onChange={(e) => setFormData({...formData, nombre: e.target.value})} maxLength={40} placeholder="Ej: Entradas, Pizzas..." className="w-full text-base font-bold p-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all shadow-sm" required autoFocus />
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 mb-1.5 block">Destino de Impresión <span className="font-normal text-gray-400">(Bar/Cocina)</span></label>
                    <select value={formData.destino_impresion} onChange={(e) => setFormData({...formData, destino_impresion: e.target.value})} className="w-full text-sm font-bold text-slate-700 p-3 rounded-xl border border-gray-300 focus:border-indigo-500 outline-none appearance-none shadow-sm cursor-pointer">
                      {DESTINOS.map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 mb-1.5 block">Impuesto de Categoría</label>

  );
}

    { id: 8, categoria_id: 'cat-2', categoria_nombre: 'Pizzas al Horno', nombre: 'Pizza Funghi e Tartufo', descripcion: 'Champiñones y aceite de trufa', precio_venta: 38000, costo_produccion: 13300, canal: 'AMBOS', estado: 'TEMPORAL', prioridad_pos: 5, foto_url: null, fecha_temporal_desde: '2026-12-01', fecha_temporal_hasta: '2027-01-31' },
    { id: 9, categoria_id: 'cat-3', categoria_nombre: 'Antipasti', nombre: 'Bruschettas al Pomodoro', descripcion: 'Pan artesanal y tomate fresco', precio_venta: 18000, costo_produccion: 6300, canal: 'SALON', estado: 'DISPONIBLE', prioridad_pos: 1, foto_url: null, fecha_temporal_desde: null, fecha_temporal_hasta: null },
    { id: 10, categoria_id: 'cat-3', categoria_nombre: 'Antipasti', nombre: 'Burrata di Puglia', descripcion: 'Sobre cama de rúcula y pesto', precio_venta: 32000, costo_produccion: 11200, canal: 'AMBOS', estado: 'DISPONIBLE', prioridad_pos: 2, foto_url: null, fecha_temporal_desde: null, fecha_temporal_hasta: null },
    { id: 11, categoria_id: 'cat-4', categoria_nombre: 'Postres Italianos', nombre: 'Tiramisú della Casa', descripcion: 'Con mascarpone y café expreso', precio_venta: 16000, costo_produccion: 5600, canal: 'AMBOS', estado: 'DISPONIBLE', prioridad_pos: 1, foto_url: null, fecha_temporal_desde: null, fecha_temporal_hasta: null },
    { id: 12, categoria_id: 'cat-3', categoria_nombre: 'Bebidas y Vinos', nombre: 'Copa de Chianti Classico', descripcion: 'Vino tinto reserva italiana', precio_venta: 22000, costo_produccion: 7700, canal: 'SALON', estado: 'DISPONIBLE', prioridad_pos: 1, foto_url: null, fecha_temporal_desde: null, fecha_temporal_hasta: null }
  ];

  // Inicializar platos enriquecidos si necesario
  React.useEffect(() => {
    if (platos && platos.length > 0 && platos[0].prioridad_pos === undefined) {
      const enriched = platos.map((p, idx) => {
        const mock = PLATOS_ENRIQUECIDOS.find(m => m.nombre === p.nombre) || {};
        return {
          ...p,
          costo_produccion: p.costo_produccion || mock.costo_produccion || Math.round(p.precio_venta * 0.35),
          canal: p.canal || mock.canal || 'AMBOS',
          estado: p.estado === 'activo' ? 'DISPONIBLE' : (p.estado || 'DISPONIBLE'),
          prioridad_pos: p.prioridad_pos || mock.prioridad_pos || (idx + 1),
          foto_url: p.foto_url || null,
          fecha_temporal_desde: p.fecha_temporal_desde || null,
          fecha_temporal_hasta: p.fecha_temporal_hasta || null,
        };
      });
      setPlatos(enriched);
    }
  }, []);

  // ------- FORMULARIO -------
  const defaultForm = { nombre: '', descripcion: '', precio_venta: '', costo_produccion: '', categoria_id: '', canal: 'AMBOS', estado: 'DISPONIBLE', iva_pct: '8', prioridad_pos: '', fecha_temporal_desde: '', fecha_temporal_hasta: '' };
  const [formData, setFormData] = React.useState({ ...defaultForm });

  // ------- HELPERS -------
  const calcMargen = (precio, costo) => {
    const p = Number(precio), c = Number(costo);
    if (!p || isNaN(p) || isNaN(c) || costo === '' || costo === null || costo === undefined) return null;
    return Number(((p - c) / p * 100).toFixed(0));
  };

  const getMargenColor = (pct) => {
    if (pct === null) return { arc: '#E5E7EB', text: '#9CA3AF' };
    if (pct >= 60) return { arc: '#16A34A', text: '#15803D' };
    if (pct >= 40) return { arc: '#D97706', text: '#B45309' };
    return { arc: '#DC2626', text: '#B91C1C' };
  };

  const getMargenLabel = (pct) => {
    if (pct === null) return '';
    if (pct >= 60) return '(Alto)';
    if (pct >= 40) return '(Medio)';
    return '(Bajo)';
  };

  const formatPrecio = (val) => {
    const n = parseInt(val);
    if (isNaN(n)) return '$0';
    return '$' + n.toLocaleString('es-CO');
  };

  const formatDateRange = (desde, hasta) => {
    if (!desde && !hasta) return null;
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const fmtMes = (d) => { try { const dt = new Date(d + 'T12:00:00'); return meses[dt.getMonth()]; } catch(e) { return ''; } };
    if (desde && hasta) return `${fmtMes(desde)}/${fmtMes(hasta)}`;
    if (desde) return `Desde ${fmtMes(desde)}`;
    return `Hasta ${fmtMes(hasta)}`;
  };

  // ------- GAUGE SVG -------
  const GaugeSVG = ({ pct }) => {
    if (pct === null) return <div className="flex flex-col items-center justify-center" style={{width:52,height:36}}><span className="text-lg text-gray-300">–</span></div>;
    const { arc, text } = getMargenColor(pct);
    const label = getMargenLabel(pct);
    // Semicircle arc: cx=26, cy=28, r=20
    // Full arc = 180deg from 180 to 0 (left to right across bottom)
    const r = 20, cx = 26, cy = 28;
    const toRad = (deg) => deg * Math.PI / 180;
    const pctClamped = Math.max(0, Math.min(100, pct));
    const startDeg = 180;
    const endDeg = 180 - (pctClamped / 100) * 180;
    const x1 = cx + r * Math.cos(toRad(startDeg));
    const y1 = cy + r * Math.sin(toRad(startDeg));
    const x2 = cx + r * Math.cos(toRad(endDeg));
    const y2 = cy + r * Math.sin(toRad(endDeg));
    const largeArc = pctClamped > 50 ? 1 : 0;
    return (
      <div className="flex flex-col items-center" style={{width:52}}>
        <svg width="52" height="30" viewBox="0 0 52 30" style={{overflow:'visible'}}>
          {/* Background arc */}
          <path d={`M6 28 A20 20 0 0 1 46 28`} fill="none" stroke="#E5E7EB" strokeWidth="5" strokeLinecap="round"/>
          {/* Value arc */}
          {pctClamped > 0 && (
            <path d={`M${x1} ${y1} A${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`} fill="none" stroke={arc} strokeWidth="5" strokeLinecap="round"/>
          )}
        </svg>
        <div style={{marginTop:1,textAlign:'center',lineHeight:1}}>
          <span style={{fontSize:'11px',fontWeight:900,color:text}}>{pct}%</span>
          <span style={{fontSize:'9px',color:text,fontWeight:700,marginLeft:2}}>{label}</span>
        </div>
      </div>
    );
  };

  // ------- CHANNEL ICONS -------
  const CanalesIcons = ({ canal }) => {
    const salonActive  = canal === 'AMBOS' || canal === 'SALON';
    const mottoActive  = canal === 'AMBOS' || canal === 'DELIVERY';
    const appActive    = canal === 'AMBOS' || canal === 'DELIVERY';
    return (
      <div className="flex items-center gap-1">
        <div title="Salón/POS" style={{width:28,height:28,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background: salonActive ? '#D1FAE5' : '#F3F4F6',color: salonActive ? '#047857' : '#D1D5DB',fontSize:14,border:'1px solid',borderColor: salonActive ? '#A7F3D0' : '#E5E7EB',transition:'all 0.2s'}}>🥗</div>
        <div title="Delivery Propio" style={{width:28,height:28,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background: mottoActive ? '#F3F4F6' : '#F9FAFB',color: mottoActive ? '#374151' : '#D1D5DB',fontSize:14,border:'1px solid',borderColor: mottoActive ? '#D1D5DB' : '#E5E7EB',transition:'all 0.2s'}}>🐟</div>
        <div title="Rappi / App Delivery" style={{width:28,height:28,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background: appActive ? '#FEF3C7' : '#F9FAFB',color: appActive ? '#B45309' : '#D1D5DB',fontSize:14,border:'1px solid',borderColor: appActive ? '#FDE68A' : '#E5E7EB',transition:'all 0.2s'}}>🐟</div>
      </div>
    );
  };

  // ------- CRUD LOGIC -------
  const handleOpenForm = (plato = null) => {
    setFormError('');
    if (plato) {
      setEditingPlato(plato);
      setFormData({ ...defaultForm, ...plato, costo_produccion: plato.costo_produccion ?? '', fecha_temporal_desde: plato.fecha_temporal_desde || '', fecha_temporal_hasta: plato.fecha_temporal_hasta || '' });
    } else {
      setEditingPlato(null);
      const catActiva = (categorias || []).find(c => c.estado === 'ACTIVA');
      const maxPrio = Math.max(0, ...(platos || []).map(p => p.prioridad_pos || 0));
      setFormData({ ...defaultForm, categoria_id: catActiva ? catActiva.id : '', prioridad_pos: maxPrio + 1 });
    }
    setShowFormModal(true);
  };

  const handleSavePlato = (e) => {
    e.preventDefault();
    setFormError('');
    const catPadre = (categorias || []).find(c => String(c.id) === String(formData.categoria_id));
    if (!catPadre) return setFormError('Debes seleccionar una categoría.');
    const nombreLimpio = (formData.nombre || '').trim();
    if (!nombreLimpio) return setFormError('El nombre del plato es obligatorio.');
    const precio = Number(formData.precio_venta);
    if (!Number.isInteger(precio) || precio <= 0) return setFormError('El precio de venta debe ser un número entero positivo.');
    const isDuplicate = (platos || []).some(p => String(p.categoria_id) === String(formData.categoria_id) && p.nombre.toLowerCase() === nombreLimpio.toLowerCase() && p.id !== editingPlato?.id);
    if (isDuplicate) return setFormError(`Ya existe un plato llamado "${nombreLimpio}" en esta categoría.`);
    const costo = formData.costo_produccion !== '' ? Number(formData.costo_produccion) : null;
    const margen = calcMargen(precio, costo);
    const nuevoPlato = {
      ...formData,
      id: editingPlato ? editingPlato.id : `plato-${Date.now()}`,
      nombre: nombreLimpio,
      categoria_nombre: catPadre.nombre,
      precio_venta: precio,
      costo_produccion: costo,
      margen_bruto: margen,
      iva_pct: Number(formData.iva_pct),
      prioridad_pos: Number(formData.prioridad_pos) || 1,
      fecha_temporal_desde: formData.fecha_temporal_desde || null,
      fecha_temporal_hasta: formData.fecha_temporal_hasta || null,
    };
    if (editingPlato) {
      setPlatos((platos || []).map(p => p.id === editingPlato.id ? nuevoPlato : p));
    } else {
      setPlatos([...(platos || []), nuevoPlato]);
    }
    setShowFormModal(false);
  };

  const handleDeletePlato = (plato) => {
    if (window.confirm(`¿Eliminar "${plato.nombre}"? Esta acción no se puede deshacer.`)) {
      setPlatos((platos || []).filter(p => p.id !== plato.id));
    }
  };

  const handleDuplicatePlato = (plato) => {
    const catPlatos = (platos || []).filter(p => String(p.categoria_id) === String(plato.categoria_id));
    const maxPrio = Math.max(0, ...catPlatos.map(p => p.prioridad_pos || 0));
    const copia = { ...plato, id: Date.now(), nombre: `Copia de ${plato.nombre}`, prioridad_pos: maxPrio + 1, estado: 'DISPONIBLE' };
    setPlatos([...(platos || []), copia]);
  };

  const handleEstadoChange = (plato, nuevoEstado) => {
    setPlatos((platos || []).map(p => p.id === plato.id ? { ...p, estado: nuevoEstado } : p));
    if (nuevoEstado === 'TEMPORAL') {
      setShowTemporalFor(plato.id);
      setTempDesde(plato.fecha_temporal_desde || '');
      setTempHasta(plato.fecha_temporal_hasta || '');
    } else {
      if (showTemporalFor === plato.id) setShowTemporalFor(null);
    }
  };

  const handleSaveTemporalDates = (platoId) => {
    setPlatos((platos || []).map(p => p.id === platoId ? { ...p, fecha_temporal_desde: tempDesde || null, fecha_temporal_hasta: tempHasta || null } : p));
    setShowTemporalFor(null);
  };

  const handlePrioridadChange = (platoId, catId, newVal) => {
    const updated = (platos || []).map(p => p.id === platoId ? { ...p, prioridad_pos: Number(newVal) || 1 } : p);
    // Reorder within category
    const sorted = updated.map(p => {
      if (String(p.categoria_id) === String(catId)) return p;
      return p;
    });
    setPlatos(sorted);
  };

  // ------- FILTER -------
  const categoriasConPlatos = (categorias || []).filter(c => activeCatNames.includes(c.nombre));

  return (
    <div ref={platosRef} className="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden flex flex-col" style={{borderLeft:'4px solid #10B981'}}>
      <div className="bg-gray-50/30 flex-1 relative min-h-[200px]">

// --- WIDGET: MODIFICADORES Y VARIANTES (PASO 3) ---
function MenuModificadoresBlock({ viewMode, showGroupModal, setShowGroupModal, restauranteId, platos, grupos, setGrupos, opciones, setOpciones, vinculos, setVinculos }) {
  // 1. Estados elevados a App. Props pasados desde ViewMenu: grupos, opciones, vinculos.
  // const [opciones, setOpciones] = React.useState([...]);
  const [loading, setLoading] = React.useState(false);

  // Carga inicial de datos
  React.useEffect(() => {
    // Carga inicial deshabilitada (offline/static)
  }, []);

  
  const fetchModificadores = async () => {
    // Sin servidor – los grupos ya están en el estado inicial de este componente
    setLoading(false);
  };

  // const [vinculos, setVinculos] = React.useState([...]);

  // 2. Estado UI
  // viewMode elevated to parent // 'biblioteca' | 'por_plato'
  const [selectedPlatoId, setSelectedPlatoId] = React.useState(platos.length > 0 ? platos[0].id : null);
  
  // showGroupModal elevated to parent
  const [editingGroup, setEditingGroup] = React.useState(null);
  
  const [showOptionModal, setShowOptionModal] = React.useState(false);
  const [activeGroupIdForOption, setActiveGroupIdForOption] = React.useState(null);
  const [editingOption, setEditingOption] = React.useState(null);
  
  const [formError, setFormError] = React.useState('');

  // 3. Formularios
  const defaultGroupForm = { nombre: '', tipo_seleccion: 'UNICA', min_selecciones: 1, max_selecciones: 1, estado: 'ACTIVO' };
  const [groupForm, setGroupForm] = React.useState({ ...defaultGroupForm });

  const defaultOptionForm = { nombre: '', precio_adicional: '', estado: 'DISPONIBLE' };
  const [optionForm, setOptionForm] = React.useState({ ...defaultOptionForm });



  // --- LÓGICA DE GRUPOS ---
  const handleOpenGroupForm = (grupo = null) => {
    setFormError('');
    if (grupo) {
      setEditingGroup(grupo);
      setGroupForm({ ...grupo });
    } else {
      setEditingGroup(null);
      setGroupForm({ ...defaultGroupForm });
    }
    setShowGroupModal(true);
  };

  const handleGroupTypeChange = (tipo) => {
    let min = groupForm.min_selecciones;
    let max = groupForm.max_selecciones;

    // Regla 4: Tipo UNICA fuerza min 1 max 1
    if (tipo === 'UNICA') { min = 1; max = 1; }
    else if (tipo === 'OPCIONAL_UNICA') { min = 0; max = 1; }
    else if (tipo === 'MULTIPLE') { min = Math.max(1, min); max = max || 2; }
    else if (tipo === 'OPCIONAL_MULTIPLE') { min = 0; }
    
    setGroupForm({ ...groupForm, tipo_seleccion: tipo, min_selecciones: min, max_selecciones: max });
  };

  const handleSaveGroup = (e) => {
    e.preventDefault();
    setFormError('');

    const nombreLimpio = groupForm.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre del grupo es obligatorio.');
    
    // Regla 2: Único en restaurante
    const isDuplicate = grupos.some(g => g.nombre.toLowerCase() === nombreLimpio.toLowerCase() && g.id !== editingGroup?.id);
    if (isDuplicate) return setFormError('Error 409: Ya existe un grupo con este nombre.');

    const nuevoGrupo = { ...groupForm, id: editingGroup ? editingGroup.id : `g-${Date.now()}`, nombre: nombreLimpio };

    if (editingGroup) {
      setGrupos(grupos.map(g => g.id === editingGroup.id ? nuevoGrupo : g));
      console.log(`[Evento] Grupo actualizado: ${nuevoGrupo.id}`);
    } else {
      setGrupos([...grupos, nuevoGrupo]);
      console.log(`[Evento] Grupo creado: ${nuevoGrupo.id}`);
    }
    setShowGroupModal(false);
  };

  const handleToggleGroupState = (grupo) => {
    const nuevoEstado = grupo.estado === 'ACTIVO' ? 'INACTIVO' : 'ACTIVO';
    // Automatización 3: Advertencia si es obligatorio
    if (nuevoEstado === 'INACTIVO' && (grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE')) {
      const isLinked = vinculos.some(v => v.grupo_id === grupo.id);
      if (isLinked) {
        if (!window.confirm(`⚠️ Este grupo es obligatorio en uno o más platos. Desactivarlo puede impedir tomar órdenes correctamente.
¿Deseas continuar?`)) return;
      }
    }
    setGrupos(grupos.map(g => g.id === grupo.id ? { ...g, estado: nuevoEstado } : g));
  };

  // --- LÓGICA DE OPCIONES ---
  const handleOpenOptionForm = (grupoId, opcion = null) => {
    setFormError('');
    setActiveGroupIdForOption(grupoId);
    if (opcion) {
      setEditingOption(opcion);
      setOptionForm({ ...opcion });
    } else {
      setEditingOption(null);
      setOptionForm({ ...defaultOptionForm });
    }
    setShowOptionModal(true);
  };

  const handleSaveOption = (e) => {
    e.preventDefault();
    setFormError('');

    const nombreLimpio = optionForm.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre de la opción es obligatorio.');
    
    // Regla 3: Precio >= 0
    const precio = Number(optionForm.precio_adicional);
    if (!Number.isInteger(precio) || precio < 0) return setFormError('El precio debe ser un número entero mayor o igual a cero (no se permiten descuentos).');

    // Validación duplicado en el mismo grupo
    const isDuplicate = opciones.some(o => o.grupo_id === activeGroupIdForOption && o.nombre.toLowerCase() === nombreLimpio.toLowerCase() && o.id !== editingOption?.id);
    if (isDuplicate) return setFormError('Error 409: Ya existe una opción con este nombre en el grupo.');

    const nuevaOpcion = {
      ...optionForm,
      id: editingOption ? editingOption.id : `o-${Date.now()}`,
      grupo_id: activeGroupIdForOption,
      nombre: nombreLimpio,
      precio_adicional: precio,
      orden: editingOption ? editingOption.orden : (opciones.filter(o=>o.grupo_id===activeGroupIdForOption).length + 1)
    };

    if (editingOption) {
      setOpciones(opciones.map(o => o.id === editingOption.id ? nuevaOpcion : o));
      // Automatización 4: Conservar precio en ordenes abiertas
      if (editingOption.precio_adicional !== nuevaOpcion.precio_adicional) {
        console.log('⚠️ [Regla 6 Aplicada] Precio de opción editado. Las órdenes ABIERTAS conservan el precio original.');
      }
    } else {
      setOpciones([...opciones, nuevaOpcion]);
    }
    setShowOptionModal(false);
  };

  const handleToggleOptionState = (opcion, nuevoEstado) => {
    setOpciones(opciones.map(o => o.id === opcion.id ? { ...o, estado: nuevoEstado } : o));
    // Automatización 2: WebSocket
    if (nuevoEstado === 'AGOTADO') console.log(`[Evento WebSocket] opcion.agotada: ${opcion.nombre}. Operaciones la bloquea inmediatamente.`);
  };

  // --- LÓGICA DE VINCULACIÓN ---
  const toggleVinculo = (platoId, grupoId) => {
    const isLinked = vinculos.some(v => v.plato_id === platoId && v.grupo_id === grupoId);
    if (isLinked) {
      // Automatización 5: Desvincular obligatorio
      const grupo = grupos.find(g => g.id === grupoId);
      if (grupo && (grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE')) {
        console.log(`⚠️ [Alerta Generada] Desvinculaste el grupo obligatorio "${grupo.nombre}" del plato.`);
      }
      setVinculos(vinculos.filter(v => !(v.plato_id === platoId && v.grupo_id === grupoId)));
      console.log(`[Evento] Modificador desvinculado de plato.`);
    } else {
      // Automatización 1
      const nuevoOrden = vinculos.filter(v => v.plato_id === platoId).length + 1;
      setVinculos([...vinculos, { plato_id: platoId, grupo_id: grupoId, orden_en_plato: nuevoOrden }]);
      console.log(`[Evento] modificador.vinculado: Operaciones actualiza UI del plato sin recargar.`);
    }
  };

  return (
    <div className="bg-white rounded-3xl border border-gray-200 p-0 shadow-sm overflow-hidden flex flex-col border-l-4 border-l-orange-500">
      <div className="bg-gray-50/50 flex-1 relative min-h-[400px]">
        {loading && (
          <div className="absolute inset-0 flex items-center justify-center bg-white/50 z-20">
            <span style={{fontSize:'15px', lineHeight:1}}>🐟</span>
          </div>
        )}
        
        {/* VISTA 1: BIBLIOTECA DE GRUPOS */}
        {viewMode === 'biblioteca' && (
          <div className="p-6">
            <div className="flex justify-between items-center mb-6">
               <h4 className="text-sm font-bold text-slate-800">Grupos Reutilizables creados ({grupos.length})</h4>
               <button onClick={() => handleOpenGroupForm()} className="btn bg-slate-900 text-white hover:bg-slate-800 py-2 px-4 text-xs shadow-md">+ Nuevo Grupo</button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
               {grupos.map(grupo => {
                 const opsGrupo = opciones.filter(o => o.grupo_id === grupo.id).sort((a,b)=>a.orden-b.orden);
                 const vincsCount = vinculos.filter(v => v.grupo_id === grupo.id).length;
                 const isUnica = grupo.tipo_seleccion.includes('UNICA');
                 const isRequired = grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE';
                 
                 return (
                   <div key={grupo.id} className={`bg-white border rounded-2xl shadow-sm overflow-hidden flex flex-col transition-all ${grupo.estado === 'INACTIVO' ? 'border-gray-200 opacity-60 bg-gray-50' : 'border-gray-200 hover:border-orange-200'}`}>
                      <div className="p-4 border-b border-gray-100 flex justify-between items-start">
                         <div>
                            <div className="flex items-center gap-2 mb-1.5">
                               <h5 className={`font-bold text-base ${grupo.estado === 'INACTIVO' ? 'text-gray-500 line-through' : 'text-slate-800'}`}>{grupo.nombre}</h5>
                               <span className={`text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded ${isUnica ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
                                 {grupo.tipo_seleccion.replace('_', ' ')}
                               </span>
                            </div>
                            <p className="text-[10px] font-medium text-gray-500 flex items-center gap-2">
                               {isRequired ? <span className="text-red-500 font-bold border border-red-200 bg-red-50 px-1 rounded">OBLIGATORIO</span> : <span className="text-gray-400 border border-gray-200 px-1 rounded">OPCIONAL</span>}
                               <span>Min: {grupo.min_selecciones} | Max: {grupo.max_selecciones || '∞'}</span>
                               <span>• En {vincsCount} platos</span>
                            </p>
                         </div>
                         <div className="flex flex-col items-end gap-2">
                            <div onClick={() => handleToggleGroupState(grupo)} className={`relative w-10 h-5 flex items-center rounded-full p-1 cursor-pointer transition-colors ${grupo.estado === 'ACTIVO' ? 'bg-emerald-500' : 'bg-gray-300'}`}>
                               <div className={`w-3.5 h-3.5 bg-white rounded-full shadow-md transform transition-transform ${grupo.estado === 'ACTIVO' ? 'translate-x-4.5' : 'translate-x-0'}`} style={{ transform: grupo.estado === 'ACTIVO' ? 'translateX(18px)' : 'translateX(0)' }}></div>
                            </div>
                            <button onClick={() => handleOpenGroupForm(grupo)} className="text-[10px] font-bold text-indigo-600 hover:underline">Editar Grupo</button>
                         </div>
                      </div>

                      <div className="p-4 bg-gray-50 flex-1">
                         <div className="flex justify-between items-center mb-3">
                            <span className="text-xs font-bold text-gray-500 uppercase tracking-widest">Opciones ({opsGrupo.length})</span>
                            <button onClick={() => handleOpenOptionForm(grupo.id)} className="text-[10px] font-bold text-orange-600 bg-orange-100 hover:bg-orange-200 px-2 py-1 rounded transition-colors">+ Añadir</button>
                         </div>
                         <div className="space-y-2">
                            {opsGrupo.length === 0 ? <p className="text-xs text-gray-400 text-center py-2 border border-dashed border-gray-300 rounded-lg">No hay opciones creadas.</p> : null}
                            {opsGrupo.map(op => (
                               <div key={op.id} className={`flex items-center justify-between p-2 rounded-lg border bg-white ${op.estado === 'AGOTADO' ? 'border-red-100 bg-red-50/30' : 'border-gray-100'}`}>

                                     {isUnica ? <div className="w-3 h-3 rounded-full border-2 border-gray-300"></div> : <div className="w-3 h-3 rounded border border-gray-300"></div>}

                                     {op.estado === 'AGOTADO' && <span className="text-[8px] font-black bg-red-600 text-white px-1 rounded uppercase">Agotado</span>}
                                  </div>

        {/* VISTA 2: ASIGNACIÓN POR PLATO */}
        {viewMode === 'por_plato' && (
          <div className="flex h-[500px]">
             {/* Left Col: Platos List */}

             {/* Right Col: Vinculación */}

                     <p className="font-bold text-sm text-slate-500">Selecciona un plato de la lista izquierda</p>

      </div>

      {/* MODAL: GRUPO DE MODIFICADORES */}
      {showGroupModal && (

                      </label>
                      <input type="text" value={groupForm.nombre} onChange={(e) => setGroupForm({...groupForm, nombre: e.target.value})} maxLength={60} className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-orange-500 outline-none transition-all" required autoFocus />

                   <div>
                      <label className="text-xs font-bold text-slate-700 mb-1.5 block">Tipo de Selección <span className="text-red-500">*</span></label>
                      <select value={groupForm.tipo_seleccion} onChange={(e) => handleGroupTypeChange(e.target.value)} className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-orange-500 outline-none bg-white font-bold cursor-pointer">
                         <option value="UNICA">Única (Obligatorio elegir 1)</option>
                         <option value="MULTIPLE">Múltiple (Obligatorio elegir mínimo 1)</option>
                         <option value="OPCIONAL_UNICA">Opcional Única (Puede elegir 1 o ninguna)</option>

                      <p className="text-[10px] text-gray-500 mt-1.5 bg-gray-50 p-2 rounded border border-gray-100 leading-relaxed">
                        {groupForm.tipo_seleccion === 'UNICA' && "Operaciones no dejará cobrar la orden sin elegir una opción. Ideal para término de cocción."}
                        {groupForm.tipo_seleccion === 'MULTIPLE' && "Obliga al cliente a elegir varias opciones (ej: Elige 2 acompañamientos)."}
                        {groupForm.tipo_seleccion === 'OPCIONAL_UNICA' && "Puede elegir una opción, pero no es obligatorio para cobrar."}

                      </p>

                   <div className="grid grid-cols-2 gap-4 pt-2">
                     <div>
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Selección Mínima</label>
                        <input type="number" min="0" value={groupForm.min_selecciones} onChange={(e) => setGroupForm({...groupForm, min_selecciones: Number(e.target.value)})} disabled={groupForm.tipo_seleccion.includes('UNICA') || groupForm.tipo_seleccion.includes('OPCIONAL')} className="w-full text-sm p-3 rounded-xl border border-gray-300 outline-none disabled:bg-gray-100 disabled:text-gray-400 text-center font-bold" />
                     </div>

                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Selección Máxima</label>
                        <input type="number" min={groupForm.min_selecciones} value={groupForm.max_selecciones || ''} onChange={(e) => setGroupForm({...groupForm, max_selecciones: e.target.value ? Number(e.target.value) : null})} disabled={groupForm.tipo_seleccion.includes('UNICA')} placeholder="Ilimitado" className="w-full text-sm p-3 rounded-xl border border-gray-300 outline-none disabled:bg-gray-100 disabled:text-gray-400 text-center font-bold" />

                <div className="mt-8 flex gap-3">

                </div>
             </form>
          </div>
        </div>
      )}

      {/* MODAL: OPCIÓN INDIVIDUAL */}
      {showOptionModal && (
        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">

             <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">

             <form onSubmit={handleSaveOption} className="p-6 space-y-5">

                  <div className="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-xs font-bold mb-4">{formError}</div>
                )}
                <div>
                   <label className="text-xs font-bold text-slate-700 mb-1.5 block">Nombre de la opción <span className="text-red-500">*</span></label>
                   <input type="text" value={optionForm.nombre} onChange={(e) => setOptionForm({...optionForm, nombre: e.target.value})} maxLength={60} placeholder="Ej: Queso Extra" className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-orange-500 outline-none" required autoFocus />
                </div>
                <div>
                   <label className="text-xs font-bold text-slate-700 mb-1.5 flex justify-between items-center">
                                     <span>Precio Adicional (COP) <span className="text-red-500">*</span></span>
                                     <span className="text-[9px] bg-slate-100 px-1 rounded text-slate-500 font-black">≥ $0</span>
                                   </label>

                                      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
                                      <input type="number" min="0" step="1" pattern="\d+" value={optionForm.precio_adicional} onChange={(e) => setOptionForm({...optionForm, precio_adicional: e.target.value})} placeholder="0" className="w-full text-sm p-3 pl-8 rounded-xl border border-gray-300 focus:border-orange-500 outline-none font-black text-emerald-700" required />
                                   </div>
                                   <p className="text-[10px] text-gray-500 mt-1">Si no tiene costo extra, coloca 0.</p>
                                </div>

                                <div className="mt-8 flex gap-3">
