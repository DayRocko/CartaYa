          </div>
        </div>
      )}

      {/* MODAL IMPORTAR CSV */}
      {showImportModal && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-xl shadow-2xl overflow-hidden text-white relative">
            <div className="px-6 py-5 border-b border-slate-800 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-slate-800 text-emerald-400 flex items-center justify-center border border-slate-700">🗄</div>
                <h3 className="font-black text-lg">Importación Masiva (CSV)</h3>
              </div>
              <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg border border-slate-700 transition-colors">✕</button>
            </div>
            <div className="p-6 space-y-5">
              <div className="bg-slate-800/50 border border-slate-700 p-4 rounded-xl space-y-3">
                <h4 className="text-sm font-bold text-slate-300 flex items-center gap-2">→ Paso 1: Prepara tus datos</h4>
                <p className="text-xs text-slate-400 leading-relaxed">Descarga la plantilla obligatoria y guárdala en formato <b>.CSV</b>.</p>
                <button className="text-xs font-bold text-emerald-400 bg-emerald-400/10 border border-emerald-400/20 px-4 py-2 rounded-lg hover:bg-emerald-400/20 transition-colors flex items-center gap-2">
                  <span>📥</span> Bajar plantilla_platos.csv
                </button>
              </div>
              <div className="bg-slate-800/50 border border-slate-700 p-4 rounded-xl space-y-3">
                <h4 className="text-sm font-bold text-slate-300">→ Paso 2: Sube el archivo</h4>
                <div className="border-2 border-dashed border-slate-600 rounded-xl p-8 flex flex-col items-center justify-center text-center hover:bg-slate-800 transition-colors cursor-pointer">
                  <p className="text-sm font-bold text-slate-300">☁ Arrastra tu archivo .CSV aquí</p>
                  <p className="text-[10px] text-slate-500 mt-1">Máximo 500 filas por importación.</p>
                  <button className="mt-4 text-xs font-bold bg-slate-700 text-white px-5 py-2 rounded-full border border-slate-600">Seleccionar Archivo</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// --- WIDGET: MODIFICADORES Y VARIANTES (PASO 3) ---
function MenuModificadoresBlock({ viewMode, showGroupModal, setShowGroupModal, restauranteId, platos, grupos, setGrupos, opciones, setOpciones, vinculos, setVinculos }) {
  // 1. Estados elevados a App. Props pasados desde ViewMenu: grupos, opciones, vinculos.
  // const [opciones, setOpciones] = React.useState([...]);
  const [loading, setLoading] = React.useState(false);

  // Carga inicial de datos
  React.useEffect(() => {
    // Carga inicial deshabilitada (offline/static)
  }, []);

  
  const fetchModificadores = async () => {
    // Sin servidor — los grupos ya están en el estado inicial de este componente
    setLoading(false);
  };

  // const [vinculos, setVinculos] = React.useState([...]);

  // 2. Estado UI
  // viewMode elevated to parent // 'biblioteca' | 'por_plato'
  const [selectedPlatoId, setSelectedPlatoId] = React.useState(platos.length > 0 ? platos[0].id : null);
  
  // showGroupModal elevated to parent
  const [editingGroup, setEditingGroup] = React.useState(null);
  
  const [showOptionModal, setShowOptionModal] = React.useState(false);
  const [activeGroupIdForOption, setActiveGroupIdForOption] = React.useState(null);
  const [editingOption, setEditingOption] = React.useState(null);
  
  const [formError, setFormError] = React.useState('');

  // 3. Formularios
  const defaultGroupForm = { nombre: '', tipo_seleccion: 'UNICA', min_selecciones: 1, max_selecciones: 1, estado: 'ACTIVO' };
  const [groupForm, setGroupForm] = React.useState({ ...defaultGroupForm });

  const defaultOptionForm = { nombre: '', precio_adicional: '', estado: 'DISPONIBLE' };
  const [optionForm, setOptionForm] = React.useState({ ...defaultOptionForm });



  // --- LÓGICA DE GRUPOS ---
  const handleOpenGroupForm = (grupo = null) => {
    setFormError('');
    if (grupo) {
      setEditingGroup(grupo);
      setGroupForm({ ...grupo });
    } else {
      setEditingGroup(null);
      setGroupForm({ ...defaultGroupForm });
    }
    setShowGroupModal(true);
  };

  const handleGroupTypeChange = (tipo) => {
    let min = groupForm.min_selecciones;
    let max = groupForm.max_selecciones;

    // Regla 4: Tipo UNICA fuerza min 1 max 1
    if (tipo === 'UNICA') { min = 1; max = 1; }
    else if (tipo === 'OPCIONAL_UNICA') { min = 0; max = 1; }
    else if (tipo === 'MULTIPLE') { min = Math.max(1, min); max = max || 2; }
    else if (tipo === 'OPCIONAL_MULTIPLE') { min = 0; }
    
    setGroupForm({ ...groupForm, tipo_seleccion: tipo, min_selecciones: min, max_selecciones: max });
  };

  const handleSaveGroup = (e) => {
    e.preventDefault();
    setFormError('');

    const nombreLimpio = groupForm.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre del grupo es obligatorio.');
    
    // Regla 2: Único en restaurante
    const isDuplicate = grupos.some(g => g.nombre.toLowerCase() === nombreLimpio.toLowerCase() && g.id !== editingGroup?.id);
    if (isDuplicate) return setFormError('Error 409: Ya existe un grupo con este nombre.');

    const nuevoGrupo = { ...groupForm, id: editingGroup ? editingGroup.id : `g-${Date.now()}`, nombre: nombreLimpio };

    if (editingGroup) {
      setGrupos(grupos.map(g => g.id === editingGroup.id ? nuevoGrupo : g));
      console.log(`[Evento] Grupo actualizado: ${nuevoGrupo.id}`);
    } else {
      setGrupos([...grupos, nuevoGrupo]);
      console.log(`[Evento] Grupo creado: ${nuevoGrupo.id}`);
    }
    setShowGroupModal(false);
  };

  const handleToggleGroupState = (grupo) => {
    const nuevoEstado = grupo.estado === 'ACTIVO' ? 'INACTIVO' : 'ACTIVO';
    // Automatización 3: Advertencia si es obligatorio
    if (nuevoEstado === 'INACTIVO' && (grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE')) {
      const isLinked = vinculos.some(v => v.grupo_id === grupo.id);
      if (isLinked) {
        if (!window.confirm(`⚠️ Este grupo es obligatorio en uno o más platos. Desactivarlo puede impedir tomar órdenes correctamente.\n¿Deseas continuar?`)) return;
      }
    }
    setGrupos(grupos.map(g => g.id === grupo.id ? { ...g, estado: nuevoEstado } : g));
  };

  // --- LÓGICA DE OPCIONES ---
  const handleOpenOptionForm = (grupoId, opcion = null) => {
    setFormError('');
    setActiveGroupIdForOption(grupoId);
    if (opcion) {
      setEditingOption(opcion);
      setOptionForm({ ...opcion });
    } else {
      setEditingOption(null);
      setOptionForm({ ...defaultOptionForm });
    }
    setShowOptionModal(true);
  };

  const handleSaveOption = (e) => {
    e.preventDefault();
    setFormError('');

    const nombreLimpio = optionForm.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre de la opción es obligatorio.');
    
    // Regla 3: Precio >= 0
    const precio = Number(optionForm.precio_adicional);
    if (!Number.isInteger(precio) || precio < 0) return setFormError('El precio debe ser un número entero mayor o igual a cero (no se permiten descuentos).');

    // Validación duplicado en el mismo grupo
    const isDuplicate = opciones.some(o => o.grupo_id === activeGroupIdForOption && o.nombre.toLowerCase() === nombreLimpio.toLowerCase() && o.id !== editingOption?.id);
    if (isDuplicate) return setFormError('Error 409: Ya existe una opción con este nombre en el grupo.');

    const nuevaOpcion = {
      ...optionForm,
      id: editingOption ? editingOption.id : `o-${Date.now()}`,
      grupo_id: activeGroupIdForOption,
      nombre: nombreLimpio,
      precio_adicional: precio,
      orden: editingOption ? editingOption.orden : (opciones.filter(o=>o.grupo_id===activeGroupIdForOption).length + 1)
    };

    if (editingOption) {
      setOpciones(opciones.map(o => o.id === editingOption.id ? nuevaOpcion : o));
      // Automatización 4: Conservar precio en ordenes abiertas
      if (editingOption.precio_adicional !== nuevaOpcion.precio_adicional) {
        console.log('⚠️ [Regla 6 Aplicada] Precio de opción editado. Las órdenes ABIERTAS conservan el precio original.');
      }
    } else {
      setOpciones([...opciones, nuevaOpcion]);
    }
    setShowOptionModal(false);
  };

  const handleToggleOptionState = (opcion, nuevoEstado) => {
    setOpciones(opciones.map(o => o.id === opcion.id ? { ...o, estado: nuevoEstado } : o));
    // Automatización 2: WebSocket
    if (nuevoEstado === 'AGOTADO') console.log(`[Evento WebSocket] opcion.agotada: ${opcion.nombre}. Operaciones la bloquea inmediatamente.`);
  };

  // --- LÓGICA DE VINCULACIÓN ---
  const toggleVinculo = (platoId, grupoId) => {
    const isLinked = vinculos.some(v => v.plato_id === platoId && v.grupo_id === grupoId);
    if (isLinked) {
      // Automatización 5: Desvincular obligatorio
      const grupo = grupos.find(g => g.id === grupoId);
      if (grupo && (grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE')) {
        console.log(`⚠️ [Alerta Generada] Desvinculaste el grupo obligatorio "${grupo.nombre}" del plato.`);
      }
      setVinculos(vinculos.filter(v => !(v.plato_id === platoId && v.grupo_id === grupoId)));
      console.log(`[Evento] Modificador desvinculado de plato.`);
    } else {
      // Automatización 1
      const nuevoOrden = vinculos.filter(v => v.plato_id === platoId).length + 1;
      setVinculos([...vinculos, { plato_id: platoId, grupo_id: grupoId, orden_en_plato: nuevoOrden }]);
      console.log(`[Evento] modificador.vinculado: Operaciones actualiza UI del plato sin recargar.`);
    }
  };

  return (
    <div className="bg-white rounded-3xl border border-gray-200 p-0 shadow-sm overflow-hidden flex flex-col border-l-4 border-l-orange-500">
      <div className="bg-gray-50/50 flex-1 relative min-h-[400px]">
        {loading && (
          <div className="absolute inset-0 flex items-center justify-center bg-white/50 z-20">
            <span style={{fontSize:'15px', lineHeight:1}}>🔄</span>
          </div>
        )}
        
        {/* VISTA 1: BIBLIOTECA DE GRUPOS */}
        {viewMode === 'biblioteca' && (
          <div className="p-6">
            <div className="flex justify-between items-center mb-6">
               <h4 className="text-sm font-bold text-slate-800">Grupos Reutilizables creados ({grupos.length})</h4>
               <button onClick={() => handleOpenGroupForm()} className="btn bg-slate-900 text-white hover:bg-slate-800 py-2 px-4 text-xs shadow-md">+ Nuevo Grupo</button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
               {grupos.map(grupo => {
                 const opsGrupo = opciones.filter(o => o.grupo_id === grupo.id).sort((a,b)=>a.orden-b.orden);
                 const vincsCount = vinculos.filter(v => v.grupo_id === grupo.id).length;
                 const isUnica = grupo.tipo_seleccion.includes('UNICA');
                 const isRequired = grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE';
                 
                 return (
                   <div key={grupo.id} className={`bg-white border rounded-2xl shadow-sm overflow-hidden flex flex-col transition-all ${grupo.estado === 'INACTIVO' ? 'border-gray-200 opacity-60 bg-gray-50' : 'border-gray-200 hover:border-orange-200'}`}>
                      <div className="p-4 border-b border-gray-100 flex justify-between items-start">
                         <div>
                            <div className="flex items-center gap-2 mb-1.5">
                               <h5 className={`font-bold text-base ${grupo.estado === 'INACTIVO' ? 'text-gray-500 line-through' : 'text-slate-800'}`}>{grupo.nombre}</h5>
                               <span className={`text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded ${isUnica ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
                                 {grupo.tipo_seleccion.replace('_', ' ')}
                               </span>
                            </div>
                            <p className="text-[10px] font-medium text-gray-500 flex items-center gap-2">
                               {isRequired ? <span className="text-red-500 font-bold border border-red-200 bg-red-50 px-1 rounded">OBLIGATORIO</span> : <span className="text-gray-400 border border-gray-200 px-1 rounded">OPCIONAL</span>}
                               <span>Min: {grupo.min_selecciones} | Max: {grupo.max_selecciones || '∞'}</span>
                               <span>• En {vincsCount} platos</span>
                            </p>
                         </div>
                         <div className="flex flex-col items-end gap-2">
                            <div onClick={() => handleToggleGroupState(grupo)} className={`relative w-10 h-5 flex items-center rounded-full p-1 cursor-pointer transition-colors ${grupo.estado === 'ACTIVO' ? 'bg-emerald-500' : 'bg-gray-300'}`}>
                               <div className={`w-3.5 h-3.5 bg-white rounded-full shadow-md transform transition-transform ${grupo.estado === 'ACTIVO' ? 'translate-x-4.5' : 'translate-x-0'}`} style={{ transform: grupo.estado === 'ACTIVO' ? 'translateX(18px)' : 'translateX(0)' }}></div>
                            </div>
                            <button onClick={() => handleOpenGroupForm(grupo)} className="text-[10px] font-bold text-indigo-600 hover:underline">Editar Grupo</button>
                         </div>
                      </div>

                      <div className="p-4 bg-gray-50 flex-1">
                         <div className="flex justify-between items-center mb-3">
                            <span className="text-xs font-bold text-gray-500 uppercase tracking-widest">Opciones ({opsGrupo.length})</span>
                            <button onClick={() => handleOpenOptionForm(grupo.id)} className="text-[10px] font-bold text-orange-600 bg-orange-100 hover:bg-orange-200 px-2 py-1 rounded transition-colors">+ Añadir</button>
                         </div>
                         <div className="space-y-2">
                            {opsGrupo.length === 0 ? <p className="text-xs text-gray-400 text-center py-2 border border-dashed border-gray-300 rounded-lg">No hay opciones creadas.</p> : null}
                            {opsGrupo.map(op => (
                               <div key={op.id} className={`flex items-center justify-between p-2 rounded-lg border bg-white ${op.estado === 'AGOTADO' ? 'border-red-100 bg-red-50/30' : 'border-gray-100'}`}>
                                  <div className="flex items-center gap-2">
                                     {isUnica ? <div className="w-3 h-3 rounded-full border-2 border-gray-300"></div> : <div className="w-3 h-3 rounded border border-gray-300"></div>}
                                     <span className={`text-xs font-bold ${op.estado === 'AGOTADO' ? 'text-red-800 line-through' : 'text-slate-800'}`}>{op.nombre}</span>
                                     {op.estado === 'AGOTADO' && <span className="text-[8px] font-black bg-red-600 text-white px-1 rounded uppercase">Agotado</span>}
                                  </div>
                                  <div className="flex items-center gap-3">
                                     <span className={`text-xs font-black ${op.precio_adicional > 0 ? 'text-emerald-600' : 'text-gray-400'}`}>
                                        {op.precio_adicional > 0 ? `+${formatCOP(op.precio_adicional)}` : '$0'}
                                     </span>
                                     <select value={op.estado} onChange={(e) => handleToggleOptionState(op, e.target.value)} className="text-[10px] font-bold outline-none cursor-pointer bg-transparent text-gray-500 hover:text-indigo-600">
                                        <option value="DISPONIBLE">Disp.</option>
                                        <option value="AGOTADO">Agot.</option>
                                     </select>
                                     <button onClick={() => handleOpenOptionForm(grupo.id, op)} className="text-gray-400 hover:text-indigo-600"><span style={{fontSize:'15px', lineHeight:1}}>⚙</span></button>
                                  </div>
                               </div>
                            ))}
                         </div>
                      </div>
                   </div>
                 )
               })}
            </div>
          </div>
        )}

        {/* VISTA 2: ASIGNACIÓN POR PLATO */}
        {viewMode === 'por_plato' && (
          <div className="flex h-[500px]">
             {/* Left Col: Platos List */}
             <div className="w-1/3 border-r border-gray-200 bg-white overflow-y-auto">
                <div className="p-4 border-b border-gray-100 sticky top-0 bg-white/90 backdrop-blur-sm z-10">
                   <h4 className="text-xs font-bold text-gray-500 uppercase tracking-widest">Platos Activos</h4>
                </div>
                <div className="p-2 space-y-1">
                   {platos.filter(p=>p.estado !== 'OCULTO').map(plato => {
                     const isSelected = selectedPlatoId === plato.id;
                     const vincsCount = vinculos.filter(v => v.plato_id === plato.id).length;
                     return (
                       <div 
                         key={plato.id} 
                         onClick={() => setSelectedPlatoId(plato.id)}
                         className={`p-3 rounded-xl cursor-pointer transition-colors flex justify-between items-center ${isSelected ? 'bg-orange-50 border border-orange-200' : 'hover:bg-gray-50 border border-transparent'}`}
                       >
                         <span className={`text-xs font-bold truncate pr-2 ${isSelected ? 'text-orange-900' : 'text-slate-700'}`}>{plato.nombre}</span>
                         <span className={`text-[10px] font-black px-1.5 py-0.5 rounded ${vincsCount > 0 ? (isSelected ? 'bg-orange-200 text-orange-800' : 'bg-indigo-100 text-indigo-700') : 'bg-gray-100 text-gray-400'}`}>
                           {vincsCount}
                         </span>
                       </div>
                     )
                   })}
                </div>
             </div>

             {/* Right Col: Vinculación */}
             <div className="flex-1 bg-gray-50 p-6 overflow-y-auto">
                {selectedPlatoId ? (() => {
                  const plato = platos.find(p => p.id === selectedPlatoId);
                  const gruposVinculados = vinculos.filter(v => v.plato_id === plato.id).map(v => v.grupo_id);
                  
                  return (
                    <div>
                       <div className="mb-6 flex items-center justify-between">
                         <div>
                            <h3 className="text-xl font-black text-slate-800">{plato.nombre}</h3>
                            <p className="text-xs text-gray-500 font-bold mt-1">Precio Base: {formatCOP(plato.precio_venta)}</p>
                         </div>
                         <div className="bg-white px-3 py-1.5 rounded-lg border border-gray-200 text-xs font-bold shadow-sm flex items-center gap-2">
                           ⊞ {gruposVinculados.length} Modificadores
                         </div>
                       </div>
                       
                       <p className="text-[11px] font-black uppercase tracking-widest text-gray-400 mb-3 border-b border-gray-200 pb-2">Selecciona qué grupos aplican a este plato</p>
                       
                       <div className="space-y-3">
                         {grupos.filter(g=>g.estado==='ACTIVO').map(grupo => {
                           const isLinked = gruposVinculados.includes(grupo.id);
                           const isUnica = grupo.tipo_seleccion.includes('UNICA');
                           const opsCount = (grupo.opciones || []).length;
                           return (
                             <div 
                               key={grupo.id} 
                               onClick={() => toggleVinculo(plato.id, grupo.id)}
                               className={`p-4 rounded-xl border flex items-center gap-4 cursor-pointer transition-all ${isLinked ? 'bg-white border-orange-500 shadow-md ring-1 ring-orange-500' : 'bg-white border-gray-200 hover:border-gray-300 opacity-70'}`}
                             >
                                <div className={`w-5 h-5 rounded flex items-center justify-center shrink-0 border ${isLinked ? 'bg-orange-500 border-orange-500 text-white' : 'bg-white border-gray-300 text-transparent'}`}>
                                  {isLinked ? <span style={{fontSize:'18px'}}>✅</span> : <span style={{fontSize:'18px'}}>✅</span>}
                                </div>
                                <div className="flex-1">
                                   <div className="flex items-center gap-2 mb-1">
                                      <h4 className="font-bold text-sm text-slate-800">{grupo.nombre}</h4>
                                      <span className={`text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded ${isUnica ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
                                        {grupo.tipo_seleccion.replace('_', ' ')}
                                      </span>
                                   </div>
                                   <p className="text-xs text-gray-500">{opsCount} opciones en el grupo.</p>
                                </div>
                             </div>
                           )
                         })}
                       </div>
                    </div>
                  )
                })() : (
                  <div className="h-full flex flex-col items-center justify-center text-gray-400">
                     🍽
                     <p className="font-bold text-sm text-slate-500">Selecciona un plato de la lista izquierda</p>
                  </div>
                )}
             </div>
          </div>
        )}

      </div>

      {/* MODAL: GRUPO DE MODIFICADORES */}
      {showGroupModal && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
          <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-in slide-in-from-bottom-8">
             <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 className="font-black text-slate-800 flex items-center gap-2">⊞ {editingGroup ? 'Editar Grupo' : 'Nuevo Grupo de Modificadores'}</h3>
                <button onClick={() => setShowGroupModal(false)} className="text-gray-400 hover:text-slate-800 bg-white p-1 rounded-lg border border-gray-200">✕</button>
             </div>
             
             <form onSubmit={handleSaveGroup} className="p-6">
                {formError && (
                  <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start gap-3 text-sm">
                    <span style={{fontSize:'15px', lineHeight:1}}>⚠️</span>
                    <p className="font-semibold">{formError}</p>
                  </div>
                )}

                <div className="space-y-5">
                   <div>
                      <label className="text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
                         <span>Nombre del Grupo <span className="text-red-500">*</span></span>
                         <span className="text-[10px] text-gray-400">Ej: Término de la carne</span>
                      </label>
                      <input type="text" value={groupForm.nombre} onChange={(e) => setGroupForm({...groupForm, nombre: e.target.value})} maxLength={60} className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-orange-500 outline-none transition-all" required autoFocus />
                   </div>

                   <div>
                      <label className="text-xs font-bold text-slate-700 mb-1.5 block">Tipo de Selección <span className="text-red-500">*</span></label>
                      <select value={groupForm.tipo_seleccion} onChange={(e) => handleGroupTypeChange(e.target.value)} className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-orange-500 outline-none bg-white font-bold cursor-pointer">
                         <option value="UNICA">Única (Obligatorio elegir 1)</option>
                         <option value="MULTIPLE">Múltiple (Obligatorio elegir mínimo 1)</option>
                         <option value="OPCIONAL_UNICA">Opcional Única (Puede elegir 1 o ninguna)</option>
                         <option value="OPCIONAL_MULTIPLE">Opcional Múltiple (Adiciones al gusto)</option>
                      </select>
                      <p className="text-[10px] text-gray-500 mt-1.5 bg-gray-50 p-2 rounded border border-gray-100 leading-relaxed">
                        {groupForm.tipo_seleccion === 'UNICA' && "Operaciones no dejará cobrar la orden sin elegir una opción. Ideal para término de cocción."}
                        {groupForm.tipo_seleccion === 'MULTIPLE' && "Obliga al cliente a elegir varias opciones (ej: Elige 2 acompañamientos)."}
                        {groupForm.tipo_seleccion === 'OPCIONAL_UNICA' && "Puede elegir una opción, pero no es obligatorio para cobrar."}
                        {groupForm.tipo_seleccion === 'OPCIONAL_MULTIPLE' && "Ideal para adiciones extras o exclusiones. El cliente elige las que quiera."}
                      </p>
                   </div>

                   <div className="grid grid-cols-2 gap-4 pt-2">
                     <div>
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Selección Mínima</label>
                        <input type="number" min="0" value={groupForm.min_selecciones} onChange={(e) => setGroupForm({...groupForm, min_selecciones: Number(e.target.value)})} disabled={groupForm.tipo_seleccion.includes('UNICA') || groupForm.tipo_seleccion.includes('OPCIONAL')} className="w-full text-sm p-3 rounded-xl border border-gray-300 outline-none disabled:bg-gray-100 disabled:text-gray-400 text-center font-bold" />
                     </div>
                     <div>
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Selección Máxima</label>
                        <input type="number" min={groupForm.min_selecciones} value={groupForm.max_selecciones || ''} onChange={(e) => setGroupForm({...groupForm, max_selecciones: e.target.value ? Number(e.target.value) : null})} disabled={groupForm.tipo_seleccion.includes('UNICA')} placeholder="Ilimitado" className="w-full text-sm p-3 rounded-xl border border-gray-300 outline-none disabled:bg-gray-100 disabled:text-gray-400 text-center font-bold" />
                     </div>
                   </div>
                </div>

                <div className="mt-8 flex gap-3">
                   <button type="button" onClick={() => setShowGroupModal(false)} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-slate-700 text-sm font-bold rounded-xl transition-colors">Cancelar</button>
                   <button type="submit" className="flex-[2] py-3 bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold rounded-xl transition-colors shadow-lg">Guardar Grupo</button>
                </div>
             </form>
          </div>
        </div>
      )}

      {/* MODAL: OPCIÓN INDIVIDUAL */}
      {showOptionModal && (
        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
          <div className="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden animate-in slide-in-from-bottom-8">
             <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 className="font-black text-slate-800">{editingOption ? 'Editar Opción' : 'Nueva Opción'}</h3>
                <button onClick={() => setShowOptionModal(false)} className="text-gray-400 hover:text-slate-800 bg-white p-1 rounded-lg border border-gray-200">✕</button>
             </div>
             
             <form onSubmit={handleSaveOption} className="p-6 space-y-5">
                {formError && (
                  <div className="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-xs font-bold mb-4">{formError}</div>
                )}
                <div>
                   <label className="text-xs font-bold text-slate-700 mb-1.5 block">Nombre de la opción <span className="text-red-500">*</span></label>
                   <input type="text" value={optionForm.nombre} onChange={(e) => setOptionForm({...optionForm, nombre: e.target.value})} maxLength={60} placeholder="Ej: Queso Extra" className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-orange-500 outline-none" required autoFocus />
                </div>
                <div>
                   <label className="text-xs font-bold text-slate-700 mb-1.5 flex justify-between items-center">
                                     <span>Precio Adicional (COP) <span className="text-red-500">*</span></span>
                                     <span className="text-[9px] bg-slate-100 px-1 rounded text-slate-500 font-black">≥ $0</span>
                                   </label>
                                   <div className="relative">
                                      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
                                      <input type="number" min="0" step="1" pattern="\d+" value={optionForm.precio_adicional} onChange={(e) => setOptionForm({...optionForm, precio_adicional: e.target.value})} placeholder="0" className="w-full text-sm p-3 pl-8 rounded-xl border border-gray-300 focus:border-orange-500 outline-none font-black text-emerald-700" required />
                                   </div>
                                   <p className="text-[10px] text-gray-500 mt-1">Si no tiene costo extra, coloca 0.</p>
                                </div>

                                <div className="mt-8 flex gap-3">
                                   <button type="submit" className="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold rounded-xl shadow-md">Guardar Opción</button>
                                </div>
                             </form>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                }

// --- COMPONENTE MÓDULO 4: RECETAS E INVENTARIO ---
function MenuRecetasBlock({ activeTab, platos, recetas, inventario }) {
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

  // ─── STATE ───────────────────────────────────────────────────────────────────
  // Panel open state: stores plato.id | null
  const [expandedPlato, setExpandedPlato] = React.useState(null);
  // Each plato has its own lineas state, keyed by plato.id -> []
  const [platosLineas, setPlatosLineas] = React.useState({});
  const [buscarInsumo, setBuscarInsumo] = React.useState('');

  const UNIDADES = ['g', 'kg', 'ml', 'l', 'und', 'cc'];

  // ─── HELPERS  ─────────────────────────────────────────────────────────────────
  const fmt = (val) => {
    if (val === null || val === undefined || isNaN(Number(val))) return null;
    return '$' + Math.round(Number(val)).toLocaleString('es-CO');
  };

  const factorLabel = (f) => {
    const n = Number(f);
    if (n >= 1.0) return 'Sin merma';
    if (n >= 0.8) return 'Limpieza/tallo';
    if (n >= 0.6) return 'Pelado/Puntas';
    return 'Alta merma';
  };

  // Convert cantidad to base unit (kg or l) based on unidad_receta
  const toBase = (cantidad, unidad) => {
    const n = Number(cantidad) || 0;
    if (unidad === 'g')   return n / 1000;
    if (unidad === 'ml')  return n / 1000;
    if (unidad === 'cc')  return n / 1000;
    return n; // kg, l, und -> directo
  };

  const calcFila = (linea) => {
    const cu = Number(linea.costo_unitario) || 0;
    const cant = toBase(linea.cantidad, linea.unidad_receta);
    const factor = Math.max(0.01, Number(linea.factor) || 1);
    if (!cu) return { operacion: '—', costo: null };
    const costo = (cu * cant) / factor;
    const cantBase = cant.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    const operacion = `(${cu.toLocaleString('es-CO')} × ${cantBase}) / ${factor}`;
    return { operacion, costo: Math.round(costo) };
  };

  const calcMargen = (precio, costo) => {
    if (!precio || costo === null || costo === undefined) return null;
    return Math.round(((precio - costo) / precio) * 100);
  };

  const margenStyle = (pct) => {
    if (pct === null) return { color: '#D1D5DB' };
    if (pct >= 60) return { color: '#16A34A', bg: '#F0FDF4', border: '#BBF7D0' };
    if (pct >= 40) return { color: '#2563EB', bg: '#EFF6FF', border: '#BFDBFE' };
    return { color: '#DC2626', bg: '#FEF2F2', border: '#FECACA' };
  };

  // ─── ESCANDALLO OPEN/CLOSE ────────────────────────────────────────────────────
  const toggleEscandallo = (plato) => {
    if (expandedPlato === plato.id) { setExpandedPlato(null); return; }
    // Load lines if not already loaded for this plato
    setPlatosLineas(prev => {
      if (prev[plato.id]) return prev; // already loaded
      // Primero intenta cargar desde recetas importadas del Excel
      const pNorm = norm(plato.nombre);
      const recetasDelPlato = (recetas || []).filter(r =>
        r.nombre_plato && norm(r.nombre_plato) === pNorm
      );
      
      let lineasIniciales = [];
      if (recetasDelPlato.length > 0) {
        lineasIniciales = recetasDelPlato.map((r, idx) => ({
          id: idx + 1,
          ingrediente: r.ingrediente_nombre || '',
          costo_unitario: r.costo_unitario || 0,
          unidad_compra: r.unidad_compra || 'kg',
          cantidad: r.cantidad || 0,
          unidad_receta: r.unidad_medida || 'g',
          factor: 1.0,
          subtotal_costo: r.subtotal_costo !== null ? r.subtotal_costo : null,
          margen_bruto_pct: r.margen_ingrediente_pct !== null ? r.margen_ingrediente_pct : null,
          pvp_sugerido: r.pvp_sugerido_ing !== null ? r.pvp_sugerido_ing : null,
          margen_bruto_pesos: r.margen_bruto_pesos_ing !== null ? r.margen_bruto_pesos_ing : null
        }));
      } else {
        // Fallback a datos mock hardcodeados
        lineasIniciales = null
          ? null.map(l => ({ ...l }))
          : [];
      }
      return { ...prev, [plato.id]: lineasIniciales };
    });
    setBuscarInsumo('');
    setExpandedPlato(plato.id);
  };

  const getLineas = (platoId) => platosLineas[platoId] || [];

  const addIngrediente = (platoId) => {
    const nombre = buscarInsumo.trim();
    if (!nombre) return;
    const nuevaLinea = { id: Date.now(), ingrediente: nombre, costo_unitario: 0, unidad_compra: 'kg', cantidad: 100, unidad_receta: 'g', factor: 1.0 };
    setPlatosLineas(prev => ({ ...prev, [platoId]: [...(prev[platoId] || []), nuevaLinea] }));
    setBuscarInsumo('');
  };

  const removeIngrediente = (platoId, lineaId) => {
    setPlatosLineas(prev => ({ ...prev, [platoId]: (prev[platoId] || []).filter(l => l.id !== lineaId) }));
  };

  const updateLinea = (platoId, lineaId, field, value) => {
    setPlatosLineas(prev => ({
      ...prev,
      [platoId]: (prev[platoId] || []).map(l => l.id === lineaId ? { ...l, [field]: value } : l)
    }));
  };

  // ─── FORMATO DE MONEDA Y PORCENTAJE ─────────────────────────────────────────────────────────────
  const formatCOP = (val) => {
    const n = parseFloat(val);
    if (isNaN(n) || val === null || val === undefined) return '—';
    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(n);
  };

  const formatPct = (val) => {
    const n = parseFloat(val);
    if (isNaN(n) || val === null || val === undefined) return '—';
    // El valor del Excel ya viene como decimal (0.78 = 78%)
    return (n * 100).toFixed(1) + '%';
  };

  // ─── ENRICH PLATOS ─────────────────────────────────────────────────────────────
  // Lee directamente los campos enriquecidos que vienen del parser de 5_RECETAS
  const platosEnriquecidos = (platos || []).map(plato => {
    const pNorm = norm(plato.nombre);
    const tieneReceta = plato.tiene_receta || (recetas || []).some(r => r.nombre_plato && norm(r.nombre_plato) === pNorm);

    return {
      ...plato,
      tieneReceta,
      costoMP: (plato.costo_materia_prima !== null && plato.costo_materia_prima !== undefined) ? plato.costo_materia_prima : null,
      margenPctProm: (plato.margen_bruto_pct_promedio !== null && plato.margen_bruto_pct_promedio !== undefined) ? plato.margen_bruto_pct_promedio : null,
      pvpSugerido: (plato.precio_venta_sugerido !== null && plato.precio_venta_sugerido !== undefined) ? plato.precio_venta_sugerido : null,
      margenBrutoPesos: (plato.margen_bruto_pesos !== null && plato.margen_bruto_pesos !== undefined) ? plato.margen_bruto_pesos : null,
      alertaState: tieneReceta ? 'sync' : 'no_registrado',
      fugaMsg: tieneReceta ? '' : 'Sin receta en 5_RECETAS'
    };
  });;

  // ─── ESCANDALLO PANEL ─────────────────────────────────────────────────────────
  const EscandalloPanel = ({ plato }) => {
    const lineas = getLineas(plato.id);
    const costoTotal = lineas.reduce((acc, l) => {
      const { costo } = calcFila(l);
      return acc + (costo || 0);
    }, 0);
    const margenPct = calcMargen(plato.precio_venta, costoTotal > 0 ? costoTotal : null);
    const ms = margenStyle(margenPct);

    return (
      <tr>
        <td colSpan={8} style={{padding:'4px 8px 8px 8px', background:'#F8FAFC'}}>
          <div style={{background:'white', border:'1px solid #E2E8F0', borderRadius:16, boxShadow:'0 4px 16px rgba(0,0,0,0.06)', padding:'20px', margin:'0 4px'}}>

            {/* HEADER */}
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
              <div style={{display:'flex', alignItems:'center', gap:10}}>
                <span style={{fontSize:17}}>✏️</span>
                <span style={{fontWeight:700, color:'#1E293B', fontSize:14}}>Escandallo — {plato.nombre}</span>
                <span style={{fontSize:'9px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', background:'#F3F4F6', color:'#6B7280', borderRadius:5, padding:'2px 8px'}}>COMPOSICIÓN TÉCNICA</span>
              </div>
              <button
                onClick={() => setExpandedPlato(null)}
                style={{background:'#F8FAFC', border:'1px solid #E2E8F0', borderRadius:8, padding:'4px 12px', fontSize:12, fontWeight:700, color:'#64748B', cursor:'pointer'}}
              >✕ Cerrar</button>
            </div>

            {/* SEARCH ROW */}
            <div style={{display:'flex', gap:8, marginBottom:14}}>
              <div style={{flex:1, position:'relative'}}>
                <span style={{position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', fontSize:14, color:'#9CA3AF'}}>🔍</span>
                <input
                  type="text"
                  placeholder="Buscar insumo... (ej: Harina, Queso)"
                  value={buscarInsumo}
                  onChange={e => setBuscarInsumo(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addIngrediente(plato.id); } }}
                  style={{width:'100%', border:'1px solid #E5E7EB', borderRadius:12, padding:'8px 12px 8px 36px', fontSize:13, background:'#F9FAFB', outline:'none', boxSizing:'border-box'}}
                />
              </div>
              <button
                onClick={() => addIngrediente(plato.id)}
                style={{background:'#4F46E5', color:'white', fontWeight:700, fontSize:13, padding:'8px 18px', borderRadius:12, border:'none', cursor:'pointer', whiteSpace:'nowrap'}}
              >+ Agregar Ingrediente</button>
            </div>

            {/* TABLA FICHA TÉCNICA */}
            <div style={{overflowX:'auto', borderRadius:12, border:'1px solid #E5E7EB'}}>
              <table style={{width:'100%', borderCollapse:'collapse', fontSize:13, minWidth:820}}>
                <thead>
                  <tr style={{background:'#F8FAFC', borderBottom:'1px solid #E5E7EB'}}>
                    <th style={{padding:'10px 12px', textAlign:'left', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Ingrediente</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Cantidad (Porción)</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Unidad Medida</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Subtotal Costo Materia Prima</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Margen Bruto %</th>
                    <th style={{padding:'10px 12px', textAlign:'center', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Precio de Venta Sugerido (Sin IVA)</th>
                    <th style={{padding:'10px 12px', textAlign:'right', fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.06em', color:'#94A3B8'}}>Margen Bruto Pesos</th>
                    <th style={{padding:'10px 8px', width:32}}></th>
                  </tr>
                </thead>
                <tbody>
                  {lineas.length === 0 ? (
                    <tr>
                      <td colSpan={8} style={{textAlign:'center', padding:'24px', color:'#9CA3AF', fontSize:13, fontStyle:'italic'}}>
                        No hay ingredientes. Usa el buscador para agregar insumos.
                      </td>
                    </tr>
                  ) : (
                    lineas.map((linea, li) => {
                      const isOdd = li % 2 === 1;
                      const subtotal = Number(linea.subtotal_costo) || 0;
                      const pvp = Number(linea.pvp_sugerido) || 0;
                      const mbPesos = Number(linea.margen_bruto_pesos) || 0;
                      const mbPct = Number(linea.margen_bruto_pct) || 0;
                      const msIng = margenStyle(mbPct);
                      return (
                        <tr key={linea.id} style={{borderBottom:'1px solid #F1F5F9', background: isOdd ? '#FAFBFC' : 'white'}}>
                          {/* COL 1 — INGREDIENTE */}
                          <td style={{padding:'10px 12px'}}>
                            <span style={{fontWeight:700, color:'#1E293B', fontSize:13}}>{linea.ingrediente}</span>
                          </td>
                          {/* COL 2 — CANTIDAD (PORCIÓN) */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            <div style={{display:'inline-flex', alignItems:'center', gap:4}}>
                              <input
                                type="number"
                                min="0"
                                step="any"
                                value={linea.cantidad}
                                onChange={e => updateLinea(plato.id, linea.id, 'cantidad', e.target.value)}
                                style={{width:80, textAlign:'center', fontSize:13, border:'1px solid #E2E8F0', borderRadius:8, padding:'4px 6px', background:'white', outline:'none'}}
                              />
                            </div>
                          </td>
                          {/* COL 3 — UNIDAD MEDIDA */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            <select
                              value={linea.unidad_receta || 'g'}
                              onChange={e => updateLinea(plato.id, linea.id, 'unidad_receta', e.target.value)}
                              style={{border:'1px solid #E2E8F0', borderRadius:8, fontSize:12, padding:'4px 6px', background:'white', outline:'none', cursor:'pointer'}}
                            >
                              {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                            </select>
                          </td>
                          {/* COL 4 — SUBTOTAL COSTO MP */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            {subtotal > 0
                              ? <span style={{fontWeight:700, color:'#334155', fontSize:13}}>${subtotal.toLocaleString('es-CO')}</span>
                              : <span style={{color:'#D1D5DB'}}>—</span>
                            }
                          </td>
                          {/* COL 5 — MARGEN BRUTO % */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            {mbPct > 0
                              ? <span style={{fontWeight:900, fontSize:12, color: msIng.color, background: msIng.bg, border:`1px solid ${msIng.border}`, borderRadius:6, padding:'2px 8px'}}>{mbPct.toFixed(1) || mbPct}%</span>
                              : <span style={{color:'#D1D5DB'}}>—</span>
                            }
                          </td>
                          {/* COL 6 — PRECIO DE VENTA SUGERIDO */}
                          <td style={{padding:'10px 12px', textAlign:'center'}}>
                            {pvp > 0
                              ? <span style={{fontWeight:700, color:'#1E293B', fontSize:13}}>${pvp.toLocaleString('es-CO')}</span>
                              : <span style={{color:'#D1D5DB'}}>—</span>
                            }
                          </td>
                          {/* COL 7 — MARGEN BRUTO PESOS */}
                          <td style={{padding:'10px 12px', textAlign:'right'}}>
                            {mbPesos > 0
                              ? <span style={{fontWeight:900, color:'#047857', fontSize:13}}>${mbPesos.toLocaleString('es-CO')}</span>
                              : <span style={{color:'#D1D5DB'}}>—</span>
                            }
                          </td>
                          {/* DELETE BTN */}
                          <td style={{padding:'10px 8px', textAlign:'center'}}>
                            <button
                              onClick={() => removeIngrediente(plato.id, linea.id)}
                              style={{width:24, height:24, borderRadius:6, border:'none', background:'transparent', color:'#CBD5E1', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, transition:'all 0.15s'}}
                              onMouseEnter={e => { e.currentTarget.style.background = '#FEF2F2'; e.currentTarget.style.color = '#DC2626'; }}
                              onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = '#CBD5E1'; }}
                              title="Eliminar ingrediente"
                            >✕</button>
                          </td>
                        </tr>
                      );
                    })
                  )}

                  {/* RESUMEN — COSTO TOTAL */}
                  {lineas.length > 0 && (
                    <>
                      <tr style={{background:'#F8FAFC', borderTop:'2px solid #E2E8F0'}}>
                        <td colSpan={6} style={{padding:'10px 12px', textAlign:'right'}}>
                          <span style={{fontWeight:900, color:'#334155', fontSize:13, textTransform:'uppercase', letterSpacing:'0.04em'}}>Costo Total de Producción</span>
                        </td>
                        <td style={{padding:'10px 12px', textAlign:'right'}}>
                          <span style={{fontWeight:900, color:'#0F172A', fontSize:15}}>
                            ${costoTotal.toLocaleString('es-CO')}
                          </span>
                        </td>
                        <td></td>
                      </tr>
                      <tr style={{background:'#F8FAFC', borderTop:'1px solid #F1F5F9'}}>
                        <td colSpan={6} style={{padding:'6px 12px', textAlign:'right'}}>
                          <span style={{fontWeight:700, color:'#64748B', fontSize:12}}>Margen Bruto Proyectado</span>
                        </td>
                        <td style={{padding:'6px 12px', textAlign:'right'}}>
                          {margenPct !== null ? (
                            <span style={{fontWeight:900, fontSize:14, color: ms.color, background: ms.bg, border:`1px solid ${ms.border}`, borderRadius:8, padding:'2px 10px'}}>
                              {margenPct}%
                            </span>
                          ) : <span style={{color:'#D1D5DB'}}>—</span>}
                        </td>
                        <td></td>
                      </tr>
                    </>
                  )}
                </tbody>
              </table>
            </div>

            {/* FOOTER BUTTONS */}
            <div style={{display:'flex', justifyContent:'flex-end', gap:8, marginTop:14, paddingTop:12, borderTop:'1px solid #F1F5F9'}}>
              <button
                onClick={() => setExpandedPlato(null)}
                style={{background:'white', border:'1px solid #E2E8F0', color:'#475569', fontWeight:700, fontSize:13, padding:'8px 20px', borderRadius:12, cursor:'pointer'}}
              >Cancelar</button>
              <button
                onClick={() => {
                  console.log('[Receta guardada]', plato.nombre, getLineas(plato.id));
                  setExpandedPlato(null);
                }}
                style={{background:'#059669', color:'white', fontWeight:700, fontSize:13, padding:'8px 20px', borderRadius:12, border:'none', cursor:'pointer', boxShadow:'0 2px 8px rgba(5,150,105,0.25)'}}
              >✓ Guardar Receta</button>
            </div>
          </div>
        </td>
      </tr>
    );
  };

  // ─── RENDER ───────────────────────────────────────────────────────────────────
  return (
    <div className="bg-white rounded-3xl border border-gray-200 shadow-sm flex flex-col overflow-hidden" style={{borderLeft:'4px solid #7C3AED'}}>
      {activeTab === 'platos' && (
        <div className="overflow-x-auto">
          <table className="w-full text-left text-sm border-collapse bg-white" style={{minWidth:900}}>
            <thead>
              <tr className="bg-slate-50 border-b border-gray-200">
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest">Nombre del Plato</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest">Costo Materia Prima</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Margen Bruto % Promedio</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right">Precio de Venta Sugerido (Sin IVA)</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-right">Margen Bruto Pesos</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Alerta Detección Fugas</th>
                <th className="px-4 py-3 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              {platosEnriquecidos.map((plato, idx) => {
                const isExpanded = expandedPlato === plato.id;
                const rowBg = idx % 2 === 0 ? 'white' : 'rgba(248,250,252,0.5)';
                const ms = margenStyle(plato.margenPctProm !== null ? plato.margenPctProm * 100 : null);
                return (
                  <React.Fragment key={plato.id || idx}>
                    <tr
                      className="border-b border-gray-100 hover:bg-purple-50/20 transition-colors"
                      style={{background: isExpanded ? '#F5F3FF' : rowBg, minHeight:64}}
                    >
                      {/* NOMBRE */}
                      <td className="px-4 py-3">
                        <span className="font-bold text-slate-800 text-sm">{plato.nombre}</span>
                      </td>
                      {/* COSTO MATERIA PRIMA */}
                      <td className="px-4 py-3">
                        {plato.costoMP !== null
