<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Test Dashboard</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; }
.test { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
.success { background: #d4edda; color: #155724; }
.error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
<h1>Test de Dashboard</h1>
<div id="test-results"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const results = document.getElementById('test-results');
    
    function addTest(name, success, message) {
        const div = document.createElement('div');
        div.className = `test ${success ? 'success' : 'error'}`;
        div.innerHTML = `<strong>${name}:</strong> ${message}`;
        results.appendChild(div);
    }
    
    // Test básico
    addTest('DOM Cargado', true, 'El DOM se cargó correctamente');
    
    // Test de variables CSS
    const root = getComputedStyle(document.documentElement);
    const verde = root.getPropertyValue('--verde');
    addTest('Variables CSS', verde !== '', `Variable --verde: ${verde || 'NO DEFINIDA'}`);
    
    // Test de elementos del dashboard
    const sidebar = document.getElementById('sidebar');
    addTest('Sidebar', !!sidebar, sidebar ? 'Sidebar encontrado' : 'Sidebar NO encontrado');
    
    console.log('Tests completados');
});
</script>
</body>
</html>
