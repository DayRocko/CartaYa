// =========================================================================
// WIDGET: MI RESTAURANTE (CONFIGURACION)
// =========================================================================
function ViewMiRestaurante() {
  const [loading, setLoading] = React.useState(true);
  const [saving, setSaving] = React.useState(false);
  const [message, setMessage] = React.useState(null);
  
  const [formData, setFormData] = React.useState({
    nombre: "", nit: "", razon_social: "", direccion: "", ciudad: "", telefono: "", email: "", propietario: "", sitio_web: "", logo_url: "",
    regimen_tributario: "simplificado", responsable_iva: false, impuesto_consumo: true, resolucion_dian: "", prefijo_facturacion: "", rango_desde: "", rango_hasta: "", fecha_vencimiento_resolucion: "",
    zona_horaria: "America/Bogota", hora_apertura: "08:00", hora_cierre: "22:00", hora_corte: "02:00", dias_activos: ["LUN","MAR","MIE","JUE","VIE","SAB","DOM"], capacidad_mesas: 0, capacidad_sillas: 0,
    modalidades: { salon: true, delivery: false, para_llevar: false }, propina_porcentaje: 10,
    medios_pago: { efectivo: true, tarjeta_debito: true, tarjeta_credito: true, nequi: true, daviplata: false, transferencia: false, rappi_pay: false, vale_alimentacion: false, cortesia: false, credito_cuenta: false },
    canales: { salon_comision: 0, delivery_propio_recargo: 0, rappi_comision: 28, domicilios_comision: 22 },
    alertas: { email_alertas: "", umbral_ventas_meta: 85, umbral_prime_cost: 65, alerta_stock: true, resumen_diario_hora: "23:00", reporte_semanal_dia: "LUN" }
  });

  React.useEffect(() => {
    fetch('/api/restaurante').then(r => r.json()).then(d => {
      if(d && Object.keys(d).length > 0) setFormData(d);
      setLoading(false);
    }).catch(e => setLoading(false));
  }, []);

  const handleChange = (e) => {
    const { name, value, type, checked } = e.target;
    setFormData(p => ({ ...p, [name]: type === 'checkbox' ? checked : value }));
  };

  const handleNested = (c, f, v) => setFormData(p => ({ ...p, [c]: { ...p[c], [f]: v } }));
  const handleArray = (f, i) => setFormData(p => {
    const arr = p[f] || [];
    return { ...p, [f]: arr.includes(i) ? arr.filter(x => x !== i) : [...arr, i] };
  });

  const getProgress = () => {
    const reqFields = ['nombre','nit','razon_social','direccion','ciudad','telefono','email','propietario','regimen_tributario','resolucion_dian','prefijo_facturacion','rango_desde','rango_hasta','fecha_vencimiento_resolucion','hora_apertura','hora_cierre','hora_corte'];
    const filled = reqFields.filter(x => formData[x] && String(formData[x]).trim() !== '');
    return Math.round((filled.length / reqFields.length) * 100);
  };

  const getDaysUntilExpiry = () => {
    if(!formData.fecha_vencimiento_resolucion) return 0;
    const diff = new Date(formData.fecha_vencimiento_resolucion).getTime() - Date.now();
    return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  };

  const isExpiring = () => {
    const days = getDaysUntilExpiry();
    return days > 0 && days < 30;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setMessage(null);
    if(!formData.nit) return setMessage({ type: 'error', text: 'El NIT es obligatorio.' });
    if(formData.hora_corte === formData.hora_apertura) return setMessage({ type: 'error', text: 'La hora de corte no puede ser igual a la de apertura.' });
    if((formData.dias_activos || []).length === 0) return setMessage({ type: 'error', text: 'Debe estar activo al menos un día.' });
    if(!Object.values(formData.medios_pago || {}).some(Boolean)) return setMessage({ type: 'error', text: 'Debe activar al menos un medio de pago.' });
    
    const emailRegex = /^[^s@]+@[^s@]+.[^s@]+$/;
    if(formData.alertas.email_alertas && !emailRegex.test(formData.alertas.email_alertas)) {
      return setMessage({ type: 'error', text: 'El correo de alertas no es válido.' });
    }

    setSaving(true);
    try {
      const res = await fetch('/api/restaurante', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify(formData) 
      });
      if(res.ok) {
        setMessage({ type: 'success', text: 'Configuración guardada correctamente.' });
        setTimeout(() => setMessage(null), 3000);
      } else throw new Error('Error al guardar');
    } catch(err) {
      setMessage({ type: 'error', text: 'Error de red al guardar.' });
    }
    setSaving(false);
  };

  if(loading) return <div className="p-10 text-center">🔄 Cargando...</div>;

  return (
    <div className="max-w-[1000px] mx-auto pb-20 animate-in fade-in">
      <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6 flex justify-between items-center sticky top-4 z-50">
        <div>
          <h2 className="text-2xl font-black text-slate-800">Mi Restaurante</h2>
          <p className="text-sm text-gray-500">Mi Restaurante está {getProgress()}% configurado.</p>
        </div>
        <div className="flex gap-4 items-center">
          <div className="w-32 bg-gray-100 h-2 rounded-full overflow-hidden">
             <div className={`h-full transition-all ${getProgress() > 80 ? 'bg-green-500' : getProgress() < 40 ? 'bg-red-500' : 'bg-orange-500'}`} style={{width: `${getProgress()}%`}}></div>
          </div>
          <button onClick={handleSubmit} disabled={saving} className="btn bg-slate-900 text-white hover:bg-slate-800 px-4 py-3 rounded-lg flex items-center gap-2 font-bold text-sm shadow-md">
            {saving ? '🔄' : '💾'} Guardar Cambios
          </button>
        </div>
      </div>

      {message && (
        <div className={`p-4 mb-6 rounded-xl font-bold flex items-center gap-2 ${message.type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
          {message.type === 'error' ? '⚠' : '✓'} {message.text}
        </div>
      )}

      <div className="space-y-6">
        <div className="bg-white border rounded-2xl p-6">
          <h3 className="font-black flex items-center gap-2 mb-4">🏪 1. Datos del negocio</h3>
          <div className="grid grid-cols-2 gap-4">
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Nombre Comercial</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="nombre" value={formData.nombre} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">NIT</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="nit" value={formData.nit} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Razón Social</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="razon_social" value={formData.razon_social} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Logo URL</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="logo_url" value={formData.logo_url} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Dirección</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="direccion" value={formData.direccion} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Ciudad</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="ciudad" value={formData.ciudad} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Teléfono</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="telefono" value={formData.telefono} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Correo Electrónico</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="email" value={formData.email} onChange={handleChange}/></div>
             <div><label className="text-xs font-bold text-gray-500 block mb-1">Nombre Propietario</label><input className="border p-2 rounded-lg w-full bg-gray-50 text-sm" name="propietario" value={formData.propietario} onChange={handleChange}/></div>
          </div>
        </div>

        <div className="bg-white border rounded-2xl p-6">
          <h3 className="font-black flex items-center gap-2 mb-4">🏛️ 2. Configuración fiscal DIAN</h3>
          {isExpiring() && <div className="bg-orange-50 text-orange-800 p-3 rounded-lg border border-orange-200 mb-4 text-xs font-bold flex gap-2">⚠️ La resolución vence en menos de 30 días</div>}

// --- WIDGET: CATEGORÍAS DEL MENÚ (PASO 1) ---
 function MenuCategoriasBlock({ restauranteId, categorias = null, setCategorias = null, platos = [], activeCatNames = [], setActiveCatNames = () => {}, setFocusCatName = () => {}, platosRef = null }) {
  const [localCats, setLocalCats] = useState([
    { id: 'uuid-1', nombre: 'Entradas', canal: 'AMBOS', orden: 1, estado: 'ACTIVA', horario: null },
    { id: 'uuid-2', nombre: 'Almuerzos Ejecutivos', canal: 'SALON', orden: 2, estado: 'ACTIVA', horario: { inicio: '12:00', fin: '15:00', dias: ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES'] } },
    { id: 'uuid-3', nombre: 'Pizzas Premium', canal: 'DELIVERY', orden: 3, estado: 'INACTIVA', horario: null }
  ]);

  const activeCategorias = categorias || localCats;
  const activeSetCategorias = setCategorias || setLocalCats;

  const [showModal, setShowModal] = useState(false);
  const [editingCategory, setEditingCategory] = useState(null);
  const [formError, setFormError] = useState('');
  const defaultForm = { nombre: '', canal: 'AMBOS', estado: 'ACTIVA', hasHorario: false, hora_inicio: '07:00', hora_fin: '22:00', dias: ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'DOMINGO'] };
  const [formData, setFormData] = useState({ ...defaultForm });
  const dragItem = useRef();
  const dragOverItem = useRef();
  const [expandedSchedule, setExpandedSchedule] = useState(null);
  const [inlineHorario, setInlineHorario] = useState({});

  const DIAS_SEMANA = [{ id: 'LUNES', lbl: 'L' }, { id: 'MARTES', lbl: 'M' }, { id: 'MIERCOLES', lbl: 'X' }, { id: 'JUEVES', lbl: 'J' }, { id: 'VIERNES', lbl: 'V' }, { id: 'SABADO', lbl: 'S' }, { id: 'DOMINGO', lbl: 'D' }];

  const handleOpenModal = (cat = null) => {
    setFormError('');
    if (cat) {
      setEditingCategory(cat);
      setFormData({ nombre: cat.nombre, canal: cat.canal, estado: cat.estado, hasHorario: cat.horario !== null, hora_inicio: cat.horario?.inicio || '07:00', hora_fin: cat.horario?.fin || '22:00', dias: cat.horario?.dias || ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'DOMINGO'] });
    } else {
      setEditingCategory(null);
      setFormData({ ...defaultForm });
    }
    setShowModal(true);
  };

  const handleSave = (e) => {
    e.preventDefault();
    setFormError('');
    const nombreLimpio = formData.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre de la categoría es obligatorio.');
    const isDuplicate = activeCategorias.some(c => c.nombre.toLowerCase() === nombreLimpio.toLowerCase() && c.id !== editingCategory?.id);
    if (isDuplicate) return setFormError('Ya existe una categoría con este nombre (Error 409).');
    const nuevaCategoria = {
      id: editingCategory ? editingCategory.id : `uuid-${Date.now()}`,
      nombre: nombreLimpio, canal: formData.canal,
      orden: editingCategory ? editingCategory.orden : (activeCategorias.length > 0 ? Math.max(...activeCategorias.map(c => c.orden)) + 1 : 1),
      estado: formData.estado,
      horario: formData.hasHorario ? { inicio: formData.hora_inicio, fin: formData.hora_fin, dias: formData.dias } : null
    };
    if (editingCategory) {
      activeSetCategorias(activeCategorias.map(c => c.id === editingCategory.id ? nuevaCategoria : c));
    } else {
      activeSetCategorias([...activeCategorias, nuevaCategoria]);
    }
    setShowModal(false);
  };

  const handleToggleEstado = (cat) => {
    const nuevoEstado = cat.estado === 'ACTIVA' ? 'INACTIVA' : 'ACTIVA';
    if (nuevoEstado === 'INACTIVA') {
      const ok = window.confirm(`⚠️ Al desactivar "${cat.nombre}" sus platos dejarán de aparecer en la carta.\n\n¿Continuar?`);
      if (!ok) return;
    }
    activeSetCategorias(activeCategorias.map(c => c.id === cat.id ? { ...c, estado: nuevoEstado } : c));
    if (nuevoEstado === 'ACTIVA') {
      setActiveCatNames(prev => prev.includes(cat.nombre) ? prev : [...prev, cat.nombre]);
    } else {
      setActiveCatNames(prev => prev.filter(n => n !== cat.nombre));
    }
    fetch('/api/categorias/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: cat.id, estado: nuevoEstado }) }).catch(() => {});
  };

  const handleDelete = (cat) => {
    const ok = window.confirm(`🗑️ ¿Eliminar la categoría "${cat.nombre}"?\n\nEsta acción es irreversible.`);
    if (!ok) return;
    activeSetCategorias(activeCategorias.filter(c => c.id !== cat.id));
  };

  const handleDragStart = (e, position) => { dragItem.current = position; };
  const handleDragEnter = (e, position) => { dragOverItem.current = position; };
  const handleDragEnd = () => {
    const copy = [...activeCategorias];
    const dragged = copy[dragItem.current];
    copy.splice(dragItem.current, 1);
    copy.splice(dragOverItem.current, 0, dragged);
    activeSetCategorias(copy.map((c, i) => ({ ...c, orden: i + 1 })));
    dragItem.current = null; dragOverItem.current = null;
  };

  const handleToggleScheduleActive = (cat) => {
    if (cat.horario) {
      activeSetCategorias(activeCategorias.map(c => c.id === cat.id ? { ...c, horario: null } : c));
      setExpandedSchedule(null);
    } else {
      setInlineHorario(prev => ({ ...prev, [cat.id]: { inicio: '07:00', fin: '22:00', dias: ['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO','DOMINGO'] } }));
      setExpandedSchedule(cat.id);
    }
  };

  const toggleScheduleRow = (catId, currentHorario) => {
    if (expandedSchedule === catId) { setExpandedSchedule(null); return; }
    setInlineHorario(prev => ({ ...prev, [catId]: { inicio: currentHorario?.inicio || '07:00', fin: currentHorario?.fin || '22:00', dias: currentHorario?.dias || ['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO','DOMINGO'] } }));
    setExpandedSchedule(catId);
  };

  const handleInlineDayToggle = (catId, day) => {
    setInlineHorario(prev => {
      const dias = prev[catId]?.dias || [];
      return { ...prev, [catId]: { ...prev[catId], dias: dias.includes(day) ? dias.filter(d => d !== day) : [...dias, day] } };
    });
  };

  const handleSaveInlineSchedule = (cat) => {
    const h = inlineHorario[cat.id];
    if (!h || h.dias.length === 0) return;
    activeSetCategorias(activeCategorias.map(c => c.id === cat.id ? { ...c, horario: { inicio: h.inicio, fin: h.fin, dias: h.dias } } : c));
    setExpandedSchedule(null);
  };

  const toggleDay = (day) => {
    setFormData(f => ({ ...f, dias: f.dias.includes(day) ? f.dias.filter(d => d !== day) : [...f.dias, day] }));
  };

  const canalBadge = (canal) => {
    if (canal === 'SALON') return React.createElement('span', { className: 'text-[9px] font-black px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 uppercase tracking-wide' }, 'Salón');
    if (canal === 'DELIVERY') return React.createElement('span', { className: 'text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 uppercase tracking-wide' }, 'Delivery');
    return React.createElement('span', { className: 'text-[9px] font-black px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 uppercase tracking-wide' }, 'Ambos');
  };

  return (
    <div className="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden">
      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between px-6 py-4 border-b border-gray-100 gap-3">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center shadow-sm">⊞</div>
          <div>
            <h3 className="text-lg font-black text-slate-800 tracking-tight">1. Categorías de la Carta</h3>
            <p className="text-xs text-gray-500 font-medium">Arrastra para reordenar. Define dónde y cuándo aparecen tus platos.</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button className="btn bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 px-3 text-xs shadow-sm">☁ CSV</button>
          <button onClick={() => handleOpenModal()} className="btn bg-slate-900 text-white hover:bg-slate-800 py-2 px-4 text-xs shadow-md">+ Nueva Categoría</button>
        </div>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-left border-collapse">
          <thead>
            <tr className="bg-gray-50 border-b border-gray-200">
              <th className="px-3 py-2.5 w-8"></th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest">Nombre de la Categoría</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Canal Disponible</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Estado Inicial</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Restricción de Horario</th>
              <th className="px-4 py-2.5 text-[10px] font-black text-gray-400 uppercase tracking-widest text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            {[...activeCategorias].sort((a,b) => a.orden - b.orden).map((cat, index) => (
              <React.Fragment key={cat.id}>
                <tr
                  draggable onDragStart={(e) => handleDragStart(e, index)} onDragEnter={(e) => handleDragEnter(e, index)}
                  onDragEnd={handleDragEnd} onDragOver={(e) => e.preventDefault()}
                  className={`border-b border-gray-100 transition-colors cursor-grab active:cursor-grabbing hover:bg-slate-50 ${index % 2 === 1 ? 'bg-gray-50/40' : 'bg-white'} ${cat.estado === 'INACTIVA' ? 'opacity-55' : ''}`}
                >
                  <td className="px-3 py-3 text-gray-300 hover:text-indigo-400">⠿</td>
                  <td className="px-4 py-3">
                    <span className={`text-sm font-bold ${cat.estado === 'INACTIVA' ? 'text-gray-400 line-through' : 'text-slate-800'}`}>{cat.nombre}</span>
                    <span className="block text-[10px] text-gray-400 font-medium mt-0.5">{(platos || []).filter(p => p.categoria_nombre === cat.nombre || p.categoria_id === cat.id).length} platos</span>
                  </td>
                  <td className="px-4 py-3 text-center">{canalBadge(cat.canal)}</td>
                  <td className="px-4 py-3 text-center">
                    <div className="flex flex-col items-center gap-0.5">
                      <div onClick={() => handleToggleEstado(cat)} className={`relative w-9 h-5 flex items-center rounded-full px-0.5 cursor-pointer transition-colors ${cat.estado === 'ACTIVA' ? 'bg-emerald-500' : 'bg-gray-300'}`}>
                        <div className="w-3.5 h-3.5 bg-white rounded-full shadow-md transition-transform" style={{ transform: cat.estado === 'ACTIVA' ? 'translateX(16px)' : 'translateX(0)' }}></div>
                      </div>
                      <span className={`text-[9px] font-bold ${cat.estado === 'ACTIVA' ? 'text-emerald-600' : 'text-gray-400'}`}>{cat.estado === 'ACTIVA' ? 'Activa' : 'Inactiva'}</span>
                    </div>
                  </td>
                  <td className="px-4 py-3 text-center">
                    <div className="flex flex-col items-center gap-0.5">
                      <div onClick={() => handleToggleScheduleActive(cat)} className={`relative w-9 h-5 flex items-center rounded-full px-0.5 cursor-pointer transition-colors ${cat.horario ? 'bg-indigo-500' : 'bg-gray-300'}`}>

                      </div>
                      {cat.horario
                        ? <button onClick={() => toggleScheduleRow(cat.id, cat.horario)} className="text-[9px] font-bold text-indigo-600 hover:underline mt-0.5">{cat.horario.inicio} – {cat.horario.fin}</button>

                  <td className="px-4 py-3 text-center">
                    <div className="flex items-center justify-center gap-1">
                      <button onClick={() => {
                        if (cat.estado !== 'ACTIVA') handleToggleEstado(cat);
                        setFocusCatName(cat.nombre);
                        setTimeout(() => { if (platosRef && platosRef.current) platosRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
                      }} title="Ver platos" className="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-100 flex items-center justify-center transition-colors">≡</button>

                      <button onClick={() => handleDelete(cat)} title="Eliminar" className="w-7 h-7 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center transition-colors">✕</button>
                    </div>
                  </td>
                </tr>
                {expandedSchedule === cat.id && (
                  <tr className="bg-indigo-50/60 border-b border-indigo-100">
                    <td colSpan={6} className="px-6 py-4">
                      <div className="flex flex-wrap items-end gap-4">
                        <div>
                          <label className="text-[10px] font-black text-indigo-700 uppercase tracking-widest block mb-1">Inicio</label>

                        </div>
                        <div>
                          <label className="text-[10px] font-black text-indigo-700 uppercase tracking-widest block mb-1">Fin</label>
                          <input type="time" value={inlineHorario[cat.id]?.fin || '22:00'} onChange={e => setInlineHorario(p => ({ ...p, [cat.id]: { ...p[cat.id], fin: e.target.value } }))} className="border border-indigo-200 rounded-lg p-1.5 text-sm font-medium outline-none"/>
                        </div>
                        <div>
                          <label className="text-[10px] font-black text-indigo-700 uppercase tracking-widest block mb-1">Días Activos</label>
                          <div className="flex gap-1">
                            {DIAS_SEMANA.map(d => {
                              const sel = (inlineHorario[cat.id]?.dias || []).includes(d.id);
                              return <button key={d.id} onClick={() => handleInlineDayToggle(cat.id, d.id)} className={`w-7 h-7 rounded-lg text-[11px] font-black transition-all ${sel ? 'bg-indigo-600 text-white' : 'bg-white text-gray-400 border border-gray-200 hover:border-indigo-300'}`}>{d.lbl}</button>;
                            })}
                          </div>
                        </div>
                        <button onClick={() => handleSaveInlineSchedule(cat)} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">Guardar</button>
                        <button onClick={() => setExpandedSchedule(null)} className="bg-white text-gray-500 text-xs font-bold px-3 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors">Cancelar</button>
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
            {activeCategorias.length === 0 && (
              <tr><td colSpan={6} className="px-6 py-12 text-center text-gray-400 text-sm">No hay categorías. Crea la primera con "+ Nueva Categoría".</td></tr>
            )}
          </tbody>
        </table>
      </div>
      {/* MODAL FORMULARIO DE CATEGORÍA */}
      {showModal && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
          <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-in slide-in-from-bottom-8">
             <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 className="font-black text-slate-800">{editingCategory ? 'Editar Categoría' : 'Nueva Categoría'}</h3>
                <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-slate-800 bg-white p-1 rounded-lg border border-gray-200">✕</button>
             </div>
             
             <form onSubmit={handleSave} className="p-6">
                {formError && (
                  <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start gap-3 text-sm">
                    <span style={{fontSize:'15px', lineHeight:1}}>⚠️</span>
                    <p className="font-semibold">{formError}</p>
                  </div>
                )}

                <div className="space-y-5">
                   {/* Nombre */}
                   <div>
                      <label className="text-xs font-bold text-slate-700 mb-1.5 block">Nombre de la Categoría <span className="text-red-500">*</span></label>
                      <input type="text" value={formData.nombre} onChange={(e) => setFormData({...formData, nombre: e.target.value})} maxLength={50} placeholder="Ej: Entradas, Platos Fuertes..." className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all" required autoFocus />
                   </div>

                   <div className="grid grid-cols-2 gap-4">
                     {/* Canal */}
                     <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block">Canal Disponible <span className="text-red-500">*</span></label>
                        <select value={formData.canal} onChange={(e) => setFormData({...formData, canal: e.target.value})} className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-indigo-500 outline-none bg-white cursor-pointer">
                           <option value="AMBOS">Ambos (Salón y Delivery)</option>
                           <option value="SALON">Solo Salón (POS)</option>
                           <option value="DELIVERY">Solo Delivery / Apps</option>
                        </select>
                     </div>
                     {/* Estado Inicial */}
                     <div>
                        <label className="text-xs font-bold text-slate-700 mb-1.5 block">Estado Inicial <span className="text-red-500">*</span></label>
                        <select value={formData.estado} onChange={(e) => setFormData({...formData, estado: e.target.value})} className="w-full text-sm p-3 rounded-xl border border-gray-300 focus:border-indigo-500 outline-none bg-white cursor-pointer">
                           <option value="ACTIVA">🟢 Activa (Visible)</option>
                           <option value="INACTIVA">⚪ Inactiva (Oculta)</option>
                        </select>
                     </div>
                   </div>

                   {/* Horario de Disponibilidad */}
                   <div className="pt-4 border-t border-gray-100">
                      <div className="flex items-center justify-between mb-4">
                         <div>
                            <p className="text-sm font-bold text-slate-800">Restricción de Horario</p>
                            <p className="text-[10px] text-gray-500">Limita cuándo se puede pedir esta categoría.</p>
                         </div>
                         <div 
                           onClick={() => setFormData({...formData, hasHorario: !formData.hasHorario})}
                           className={`relative w-10 h-5 flex items-center rounded-full p-1 cursor-pointer transition-colors ${formData.hasHorario ? 'bg-indigo-500' : 'bg-gray-300'}`}
                         >
                           <div className={`w-3.5 h-3.5 bg-white rounded-full shadow-md transform transition-transform ${formData.hasHorario ? 'translate-x-4.5' : 'translate-x-0'}`} style={{ transform: formData.hasHorario ? 'translateX(18px)' : 'translateX(0)' }}></div>
                         </div>
                      </div>

                      {formData.hasHorario && (
                         <div className="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl space-y-4 animate-in slide-in-from-top-2">
                            <div className="flex items-center gap-4">
                               <div className="flex-1">
                                  <label className="text-[10px] font-bold text-indigo-900 uppercase tracking-widest block mb-1">Hora Inicio (UTC-5)</label>
                                  <input type="time" value={formData.hora_inicio} onChange={(e) => setFormData({...formData, hora_inicio: e.target.value})} className="w-full p-2 rounded-lg border border-indigo-200 outline-none text-sm font-medium" />
                               </div>
                               <div className="flex-1">
                                  <label className="text-[10px] font-bold text-indigo-900 uppercase tracking-widest block mb-1">Hora Fin (UTC-5)</label>
                                  <input type="time" value={formData.hora_fin} onChange={(e) => setFormData({...formData, hora_fin: e.target.value})} className="w-full p-2 rounded-lg border border-indigo-200 outline-none text-sm font-medium" />
                               </div>
                            </div>
                            <div>
                               <label className="text-[10px] font-bold text-indigo-900 uppercase tracking-widest block mb-2">Días Activos</label>
                               <div className="flex flex-wrap gap-1.5">
                                  {DIAS_SEMANA.map(dia => {
                                    const isSelected = formData.dias.includes(dia.id);
                                    return (
                                      <button 
                                        type="button" 
                                        key={dia.id} 
                                        onClick={() => toggleDay(dia.id)}
                                        className={`w-8 h-8 rounded-lg text-xs font-black transition-all ${isSelected ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-400 border border-gray-200 hover:border-indigo-300'}`}
                                      >
                                        {dia.lbl}
                                      </button>
                                    )
                                  })}
                               </div>
                               {formData.dias.length === 0 && <p className="text-[10px] text-red-500 mt-1 font-bold">Debes seleccionar al menos un día.</p>}
                            </div>
                         </div>
                      )}
                   </div>
                </div>

                <div className="mt-8 flex gap-3">
                   <button type="button" onClick={() => setShowModal(false)} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-slate-700 text-sm font-bold rounded-xl transition-colors">Cancelar</button>
                   <button type="submit" disabled={formData.hasHorario && formData.dias.length === 0} className="flex-[2] py-3 bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold rounded-xl transition-colors shadow-lg shadow-slate-900/20">Guardar Categoría</button>
                </div>
             </form>
          </div>
        </div>
      )}
    </div>
  );
}

// --- WIDGET: PLATOS E ÍTEMS DEL MENÚ (PASO 2) ---
function MenuPlatosBlock({ restauranteId, categorias, platos = null, setPlatos = null, activeCatNames = [], focusCatName = null, setFocusCatName = () => {}, platosRef = null }) {
  // 1. Estado de la Base de Datos (Soporte dual para props o estado local)
  const [localPlatos, setLocalPlatos] = useState([
    { id: 'p-1', categoria_id: 'uuid-1', nombre: 'Empanadas (x3)', descripcion: 'Crujientes de carne desmechada', precio_venta: 12000, costo_produccion: 4000, canal: 'AMBOS', estado: 'DISPONIBLE', iva_pct: 8, margen_bruto: 66.67, foto_url: null },
    { id: 'p-2', categoria_id: 'uuid-1', nombre: 'Ceviche de Chicharrón', descripcion: '', precio_venta: 22000, costo_produccion: 8000, canal: 'SALON', estado: 'DISPONIBLE', iva_pct: 8, margen_bruto: 63.64, foto_url: null },
    { id: 'p-3', categoria_id: 'uuid-2', nombre: 'Bandeja Paisa Tradicional', descripcion: 'Frijoles, chicharrón, chorizo, aguacate', precio_venta: 32000, costo_produccion: 14000, canal: 'SALON', estado: 'AGOTADO', iva_pct: 8, margen_bruto: 56.25, foto_url: null },
    { id: 'p-4', categoria_id: 'uuid-2', nombre: 'Menú Ejecutivo Pollo', descripcion: 'Sopa, principio, arroz, jugo', precio_venta: 18000, costo_produccion: 7500, canal: 'AMBOS', estado: 'OCULTO', iva_pct: 8, margen_bruto: 58.33, foto_url: null },
  ]);

  const activePlatos = platos || localPlatos;
  const activeSetPlatos = setPlatos || setLocalPlatos;

  // 2. Estado de UI
  const [viewMode, setViewMode] = useState('accordion'); 
  const [expandedCats, setExpandedCats] = useState(['uuid-1', 'uuid-2']); 
  const [showFormModal, setShowFormModal] = useState(false);
  const [showImportModal, setShowImportModal] = useState(false);
  const [editingPlato, setEditingPlato] = useState(null);
  const [formError, setFormError] = useState('');
  
  // 3. Formulario
  const defaultForm = { nombre: '', descripcion: '', precio_venta: '', costo_produccion: '', categoria_id: '', canal: 'AMBOS', estado: 'DISPONIBLE', iva_pct: '8' };
  const [formData, setFormData] = useState({ ...defaultForm });

  const formatCOP = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(val);

  // --- LÓGICA CRUD & REGLAS DE NEGOCIO ---
  const handleOpenForm = (plato = null) => {
    setFormError('');
    if (plato) {
      setEditingPlato(plato);
      setFormData({ ...plato });
    } else {
      setEditingPlato(null);
      const primeraActiva = categorias.find(c => c.estado === 'ACTIVA');
      setFormData({ ...defaultForm, categoria_id: primeraActiva ? primeraActiva.id : '' });
    }
    setShowFormModal(true);
  };

  const handleSavePlato = (e) => {
    e.preventDefault();
    setFormError('');

    const catPadre = categorias.find(c => c.id === formData.categoria_id);
    if (!catPadre) return setFormError('Debes seleccionar una categoría.');
    if (catPadre.estado !== 'ACTIVA') return setFormError('Error 400: La categoría seleccionada está inactiva.');

    const nombreLimpio = formData.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre del plato es obligatorio.');
    
    const precio = Number(formData.precio_venta);
    if (!Number.isInteger(precio) || precio <= 0) return setFormError('El precio de venta debe ser un número entero positivo sin centavos.');

    const isDuplicate = activePlatos.some(p => p.categoria_id === formData.categoria_id && p.nombre.toLowerCase() === nombreLimpio.toLowerCase() && p.id !== editingPlato?.id);
    if (isDuplicate) return setFormError(`Error 409: Ya existe un plato llamado "${nombreLimpio}" en esta categoría.`);

    if (catPadre.canal === 'SALON' && formData.canal !== 'SALON') return setFormError('Error: Este plato no puede ser Delivery/Ambos porque su categoría es Solo Salón.');
    if (catPadre.canal === 'DELIVERY' && formData.canal !== 'DELIVERY') return setFormError('Error: Este plato no puede ser Salón/Ambos porque su categoría es Solo Delivery.');

    let margen = null;
    const costo = Number(formData.costo_produccion);
    if (costo >= 0 && precio > 0 && formData.costo_produccion !== '') {
      margen = Number((((precio - costo) / precio) * 100).toFixed(2));
    }

    const nuevoPlato = {
      ...formData,
      id: editingPlato ? editingPlato.id : `plato-${Date.now()}`,
      nombre: nombreLimpio,
      precio_venta: precio,
      costo_produccion: costo >= 0 && formData.costo_produccion !== '' ? costo : null,
      margen_bruto: margen,
      iva_pct: Number(formData.iva_pct)
    };

    if (editingPlato) {
      activeSetPlatos(activePlatos.map(p => p.id === editingPlato.id ? nuevoPlato : p));
      console.log(`[Evento Backend Simulado] PUT /api/carta/platos/${nuevoPlato.id}`);
      if (editingPlato.precio_venta !== nuevoPlato.precio_venta) {
         console.log('⚠️ [Regla 4 Aplicada] Precio modificado. Las órdenes ABIERTAS en el módulo de Operaciones conservan el precio anterior.');
      }
    } else {
      activeSetPlatos([...activePlatos, nuevoPlato]);
      console.log(`[Evento] plato.creado: ${nuevoPlato.id}. Operaciones y Delivery sincronizados.`);
    }

    setShowFormModal(false);
  };

  const handleToggleEstado = (plato, nuevoEstado) => {
    activeSetPlatos(activePlatos.map(p => p.id === plato.id ? { ...p, estado: nuevoEstado } : p));
    if (nuevoEstado === 'AGOTADO') console.log(`[Evento WebSocket] plato.agotado: ${plato.id} bloqueado en Operaciones y Delivery.`);
    if (nuevoEstado === 'DISPONIBLE') console.log(`[Evento WebSocket] plato.disponible: ${plato.id} reactivado.`);
  };

  const toggleAccordion = (catId) => {
    if (expandedCats.includes(catId)) setExpandedCats(expandedCats.filter(id => id !== catId));
    else setExpandedCats([...expandedCats, catId]);
  };

  const categoriasConPlatos = categorias.filter(c => activeCatNames.includes(c.nombre));

  return (
    <div ref={platosRef} className="bg-white rounded-3xl border border-gray-200 p-0 shadow-sm overflow-hidden border-l-4 border-l-emerald-500 flex flex-col">
      <div className="p-6 border-b border-gray-100 bg-white relative z-10">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center">🍽</div>
            <div>
              <h3 className="text-lg font-black text-slate-800 tracking-tight">2. Platos e Ítems (El Core)</h3>
              <p className="text-xs text-gray-500">Agrega el producto que venderás. Sincroniza con Operaciones, Delivery e Inventario.</p>
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <div className="bg-gray-100 p-1 rounded-lg flex items-center mr-2">
              <button onClick={() => setViewMode('accordion')} className={`p-1.5 rounded transition-colors ${viewMode === 'accordion' ? 'bg-white shadow-sm text-slate-800' : 'text-gray-400 hover:text-slate-600'}`} title="Vista de Lista">≡</button>
              <button onClick={() => setViewMode('table')} className={`p-1.5 rounded transition-colors ${viewMode === 'table' ? 'bg-white shadow-sm text-slate-800' : 'text-gray-400 hover:text-slate-600'}`} title="Vista de Tabla">⊞</button>
            </div>
            <button onClick={() => setShowImportModal(true)} className="btn bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 px-3 text-xs shadow-sm">☁ Importar CSV</button>
            <button onClick={() => handleOpenForm()} className="btn bg-emerald-500 text-white hover:bg-emerald-600 py-2 px-4 text-xs shadow-md shadow-emerald-500/20">+ Agregar Plato</button>
          </div>
        </div>
      </div>

      <div className="bg-gray-50/50 flex-1 relative min-h-[200px]">
        {activeCatNames.length === 0 ? (
          <div className="flex flex-col items-center justify-center py-16 px-6 text-center">
            <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4 text-gray-300">⊞</div>
            <h4 className="text-sm font-bold text-slate-600 mb-2">Activa una categoría arriba para ver sus platos</h4>
            <p className="text-xs text-gray-400 max-w-sm">Usa los toggles en la tabla de Categorías para seleccionar qué grupos quieres revisar. Solo verás los platos de las categorías activas.</p>
          </div>
        ) : (
          <React.Fragment>
        {viewMode === 'accordion' && (
          <div className="p-6 space-y-4">
            {categoriasConPlatos.sort((a,b)=>a.orden-b.orden).map(cat => {
              const platosCat = filteredPlatos.filter(p => p.categoria_id === cat.id);
              const isExpanded = expandedCats.includes(cat.id);
              return (
                <div key={cat.id} className="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden transition-all">
                  <div 
                    className="p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 transition-colors"
                    onClick={() => toggleAccordion(cat.id)}
                  >
                    <div className="flex items-center gap-3">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center bg-gray-100 text-gray-500 transition-transform ${isExpanded ? 'rotate-180' : ''}`}>
                         ▼
                      </span>
                      <h4 className={`font-bold text-sm ${cat.estado === 'INACTIVA' ? 'text-gray-400 line-through' : 'text-slate-800'}`}>{cat.nombre}</h4>
                      <span className="text-[10px] font-bold bg-gray-100 text-gray-500 px-2 py-0.5 rounded">{platosCat.length} ítems</span>
                    </div>
                    {cat.estado === 'INACTIVA' && <span className="text-[10px] font-black text-red-500 uppercase bg-red-50 px-2 py-1 rounded tracking-widest">Cat. Inactiva</span>}
                  </div>

                  {isExpanded && (
                    <div className="border-t border-gray-100 p-2 bg-gray-50">
                      {platosCat.length === 0 ? (
                        <div className="p-8 text-center text-gray-400 text-sm">No hay platos en esta categoría.</div>
                      ) : (
                        <div className="space-y-2">
                          {platosCat.map(plato => (
                            <div key={plato.id} className={`bg-white border rounded-xl p-3 flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all hover:border-emerald-200 ${plato.estado === 'OCULTO' ? 'opacity-50 border-gray-200' : 'border-gray-100'} ${focusCatName && (plato.categoria_nombre === focusCatName || plato.categoria === focusCatName) ? 'border-emerald-400 ring-1 ring-emerald-200 bg-emerald-50/30' : ''}`}>
                              <div className="flex items-center gap-4 flex-1 min-w-0">
                                <div className="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-gray-300 shrink-0 border border-gray-200 overflow-hidden">
                                  {plato.foto_url ? <img src={plato.foto_url} alt="Plato" className="w-full h-full object-cover"/> : 🖼}
                                </div>
                                <div className="flex-1 min-w-0">
                                  <div className="flex items-center gap-2 mb-1">
                                    <h5 className="font-bold text-slate-800 text-sm truncate">{plato.nombre}</h5>
                                    {plato.estado === 'DISPONIBLE' && <span className="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_5px_#10B981]"></span>}
                                    {plato.estado === 'AGOTADO' && <span className="text-[9px] font-black uppercase text-red-600 bg-red-100 px-1.5 py-0.5 rounded">Agotado</span>}
                                    {plato.estado === 'OCULTO' && <span className="text-[9px] font-black uppercase text-gray-500 bg-gray-200 px-1.5 py-0.5 rounded">Oculto</span>}
                                  </div>

// --- WIDGET: MODIFICADORES Y VARIANTES (PASO 3) ---
function MenuModificadoresBlock({ restauranteId, platos }) {
  // 1. Estado de la Base de Datos (DINÁMICO)
  const [grupos, setGrupos] = useState([]);
  const [opciones, setOpciones] = useState([]);
  const [loading, setLoading] = useState(true);

  // Carga inicial de datos
  useEffect(() => {
    fetchModificadores();
  }, []);

  const fetchModificadores = async () => {
    try {
      const resp = await fetch('/api/modificadores');
      const data = await resp.json();
      const lista = Array.isArray(data) ? data : [];
      
      setGrupos(lista);
      setLoading(false);
    } catch (err) {
      console.error('Error cargando modificadores:', err);
      setLoading(false);
    }
  };

  const [vinculos, setVinculos] = useState([
    { plato_id: 'p-3', grupo_id: 'g-2', orden_en_plato: 1 },
  ]);

  // 2. Estado UI
  const [viewMode, setViewMode] = useState('biblioteca'); // 'biblioteca' | 'por_plato'
  const [selectedPlatoId, setSelectedPlatoId] = useState(platos.length > 0 ? platos[0].id : null);
  
  const [showGroupModal, setShowGroupModal] = useState(false);
  const [editingGroup, setEditingGroup] = useState(null);
  
  const [showOptionModal, setShowOptionModal] = useState(false);
  const [activeGroupIdForOption, setActiveGroupIdForOption] = useState(null);
  const [editingOption, setEditingOption] = useState(null);
  
  const [formError, setFormError] = useState('');

  // 3. Formularios
  const defaultGroupForm = { nombre: '', tipo_seleccion: 'UNICA', min_selecciones: 1, max_selecciones: 1, estado: 'ACTIVO' };
  const [groupForm, setGroupForm] = useState({ ...defaultGroupForm });

  const defaultOptionForm = { nombre: '', precio_adicional: '', estado: 'DISPONIBLE' };
  const [optionForm, setOptionForm] = useState({ ...defaultOptionForm });

  const formatCOP = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(val);

  // --- LÓGICA DE GRUPOS ---
  const handleOpenGroupForm = (grupo = null) => {
    setFormError('');
    if (grupo) {
      setEditingGroup(grupo);
      setGroupForm({ ...grupo });
    } else {
      setEditingGroup(null);
      setGroupForm({ ...defaultGroupForm });
    }
    setShowGroupModal(true);
  };

  const handleGroupTypeChange = (tipo) => {
    let min = groupForm.min_selecciones;
    let max = groupForm.max_selecciones;

    // Regla 4: Tipo UNICA fuerza min 1 max 1
    if (tipo === 'UNICA') { min = 1; max = 1; }
    else if (tipo === 'OPCIONAL_UNICA') { min = 0; max = 1; }
    else if (tipo === 'MULTIPLE') { min = Math.max(1, min); max = max || 2; }
    else if (tipo === 'OPCIONAL_MULTIPLE') { min = 0; }
    
    setGroupForm({ ...groupForm, tipo_seleccion: tipo, min_selecciones: min, max_selecciones: max });
  };

  const handleSaveGroup = (e) => {
    e.preventDefault();
    setFormError('');

    const nombreLimpio = groupForm.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre del grupo es obligatorio.');
    
    // Regla 2: Único en restaurante
    const isDuplicate = grupos.some(g => g.nombre.toLowerCase() === nombreLimpio.toLowerCase() && g.id !== editingGroup?.id);
    if (isDuplicate) return setFormError('Error 409: Ya existe un grupo con este nombre.');

    const nuevoGrupo = { ...groupForm, id: editingGroup ? editingGroup.id : `g-${Date.now()}`, nombre: nombreLimpio };

    if (editingGroup) {
      setGrupos(grupos.map(g => g.id === editingGroup.id ? nuevoGrupo : g));
      console.log(`[Evento] Grupo actualizado: ${nuevoGrupo.id}`);
    } else {
      setGrupos([...grupos, nuevoGrupo]);
      console.log(`[Evento] Grupo creado: ${nuevoGrupo.id}`);
    }
    setShowGroupModal(false);
  };

  const handleToggleGroupState = (grupo) => {
    const nuevoEstado = grupo.estado === 'ACTIVO' ? 'INACTIVO' : 'ACTIVO';
    // Automatización 3: Advertencia si es obligatorio
    if (nuevoEstado === 'INACTIVO' && (grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE')) {
      const isLinked = vinculos.some(v => v.grupo_id === grupo.id);
      if (isLinked) {
        if (!window.confirm(`⚠️ Este grupo es obligatorio en uno o más platos. Desactivarlo puede impedir tomar órdenes correctamente.\n¿Deseas continuar?`)) return;
      }
    }
    setGrupos(grupos.map(g => g.id === grupo.id ? { ...g, estado: nuevoEstado } : g));
  };

  // --- LÓGICA DE OPCIONES ---
  const handleOpenOptionForm = (grupoId, opcion = null) => {
    setFormError('');
    setActiveGroupIdForOption(grupoId);
    if (opcion) {
      setEditingOption(opcion);
      setOptionForm({ ...opcion });
    } else {
      setEditingOption(null);
      setOptionForm({ ...defaultOptionForm });
    }
    setShowOptionModal(true);
  };

  const handleSaveOption = (e) => {
    e.preventDefault();
    setFormError('');

    const nombreLimpio = optionForm.nombre.trim();
    if (!nombreLimpio) return setFormError('El nombre de la opción es obligatorio.');
    
    // Regla 3: Precio >= 0
    const precio = Number(optionForm.precio_adicional);
    if (!Number.isInteger(precio) || precio < 0) return setFormError('El precio debe ser un número entero mayor o igual a cero (no se permiten descuentos).');

    // Validación duplicado en el mismo grupo
    const isDuplicate = opciones.some(o => o.grupo_id === activeGroupIdForOption && o.nombre.toLowerCase() === nombreLimpio.toLowerCase() && o.id !== editingOption?.id);
    if (isDuplicate) return setFormError('Error 409: Ya existe una opción con este nombre en el grupo.');

    const nuevaOpcion = {
      ...optionForm,
      id: editingOption ? editingOption.id : `o-${Date.now()}`,
      grupo_id: activeGroupIdForOption,
      nombre: nombreLimpio,
      precio_adicional: precio,
      orden: editingOption ? editingOption.orden : (opciones.filter(o=>o.grupo_id===activeGroupIdForOption).length + 1)
    };

    if (editingOption) {
      setOpciones(opciones.map(o => o.id === editingOption.id ? nuevaOpcion : o));
      // Automatización 4: Conservar precio en ordenes abiertas
      if (editingOption.precio_adicional !== nuevaOpcion.precio_adicional) {
        console.log('⚠️ [Regla 6 Aplicada] Precio de opción editado. Las órdenes ABIERTAS conservan el precio original.');
      }
    } else {
      setOpciones([...opciones, nuevaOpcion]);
    }
    setShowOptionModal(false);
  };

  const handleToggleOptionState = (opcion, nuevoEstado) => {
    setOpciones(opciones.map(o => o.id === opcion.id ? { ...o, estado: nuevoEstado } : o));
    // Automatización 2: WebSocket
    if (nuevoEstado === 'AGOTADO') console.log(`[Evento WebSocket] opcion.agotada: ${opcion.nombre}. Operaciones la bloquea inmediatamente.`);
  };

  // --- LÓGICA DE VINCULACIÓN ---
  const toggleVinculo = (platoId, grupoId) => {
    const isLinked = vinculos.some(v => v.plato_id === platoId && v.grupo_id === grupoId);
    if (isLinked) {
      // Automatización 5: Desvincular obligatorio
      const grupo = grupos.find(g => g.id === grupoId);
      if (grupo && (grupo.tipo_seleccion === 'UNICA' || grupo.tipo_seleccion === 'MULTIPLE')) {
        console.log(`⚠️ [Alerta Generada] Desvinculaste el grupo obligatorio "${grupo.nombre}" del plato.`);
      }
      setVinculos(vinculos.filter(v => !(v.plato_id === platoId && v.grupo_id === grupoId)));
      console.log(`[Evento] Modificador desvinculado de plato.`);
    } else {
      // Automatización 1
      const nuevoOrden = vinculos.filter(v => v.plato_id === platoId).length + 1;
      setVinculos([...vinculos, { plato_id: platoId, grupo_id: grupoId, orden_en_plato: nuevoOrden }]);
      console.log(`[Evento] modificador.vinculado: Operaciones actualiza UI del plato sin recargar.`);
    }
  };

  return (

// --- 8. VIEW: CARTA & MENÚ ---
function ViewMenu() {
  const [menuTab, setMenuTab] = useState('configuracion'); // 'configuracion' | 'laboratorio'
  const restauranteActivoId = "restaurante-demo-123"; // Multi-tenant (Simulado)

  // --- NUEVOS ESTADOS PARA IMPORTACIÓN MASIVA ---
  const [importing, setImporting] = useState(false);
  const [importError, setImportError] = useState(null);
  const [importResult, setImportResult] = useState(null);
  const fileInputRef = useRef(null);

  const handleFileUpload = async (e) => {
    const file = e.target.files[0];
    if (!file || !file.name) return;

    setImporting(true);
    setImportError(null);
    setImportResult(null);

    const formData = new FormData();
    formData.append('file', file);

    try {
      const response = await fetch('/api/import', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || 'Error en la importación');
      }

      setImportResult(result);
      console.log('Importación exitosa:', result);
    } catch (err) {
      setImportError(err.message);
      console.error('Error al subir archivo:', err);
    } finally {
      setImporting(false);
      e.target.value = ''; // Reset
    }
  };


  // --- ESTADOS DINÁMICOS DESDE SQLITE ---
  const [categorias, setCategorias] = useState([]);
  const [platos, setPlatos] = useState([]);
  const [recetas, setRecetas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeCatNames, setActiveCatNames] = useState([]);
  const [focusCatName, setFocusCatName] = useState(null);
  const platosRef = useRef(null);

  // Carga inicial al montar la pestaña de Menú
  useEffect(() => {
    fetchMenuData();
  }, []);

  const fetchMenuData = async () => {
    setLoading(true);
    try {
      const [catRes, platoRes, recRes] = await Promise.all([
        fetch('/api/categorias'),
        fetch('/api/platos'),
        fetch('/api/recetas')
      ]);
      
      const [catJson, platoJson, recJson] = await Promise.all([
        catRes.json(),
        platoRes.json(),
        recRes.json()
      ]);
      
      const catData = Array.isArray(catJson) ? catJson : [];
      const platoData = Array.isArray(platoJson) ? platoJson : [];
      const recData = Array.isArray(recJson) ? recJson : [];
      
      setCategorias(catData.map(c => ({ ...c, estado: 'INACTIVA' })));
      setPlatos(platoData);
      setRecetas(recData);
    } catch (err) {
      console.error('Error cargando datos del menú:', err);
    } finally {
      setLoading(false);
    }
  };

  // Escuchar eventos de WebSocket para refresco automático
  useEffect(() => {
    const handleWSMessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'import.completa' || msg.type === 'dashboard.refresh') {
          console.log('[WS] Refrescando datos de menú tras importación...');

            <h4 className="text-lg font-bold text-slate-800 mb-2">Enterprise</h4>
            <div className="text-3xl font-black text-slate-900 mb-4">$1,800+<span className="text-sm font-medium text-gray-400">/mes</span></div>
            <button className="btn btn--dark w-full text-xs">Contactar Ventas</button>
          </div>
        </div>
        <div className="pt-body bg-white">
          {pricingData.map((section, sIdx) => (
            <React.Fragment key={sIdx}>
              <div className="pt-category">{section.category}</div>
              {section.features.map((feature, fIdx) => (
                <div className="pt-row" key={fIdx}>
                  <div className="pt-cell feature-col">{feature.name}</div>
                  <div className="pt-cell">{feature.tiers[0] ? <Check className="pt-check" /> : <Minus className="pt-minus" />}</div>
                  <div className="pt-cell bg-emerald-50/30">{feature.tiers[1] ? <Check className="pt-check" /> : <Minus className="pt-minus" />}</div>
                  <div className="pt-cell">{feature.tiers[2] ? <Check className="pt-check text-blue-500" /> : <Minus className="pt-minus" />}</div>
                </div>
              ))}
            </React.Fragment>
          ))}
        </div>
      </div>
    </div>
  );
}


// =========================================================================
// UTILIDADES COMPARTIDAS
// =========================================================================

function NavItemDark({ icon, label, isActive, onClick, highlight }) {
  const activeClass = highlight && isActive ? 'nav-item-dark--active bg-[rgba(255,255,255,0.1)] text-white' : isActive ? 'nav-item-dark--active' : '';
  return (
    <div className={`nav-item-dark ${activeClass}`} onClick={onClick}>
      <div className="flex items-center justify-center w-5">{icon}</div>
      <span>{label}</span>
    </div>
  );
}

function StatCard({ label, value, delta, isUp, icon, vsText, isDanger, highlightBadge }) {
  return (
    <div className="stat-card">
      <div>
        <div className="flex justify-between items-start mb-4">
          <div className={`stat-card__icon-wrap ${isDanger ? 'bg-red-50' : ''}`}>{icon}</div>
          {highlightBadge && <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-bold">{highlightBadge}</span>}
        </div>
        <div className="stat-card__label">{label}</div>
        <div className="stat-card__value mt-1">{value}</div>
      </div>
      <div className="flex items-center gap-2 mt-2">
        <div className={`delta-badge ${isDanger ? 'delta-badge--down' : (isUp === false ? 'delta-badge--neutral' : 'delta-badge--up')}`}>{delta}</div>
        <span className="text-[11px] font-medium text-gray-400 truncate">{vsText}</span>
      </div>
    </div>
  );
}

function IntegrationCard({ title, desc, icon, badgeText, badgeType, items, isSmall }) {
  const getBadgeClass = (type) => type === 'orange' ? 'bg-orange-100 text-orange-700 border border-orange-200' : type === 'blue' ? 'bg-blue-100 text-blue-700 border border-blue-200' : 'bg-gray-100 text-gray-600 border border-gray-200';
  const getIconClass = (type) => type === 'orange' ? 'bg-orange-50 text-orange-600 border-orange-100' : type === 'blue' ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-slate-50 text-slate-600 border-slate-100';

  return (
    <div className={`bg-white rounded-2xl border border-gray-200 shadow-sm p-6 flex flex-col ${!isSmall && 'hover:shadow-md transition-shadow duration-200'}`}>
      <div className="flex justify-between items-start mb-4">
        <div className={`w-12 h-12 rounded-xl flex items-center justify-center border ${getIconClass(badgeType)} shadow-sm`}>{icon}</div>
        <span className={`text-[10px] font-bold uppercase tracking-widest px-2 py-1 rounded-md ${getBadgeClass(badgeType)}`}>{badgeText}</span>
      </div>
      <h3 className={`${isSmall ? 'text-lg' : 'text-xl'} font-bold text-slate-900 mb-1`}>{title}</h3>
      <p className="text-sm text-gray-500 mb-5 flex-1">{desc}</p>
      <div className="flex flex-wrap gap-2 pt-4 border-t border-gray-100">
        {items.map((item, idx) => (
          item.highlight ? <div key={idx} className="app-tag bg-blue-50 border-blue-100 text-blue-800"><Link2 size={12} className="opacity-50"/> {item.name}</div>
          : <div key={idx} className="app-tag"><Link2 size={12} className="text-gray-400"/> {item.name}</div>
        ))}
      </div>
      {!isSmall && <button className="w-full mt-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold rounded-xl transition-colors">Configurar Módulo</button>}
    </div>
  );
}

function getTabTitle(tab) {
  const titles = {
    dashboard: 'Hola, Daniel 👋',
    ventas: 'Ventas Diarias',
    finanzas: 'Finanzas & Cumplimiento',
    operaciones: 'Operaciones de Salón', 
    inventario: 'Kardex & Proveedores',
    delivery: 'Hub de Domicilios',
    marketing: 'Crecimiento y Campañas', 
    reservas: 'Reservas & CRM',
    fidelizacion: 'Programa VIP',
    eventos: 'Eventos & Catering',
    rrhh: 'Talento y RRHH',
    data: 'Data & Insights',
    restaurante: 'Perfil del Restaurante',
    menu: 'Carta & Menú (Laboratorio)',
    conectores: 'Directorio de Aplicaciones',
    billing: 'Configuración de Plan',
    brain: 'Brain IA (El Cerebro)'
  };
  return titles[tab] || 'Módulo Operativo';
}
      
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
